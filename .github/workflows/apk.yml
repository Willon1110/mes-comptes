name: APK Android
on:
  push:
    branches: [android]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK Android déjà présent sur la machine
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ls $ANDROID_HOME/platforms
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Construire l'APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk mes-comptes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mes-comptes-apk
          path: mes-comptes.apk
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create apk mes-comptes.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mes Comptes pour Android (build ${{ github.run_number }})" \
            --notes "Télécharge mes-comptes.apk sur ton téléphone Android et ouvre-le pour l'installer."
