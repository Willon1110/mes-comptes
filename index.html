  h+=fld("Couleur",`<div class="swatches">${PALETTE.map(c=>`<button type="button" class="sw ${d.color===c?"on":""}" style="--c:${c}" data-act="set" data-f="color" data-v="${c}" aria-label="Couleur ${c}"></button>`).join("")}</div>`);
  if(s.err) h+=`<div class="err" role="alert">${esc(s.err)}</div>`;
  h+=`</div><div class="actions"><button class="btn primary block" data-act="saveAccount">${isNew?"Ajouter le compte":"Enregistrer"}</button>${!isNew?`<button class="btn danger block" data-act="delAccount">Supprimer le compte</button>`:""}</div>`;
  return h;
}

/* ----- catégories ----- */
function sheetCats(){
  let h=sheetHead("Catégories","Touche une catégorie pour ses sous-catégories");
  h+=`<div class="card list">${cfg.categories.map(c=>`<button class="row" data-act="editCat" data-id="${c.id}"><div class="main"><div class="l">${esc(c.name)} ${c.special?`<span class="chip acc">${c.special==="birthday"?"anniversaires":"Noël"}</span>`:""}</div><div class="m">${c.subs.length?esc(c.subs.map(x=>x.name).join(", ")):"Aucune sous-catégorie"}</div></div>${I.right.replace('<svg','<svg width="16" height="16" style="color:var(--muted);flex:none"')}</button>`).join("")}</div>`;
  h+=`<h4>Nouvelle catégorie</h4><div style="display:flex;gap:8px">${inp("newCat","text",'placeholder="Ex. Vacances"')}<button class="btn" data-act="addCat">Créer</button></div>`;
  return h;
}
function sheetCatEdit(s){
  const c=cfg.categories.find(x=>x.id===s.id); if(!c) return sheetHead("Catégorie supprimée");
  const d=s.d, year=+TODAY.slice(0,4);
  let h=sheetHead(esc(c.name),c.special==="birthday"?"Anniversaires : prénom, date de naissance, budget":c.special==="christmas"?"Cadeaux de Noël : budget et réel par personne":"Sous-catégories")+`<div class="form">`;
  h+=`<div style="display:flex;gap:8px">${inp("name","text")}<button class="btn" data-act="renameCat">Renommer</button></div>`;
  if(c.special) h+=fld("Compte utilisé par défaut",sel("acc",cfg.accounts.map(a=>[a.id,a.name])));
  h+=`</div>`;
  const spent=(subId,y)=>Object.keys(TX).filter(k=>k.startsWith(y+"-")).reduce((a,k)=>a+effTx(k).filter(t=>t.kind==="expense"&&t.cat===c.name&&t.sub===subId).reduce((b,t)=>b+conv(t.amount,curOf(t.acc),cfg.planRate),0),0);
  if(c.special==="christmas"&&c.subs.length){
    const tb=c.subs.reduce((a,x)=>a+(+x.budget||0),0), tr=c.subs.reduce((a,x)=>a+spent(x.id,year),0);
    h+=`<div class="sumgrid" style="margin-top:14px"><div><span>Budget Noël ${year}</span><b>${fmt(tb,"EUR",0)}</b></div><div><span>Dépensé ${year}</span><b class="${tr>tb?"neg":""}">${fmt(tr,"EUR",0)}</b></div></div>`;
  }
  h+=`<h4>${c.special==="birthday"?"Anniversaires":c.special==="christmas"?"Personnes":"Sous-catégories"} (${c.subs.length})</h4><div class="card pad" style="padding-top:2px;padding-bottom:2px">`;
  if(!c.subs.length) h+=`<p class="note" style="margin:12px 0">Aucune pour l'instant.</p>`;
  c.subs.forEach(x=>{
    const key=`${c.id}:${x.id}`;
    h+=`<div class="subed"><div class="top"><input id="sb-${x.id}-n" data-sub="${key}:name" value="${esc(x.name)}" aria-label="Nom"><button class="mini" data-act="delSub" data-cat="${c.id}" data-id="${x.id}" aria-label="Supprimer ${esc(x.name)}">${I.trash}</button></div>`;
    if(c.special==="birthday"){ const nb=nextBirthday(x.birth); h+=`<div class="grid2">${fld("Date de naissance",`<input id="sb-${x.id}-b" type="date" data-sub="${key}:birth" value="${esc(x.birth||"")}">`)}${fld("Budget cadeau (€)",`<input id="sb-${x.id}-u" inputmode="decimal" data-sub="${key}:budget" value="${esc(numStr(x.budget))}" placeholder="0">`)}</div><small class="mut">${nb?`${ageOn(x.birth,nb)} ans le ${longDate(nb)} · dépensé ${year} : ${fmt(spent(x.id,year),"EUR",0)}`:"Ajoute la date pour le rappel annuel et l'âge."}</small>`; }
    if(c.special==="christmas"){ const r=spent(x.id,year), b=+x.budget||0, pct=b>0?r/b:0; h+=`<div class="grid2">${fld("Budget (€)",`<input id="sb-${x.id}-u" inputmode="decimal" data-sub="${key}:budget" value="${esc(numStr(x.budget))}" placeholder="0">`)}<div class="fld"><span>Réel ${year}</span><div style="font-weight:800;font-size:18px;padding-top:8px" class="${r>b&&b>0?"neg":""}">${fmt(r,"EUR",0)}</div></div></div><div class="bar"><i class="${pct>1?"over":pct>.85?"near":""}" style="width:${Math.min(100,pct*100).toFixed(1)}%"></i></div>`; }
    h+=`</div>`;
  });
  h+=`</div><h4>${c.special==="birthday"?"Ajouter un anniversaire":c.special==="christmas"?"Ajouter une personne":"Ajouter une sous-catégorie"}</h4><div class="form">`;
  if(c.special==="birthday") h+=`<div class="grid2">${fld("Prénom",inp("nsName","text",'placeholder="Léonard"'))}${fld("Date de naissance",inp("nsBirth","date"))}</div>${fld("Budget cadeau (€)",inp("nsBudget","text",'inputmode="decimal" placeholder="50"'))}`;
  else if(c.special==="christmas") h+=`<div class="grid2">${fld("Prénom",inp("nsName","text",'placeholder="Ingrid"'))}${fld("Budget (€)",inp("nsBudget","text",'inputmode="decimal" placeholder="60"'))}</div>`;
  else h+=fld("Nom",inp("nsName","text",'placeholder="Ex. Boulangerie"'));
  if(s.err) h+=`<div class="err" role="alert">${esc(s.err)}</div>`;
  h+=`<button class="btn" data-act="addSub">Ajouter</button></div>`;
  if(c.special) h+=`<p class="note">Avec un budget, ${c.special==="birthday"?"chaque anniversaire s'ajoute automatiquement au prévu du mois concerné, chaque année":"le budget de chaque personne s'ajoute au prévu de décembre, chaque année"}. Pour noter un cadeau, utilise + › Dépense › ${esc(c.name)} › la personne.</p>`;
  h+=`<div class="actions"><button class="btn danger block" data-act="delCat" data-id="${c.id}">Supprimer la catégorie</button></div>`;
  return h;
}
function makeSub(c,d){
  const name=(d.nsName||"").trim(); if(!name) return {err:"Indique un nom."};
  if(c.subs.some(x=>norm(x.name)===norm(name))) return {err:"Ce nom existe déjà dans cette catégorie."};
  const s={id:uid8(),name};
  if(c.special==="birthday"){ if(!isISO(d.nsBirth)) return {err:"Indique la date de naissance."}; s.birth=d.nsBirth; s.budget=r2(num(d.nsBudget)||0); }
  if(c.special==="christmas") s.budget=r2(num(d.nsBudget)||0);
  c.subs.push(s); d.nsName=""; d.nsBirth=""; d.nsBudget=""; return {sub:s};
}
function renameCategory(c,newName){
  const old=c.name; if(!newName||newName===old) return false;
  if(cfg.categories.some(x=>x!==c&&norm(x.name)===norm(newName))){ toast("Cette catégorie existe déjà"); return false; }
  c.name=newName; cfg.plans.forEach(p=>{ if(p.cat===old) p.cat=newName; });
  const docs=["config"]; for(const ym in TX){ let ch=false; TX[ym].forEach(t=>{ if(t.cat===old){ t.cat=newName; ch=true; } }); if(ch) docs.push("tx-"+ym); }
  changed(docs); return true;
}

/* ---------- direct ---------- */
function updateLive(){
  const s=topS(); if(!s||!s.d) return; const d=s.d;
  const r=document.querySelector('[data-live="rate"]');
  if(r){ const a=num(d.amtFrom), b=num(d.amtTo), f=num(d.fee)||0;
    if(a>0&&b>0){ const fromC=curOf(d.from), rate=fromC==="CHF"?b/a:a/b, eff=fromC==="CHF"?b/(a+f):(a+f)/b;
      r.innerHTML=`Taux obtenu : <b>1 CHF = ${rate.toFixed(4).replace(".",",")} €</b>${f?` · avec frais ${eff.toFixed(4).replace(".",",")}`:""} <span class="mut">(prévu ${String(cfg.planRate).replace(".",",")})</span>`; }
    else r.textContent=`Saisis le montant envoyé et reçu pour voir le taux obtenu. Taux prévu : ${String(cfg.planRate).replace(".",",")}.`; }
  const p=document.querySelector('[data-live="planrate"]');
  if(p){ const a=num(d.amtFrom); const t=planTransferAmounts({from:d.from,to:d.to,amount:a>0?a:0}); p.innerHTML=`Reçu prévu : <b>${fmt(t.amtTo,curOf(d.to))}</b> au taux de ${String(cfg.planRate).replace(".",",")}${t.fee?` · frais prévus ${fmt(t.fee,curOf(d.from))}`:""}`; }
  document.querySelectorAll('[data-live="irate"]').forEach(el=>{ const k=el.dataset.k, a=num(d["from:"+k]), b=num(d["to:"+k]); el.innerHTML=a>0&&b>0?`Taux obtenu : <b>${(b/a).toFixed(4).replace(".",",")}</b> <span class="mut">(prévu ${String(cfg.planRate).replace(".",",")})</span>`:"Saisis les deux montants pour voir le taux."; });
}

/* ---------- toast ---------- */
let toastT;
function toast(msg,undo){
  const el=document.getElementById("toast"); el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">Annuler</button>':""}`;
  el._undo=undo; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),undo?5000:2200);
}

/* ---------- événements ---------- */
const loading=()=>{ if(mode==="loading"){ toast("Chargement de tes données…"); return true; } return false; };
document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act, s=topS();
  switch(act){
    case "tab": ui.tab=a.dataset.tab; try{localStorage.setItem(LS+".tab",ui.tab)}catch(x){} render(); window.scrollTo(0,0); break;
    case "prevM": ui.ym=addMonths(ui.ym,-1); render(); break;
    case "nextM": ui.ym=addMonths(ui.ym,1); render(); break;
    case "prevY": ui.year--; render(); break;
    case "nextY": ui.year++; render(); break;
    case "goMonth": ui.ym=a.dataset.ym; ui.tab="mois"; render(); window.scrollTo(0,0); break;
    case "close": closeSheet(); break;
    case "back": popSheet(); break;
    case "fab": if(loading()) break; openSheet({type:"wizard",d:newWizard("tx")}); break;
    case "newPlan": if(loading()) break; openSheet({type:"wizard",d:newWizard("plan")}); break;
    case "newPlanIncome": pushSheet({type:"wizard",d:newWizard("plan","income")}); break;
    case "otherIncome": pushSheet({type:"wizard",d:newWizard("tx","income")}); break;
    case "editPlan": { const p=cfg.plans.find(x=>x.id===a.dataset.id); if(p) openSheet({type:"wizard",d:planToDraft(p)}); break; }
    case "editTx": { const f=findTx(a.dataset.id); if(!f) break; const w={type:"wizard",d:txToDraft(f.t)}; stack.length?pushSheet(w):openSheet(w); break; }
    case "set": { if(!s||!s.d) break; s.d[a.dataset.f]=a.dataset.v; const d=s.d;
      if(s.type==="wizard"&&a.dataset.f==="from"&&d.to===d.from) d.to=(cfg.accounts.find(x=>x.id!==d.from)||{}).id;
      renderSheet(); break; }
    case "wz": { const d=s.d, f=a.dataset.f, v=a.dataset.v;
      if(f==="kind") applyKind(d,v);
      else if(f==="cat"){ if(d.cat!==v){ d.sub=""; d.link=""; } d.cat=v; const c=catByName(v); if(c&&c.special&&c.acc&&accById(c.acc)) d.acc=c.acc; }
      else if(f==="sub"){ d.sub=v; applySub(d); }
      else { d[f]=v; if(f==="nature"&&v==="variable") d.link=""; }
      wzAdvance(s); renderSheet(); break; }
    case "wzBack": { const st=wizSteps(s.d), i=st.indexOf(s.d.step); s.d.step=st[Math.max(0,i-1)]; s.err=""; renderSheet(); break; }
    case "wzGo": s.d.step=a.dataset.v; s.err=""; renderSheet(); break;
    case "wzNext": { if(s.d.step==="amount"){ const err=validateDraft(s.d); if(err){ s.err=err; renderSheet(); break; } } if(s.d.step==="accounts"&&(!s.d.to||s.d.from===s.d.to)){ toast("Choisis deux comptes différents"); break; } wzAdvance(s); renderSheet(); break; }
    case "wzSave": wzSave(s); break;
    case "wzDel": { const d=s.d; if(d.mode==="plan") askConfirm("Supprimer ?","L'événement disparaît de tous les mois. Les opérations déjà pointées sont conservées et passent en « hors prévision ».","Supprimer l'événement",()=>{ cfg.plans=cfg.plans.filter(p=>p.id!==d.id); closeSheet(); changed(["config"]); toast("Événement supprimé"); });
      else askConfirm("Supprimer ?","Cette opération sera supprimée définitivement.","Supprimer",()=>{ const docs=new Set(); removeTx(d.id,docs); closeSheet(); changed([...docs]); toast("Opération supprimée"); }); break; }
    case "wzNewCat": { const n=(s.d.newCat||"").trim(); if(!n) break; let c=cfg.categories.find(x=>norm(x.name)===norm(n)); if(!c){ c={id:uid8(),name:n,subs:[]}; cfg.categories.push(c); changed(["config"]); } s.d.newCat=""; s.d.cat=c.name; s.d.sub=""; wzAdvance(s); renderSheet(); break; }
    case "wzNewSub": { const c=catByName(s.d.cat); if(!c) break; const r=makeSub(c,s.d); if(r.err){ toast(r.err); break; } changed(["config"]); s.d.sub=r.sub.id; applySub(s.d); wzAdvance(s); renderSheet(); break; }
    case "confirmOk": { const run=s&&s.run; if(run) run(); break; }
    case "point": {
      const o=findOcc(a.dataset.key); if(!o) break; const p=o.p;
      const t={id:uid8(),date:o.date,kind:p.kind,label:o.label,person:p.person||"famille",link:o.key};
      if(p.kind==="transfer") Object.assign(t,{from:p.from,to:p.to,nature:"fixe"},planTransferAmounts(p)); else Object.assign(t,{amount:p.amount,acc:p.acc,cat:p.cat,sub:p.sub||"",nature:p.nature||"fixe"});
      const docs=new Set(); upsertTx(t,docs); changed([...docs]); if(stack.length) renderSheet();
      toast(`« ${o.label} » pointé au montant prévu`,()=>{ const dd=new Set(); removeTx(t.id,dd); changed([...dd]); if(stack.length) renderSheet(); });
      break; }
    case "pointEdit": {
      const o=findOcc(a.dataset.key); if(!o) break;
      const r=calcMonth(o.date.slice(0,7)).pointRows.find(x=>x.o.key===o.key);
      let w;
      if(r&&r.done) w={type:"wizard",d:txToDraft(r.ts[0])};
      else { const d=newWizard("tx"); d.date=o.date; prefillFromOcc(d,o); d.step="amount"; w={type:"wizard",d}; }
      stack.length?pushSheet(w):openSheet(w); break; }
    case "openIncome": if(loading()) break; openIncome(); break;
    case "saveIncome": saveIncome(s); break;
    case "openBulk": if(loading()) break; openBulk(); break;
    case "bulkFill": { const pc=calcMonth(addMonths(s.ym,-1)); s.keys.forEach(k=>{ if(!String(s.d["v:"+k]||"").trim()){ const pv=pc.varRows.find(x=>x.key===k); if(pv&&pv.actual>0) s.d["v:"+k]=numStr(pv.actual); } }); renderSheet(); break; }
    case "bulkAdd": { const k=s.d.addCat+"|"+s.d.addAcc; if(!s.d.addCat) break; if(!s.keys.includes(k)){ s.keys.push(k); s.d["v:"+k]=""; } renderSheet(); break; }
    case "saveBulk": saveBulk(s); break;
    case "openAcc": openSheet({type:"account",id:a.dataset.id,ym:ui.ym}); break;
    case "openAccounts": openSheet({type:"accounts"}); break;
    case "editAccount": { const x=accById(a.dataset.id); if(!x) break; pushOrOpen({type:"accEdit",d:{id:x.id,name:x.name,cur:x.cur,bal:numStr(x.bal),balDate:x.balDate,color:x.color}}); break; }
    case "newAccount": pushOrOpen({type:"accEdit",d:{name:"",cur:"EUR",bal:"",balDate:TODAY,color:PALETTE.find(c=>!cfg.accounts.some(x=>x.color===c))||PALETTE[0]}}); break;
    case "saveAccount": { const d=s.d; const name=(d.name||"").trim(); if(!name){ s.err="Donne un nom au compte."; renderSheet(); break; }
      const bal=d.bal===""?0:num(d.bal); if(isNaN(bal)){ s.err="Solde invalide."; renderSheet(); break; } if(!isISO(d.balDate)){ s.err="Choisis la date du solde."; renderSheet(); break; }
      if(d.id){ const x=accById(d.id); Object.assign(x,{name,bal:r2(bal),balDate:d.balDate,color:d.color}); if(!accUsed(d.id)) x.cur=d.cur; }
      else cfg.accounts.push({id:"a"+uid8(),name,cur:d.cur,bal:r2(bal),balDate:d.balDate,color:d.color});
      changed(["config"]); popSheet(); toast(d.id?"Compte enregistré":"Compte ajouté"); break; }
    case "delAccount": { const d=s.d; if(accUsed(d.id)){ s.err="Ce compte est utilisé par des opérations ou des prévisions : supprime-les ou modifie-les d'abord."; renderSheet(); break; }
      if(cfg.accounts.length<=1){ s.err="Il faut garder au moins un compte."; renderSheet(); break; }
      askConfirm("Supprimer le compte ?",`« ${d.name} » sera supprimé.`,"Supprimer",()=>{ cfg.accounts=cfg.accounts.filter(x=>x.id!==d.id); changed(["config"]); stack.splice(-2,2); stack.length?renderSheet():closeSheet(); toast("Compte supprimé"); }); break; }
    case "openCats": openSheet({type:"cats",d:{newCat:""}}); break;
    case "openCatByName": { const c=catByName(a.dataset.id); if(c) openSheet({type:"catEdit",id:c.id,d:{name:c.name,acc:c.acc||"cc",nsName:"",nsBirth:"",nsBudget:""}}); break; }
    case "editCat": { const c=cfg.categories.find(x=>x.id===a.dataset.id); if(c) pushSheet({type:"catEdit",id:c.id,d:{name:c.name,acc:c.acc||"cc",nsName:"",nsBirth:"",nsBudget:""}}); break; }
    case "addCat": { const n=(s.d.newCat||"").trim(); if(!n) break; if(cfg.categories.some(x=>norm(x.name)===norm(n))){ toast("Cette catégorie existe déjà"); break; } cfg.categories.push({id:uid8(),name:n,subs:[]}); s.d.newCat=""; changed(["config"]); renderSheet(); toast("Catégorie créée"); break; }
    case "renameCat": { const c=cfg.categories.find(x=>x.id===s.id); if(c&&renameCategory(c,(s.d.name||"").trim())){ renderSheet(); toast("Catégorie renommée"); } break; }
    case "addSub": { const c=cfg.categories.find(x=>x.id===s.id); if(!c) break; const r=makeSub(c,s.d); if(r.err){ s.err=r.err; renderSheet(); break; } s.err=""; changed(["config"]); renderSheet(); toast("Ajouté"); break; }
    case "delSub": { const c=cfg.categories.find(x=>x.id===a.dataset.cat); if(!c) break; const x=c.subs.find(y=>y.id===a.dataset.id); askConfirm("Supprimer ?",`« ${x?x.name:""} » sera retiré de ${c.name}. Les opérations déjà saisies restent dans la catégorie.`,"Supprimer",()=>{ c.subs=c.subs.filter(y=>y.id!==a.dataset.id); changed(["config"]); popSheet(); }); break; }
    case "delCat": { const c=cfg.categories.find(x=>x.id===a.dataset.id); if(!c) break; askConfirm("Supprimer la catégorie ?",`« ${c.name} » disparaît de la liste. Les opérations et prévisions existantes gardent ce nom.`,"Supprimer",()=>{ cfg.categories=cfg.categories.filter(x=>x.id!==c.id); changed(["config"]); stack.splice(-2,2); stack.length?renderSheet():closeSheet(); toast("Catégorie supprimée"); }); break; }
    case "undo": { const el=document.getElementById("toast"); const u=el._undo; el.classList.remove("show"); el._undo=null; if(u) u(); break; }
    case "export": {
      const txt=JSON.stringify({app:"Mes Comptes",version:VERSION,date:TODAY,cfg,TX}); const io=document.getElementById("io"); io.value=txt;
      try{ navigator.clipboard.writeText(txt).then(()=>{ cfg.lastBackup=TODAY; changed(["config"]); toast("Sauvegarde copiée. Colle-la dans une note ou un e-mail."); },()=>{ io.select(); toast("Copie refusée : le texte est sélectionné ci-dessous."); }); }catch(x){ io.select(); toast("Le texte est sélectionné ci-dessous, copie-le."); }
      break; }

      let j; try{ j=JSON.parse(document.getElementById("io").value); }catch(x){ toast("Le texte collé n'est pas une sauvegarde valide."); break; }
      if(!j||!j.cfg){ toast("Le texte collé n'est pas une sauvegarde valide."); break; }
      doRestore(j); break; }
    case "lk": lockKey(a.dataset.v); break;
    case "lkForgot": { const el=document.getElementById("lock"); el.innerHTML=`<div class="logo" aria-hidden="true">mc</div><h2>Code oublié</h2><p style="max-width:320px">Déverrouille avec ta phrase secrète à la place. Tu pourras ensuite changer le code dans Réglages.</p><div class="actions" style="width:100%;max-width:320px"><button class="btn primary block" data-act="lkReset">Utiliser ma phrase secrète</button><button class="btn block" data-act="lkBack">Retour</button></div>`; break; }
    case "lkReset": locked=false; renderLock(); lockKeyAway(); break;
    case "bioUnlock": bioUnlock(false); break;
    case "bioOn": if(await0()) break; bioAvailable().then(ok=>ok?bioEnable():toast("Aucun capteur d'empreinte ou Face ID disponible ici")); break;
    case "bioOff": localStorage.removeItem(BIO_KEY); render(); toast("Empreinte / Face ID désactivé ici"); break;
    case "gSetup": { const url=(G.f.url||"").trim().replace(/\/+$/,""), anon=(G.f.anon||"").trim();
      if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){ gate("setup","L'URL doit ressembler à https://xxxx.supabase.co"); break; }
      if(anon.length<20){ gate("setup","Colle la clé publique complète."); break; }
      if(/service_role|sb_secret_/.test(anon)||(anon.split(".").length===3&&(()=>{ try{ return JSON.parse(atob(anon.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).role==="service_role"; }catch(x){ return false; } })())){ gate("setup","C'est la clé secrète ! Ne l'utilise jamais ici : prends la clé publique (anon ou publishable)."); break; }
      localStorage.setItem(CONF_KEY,JSON.stringify({url,anon})); G.f={}; boot(); break; }
    case "gReload": location.reload(); break;
    case "gLogout": logout(); break;
    case "gChangeBase": askOrDo("Changer de base ?","Tu seras déconnecté et l'appli oubliera cette base sur ce téléphone. Tes données restent dans Supabase.","Changer",async()=>{ try{ await idbDel("k:"+S.uid); if(sb) await sb.auth.signOut(); }catch(x){} localStorage.removeItem(CONF_KEY); localStorage.removeItem(CACHE_KEY); location.reload(); }); break;
    case "gForgotPw": gate("forgotpw"); break;
    case "gToLogin": gate("login"); break;
    case "gForgotPass": gate("forgotpass"); break;
    case "gToPass": gate("pass"); break;
    case "gRestart": G.replace=true; G.f={remember:true}; gate("newpass"); break;
    case "openMfa": openMfa(); break;
    case "mfaStart": { s.err=""; const {data,error}=await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"Mes Comptes "+Date.now().toString(36)}); if(error){ s.err=FR_ERR(error.message); renderSheet(); break; } s.enroll={id:data.id,qr:data.totp.qr_code,secret:data.totp.secret}; renderSheet(); break; }
    case "mfaVerify": { const code=(s.d.code||"").replace(/\D/g,""); if(code.length!==6){ s.err="Le code contient 6 chiffres."; renderSheet(); break; } const {error}=await sb.auth.mfa.challengeAndVerify({factorId:s.enroll.id,code}); if(error){ s.err=FR_ERR(error.message); renderSheet(); break; } closeSheet(); toast("Double authentification activée"); break; }
    case "mfaOff": askOrDo("Désactiver la double authentification ?","Seul le mot de passe sera demandé à la connexion.","Désactiver",async()=>{ const f=await mfaStatus(); if(f){ const {error}=await sb.auth.mfa.unenroll({factorId:f.id}); if(error){ toast(FR_ERR(error.message)); return; } } closeSheet(); toast("Double authentification désactivée"); }); break;
    case "openPass": openSheet({type:"pass",d:{old:"",p1:"",p2:""}}); break;
    case "passSave": passSave(s); break;
    case "forgetDevice": askOrDo("Oublier la phrase ici ?","Ta phrase secrète sera demandée à la prochaine ouverture sur ce téléphone.","Oublier",async()=>{ await idbDel("k:"+S.uid); localStorage.removeItem(BIO_KEY); closeSheet(); render(); toast("Phrase oubliée sur ce téléphone"); }); break;
    case "lkBack": renderLock(); break;
    case "pk": pinKey(s,a.dataset.v); break;
    case "pinLen": s.len=+a.dataset.v; s.buf=""; renderSheet(); break;
    case "pinSet": openSheet({type:"pin",purpose:"set",stage:"new",len:4,buf:""}); break;
    case "pinChange": openSheet({type:"pin",purpose:"change",stage:"current",len:cfg.pin.len,buf:""}); break;
    case "pinOff": openSheet({type:"pin",purpose:"off",stage:"current",len:cfg.pin.len,buf:""}); break;
    case "pinLock": lockNow(); break;
    case "pinTimeout": cfg.pin.timeout=+a.dataset.v; changed(["config"]); toast("Délai enregistré"); break;
    case "dlBackup": {
      const txt=JSON.stringify({app:"Mes Comptes",version:VERSION,date:TODAY,cfg,TX},null,1);
      download(`mes-comptes-sauvegarde-${TODAY}.json`,txt,"application/json"); cfg.lastBackup=TODAY; changed(["config"]); toast("Sauvegarde téléchargée");
      break; }
    case "dlCsv": {
      download(`mes-comptes-operations-${TODAY}.csv`,buildCsv(),"text/csv;charset=utf-8"); toast("Fichier exporté");
      break; }
  }
});
/* ----- code de verrouillage ----- */
let locked=false, unlocked=false, lockBuf="", lockMsg="", lockTries=0, lockUntil=0, lastActive=Date.now(), hiddenAt=0;
async function hashPin(pin,salt){
  const str=salt+":"+pin;
  try{ if(window.crypto&&crypto.subtle){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); } }catch(e){}
  let h1=0x811c9dc5,h2=0x9e3779b9; for(let k=0;k<2000;k++) for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,16777619)>>>0; h2=Math.imul(h2^c,2246822519)>>>0; }
  return "f"+h1.toString(16)+h2.toString(16);
}
const keypad=act=>`<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="${act}" data-v="${n}" aria-label="${n}">${n}</button>`).join("")}<span></span><button data-act="${act}" data-v="0" aria-label="0">0</button><button class="txt" data-act="${act}" data-v="del" aria-label="Effacer">Effacer</button></div>`;
const pdots=(n,len,shake)=>`<div class="pdots ${shake?"shake":""}" aria-hidden="true">${[...Array(len)].map((_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</div>`;
function lockNow(){ if(!cfg.pin) return; locked=true; lockBuf=""; lockMsg=""; renderLock(); }
function renderLock(shake){
  const el=document.getElementById("lock");
  if(!locked){ el.classList.remove("on"); el.innerHTML=""; return; }
  const wait=lockUntil>Date.now()?Math.ceil((lockUntil-Date.now())/1000):0;
  el.innerHTML=`<div class="logo" aria-hidden="true">mc</div><h2>Mes Comptes</h2><p>Entre ton code</p>${pdots(lockBuf.length,cfg.pin.len,shake)}<div class="pmsg" role="alert">${wait?`Trop d'essais. Réessaie dans ${wait} s.`:esc(lockMsg)}</div>${keypad("lk")}${localStorage.getItem(BIO_KEY)?`<button class="btn" style="margin-top:16px" data-act="bioUnlock">Utiliser l'empreinte / Face ID</button>`:""}<button class="forgot" data-act="lkForgot">Code oublié ?</button>`;
  el.classList.add("on");
}
async function lockKey(v){
  if(lockUntil>Date.now()){ renderLock(); return; }
  if(v==="del"){ lockBuf=lockBuf.slice(0,-1); lockMsg=""; renderLock(); return; }
  if(lockBuf.length>=cfg.pin.len) return;
  lockBuf+=v; renderLock();
  if(lockBuf.length===cfg.pin.len){
    const ok=(await hashPin(lockBuf,cfg.pin.salt))===cfg.pin.hash;
    if(ok){ locked=false; unlocked=true; lockTries=0; lastActive=Date.now(); renderLock(); }
    else { lockTries++; lockBuf=""; lockMsg="Code incorrect";
      if(lockTries>=5){ lockUntil=Date.now()+30000; lockTries=0; const iv=setInterval(()=>{ if(!locked||lockUntil<=Date.now()){ clearInterval(iv); lockMsg=""; } if(locked) renderLock(); },1000); }
      renderLock(true); }
  }
}
function sheetPin(s){
  const titles={set:"Activer un code",change:"Changer le code",off:"Désactiver le code"};
  const prompts={current:"Entre ton code actuel",new:"Choisis un nouveau code",confirm:"Confirme le nouveau code"};
  const len=s.stage==="current"?cfg.pin.len:s.len;
  let h=sheetHead(titles[s.purpose])+`<div style="text-align:center"><div class="q">${prompts[s.stage]}</div>`;
  if(s.stage==="new") h+=`<div class="seg" style="max-width:260px;margin:0 auto 12px">${[4,6].map(n=>`<button type="button" data-act="pinLen" data-v="${n}" class="${s.len===n?"on":""}">${n} chiffres</button>`).join("")}</div>`;
  h+=`${pdots(s.buf.length,len,s.shake)}<div class="pmsg" role="alert">${esc(s.msg||"")}</div>${keypad("pk")}</div>`;
  s.shake=false; return h;
}
async function pinKey(s,v){
  const len=s.stage==="current"?cfg.pin.len:s.len;
  if(v==="del"){ s.buf=s.buf.slice(0,-1); s.msg=""; renderSheet(); return; }
  if(s.buf.length>=len) return;
  s.buf+=v; renderSheet(); if(s.buf.length<len) return;
  const entered=s.buf; s.buf="";
  if(s.stage==="current"){
    if((await hashPin(entered,cfg.pin.salt))!==cfg.pin.hash){ s.msg="Code incorrect"; s.shake=true; renderSheet(); return; }
    if(s.purpose==="off"){ cfg.pin=null; closeSheet(); changed(["config"]); toast("Code désactivé"); return; }
    s.stage="new"; s.msg=""; renderSheet(); return;
  }
  if(s.stage==="new"){ s.first=entered; s.stage="confirm"; s.msg=""; renderSheet(); return; }
  if(entered!==s.first){ s.stage="new"; s.first=""; s.msg="Les deux codes ne correspondent pas. Recommence."; s.shake=true; renderSheet(); return; }
  const salt=uid8()+uid8();
  cfg.pin={salt,hash:await hashPin(entered,salt),len:s.len,timeout:cfg.pin?cfg.pin.timeout:1};
  unlocked=true; closeSheet(); changed(["config"]); toast(s.purpose==="set"?"Code activé":"Code changé");
}
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{ lastActive=Date.now(); },true));
setInterval(()=>{ if(cfg.pin&&!locked&&(+cfg.pin.timeout||0)>0&&Date.now()-lastActive>(+cfg.pin.timeout)*60000) lockNow(); },10000);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }
  if(cfg.pin&&!locked&&hiddenAt&&Date.now()-hiddenAt>=(+cfg.pin.timeout||0)*60000) lockNow();
});

function doRestore(j){
  if(!j||!j.cfg){ toast("Ce n'est pas une sauvegarde Mes Comptes valide."); return; }
  askConfirm("Restaurer ?",`Les données actuelles seront remplacées par la sauvegarde du ${j.date?longDate(j.date):"?"}.`,"Restaurer",()=>{ closeSheet(); const old=Object.keys(TX); cfg=normCfg(j.cfg); TX=j.TX||{}; changed(["config",...old.map(k=>"tx-"+k),...Object.keys(TX).map(k=>"tx-"+k)]); toast("Sauvegarde restaurée"); });
}
function buildCsv(){
  const q=v=>{ const x=String(v??""); return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; };
  const n=v=>v==null||v===""?"":String(r2(+v)).replace(".",",");
  const head=["Date","Type","Nature","Catégorie","Sous-catégorie","Libellé","Compte","Vers le compte","Montant","Devise","Montant reçu","Devise reçue","Frais","Pour","Prévu"];
  const rows=Object.keys(TX).sort().flatMap(k=>TX[k].slice().sort((a,b)=>a.date<b.date?-1:1)).map(t=>{
    const sub=subOf(t.cat,t.sub);
    if(t.kind==="transfer") return [t.date,"Virement","","","",t.label,accName(t.from),accName(t.to),n(t.amtFrom),curOf(t.from),n(t.amtTo),curOf(t.to),n(t.fee),"",t.link?"oui":""];
    return [t.date,t.kind==="income"?"Revenu":"Dépense",t.kind==="income"?"":(t.bulk?"variable (total)":t.nature),t.cat,sub?sub.name:"",t.label,accName(t.acc),"",n(t.kind==="income"?t.amount:-t.amount),curOf(t.acc),"","","",personName(t.person),t.link?"oui":""];
  });
  return "\ufeff"+[head,...rows].map(r=>r.map(q).join(";")).join("\r\n");
}
function askOrDo(t,m,ok,run){ askConfirm(t,m,ok,run); }
function await0(){ return false; }
function pushOrOpen(x){ stack.length?pushSheet(x):openSheet(x); }
document.addEventListener("submit",e=>{ const f=e.target.dataset&&e.target.dataset.gform; if(f){ e.preventDefault(); gateSubmit(f); } });
document.addEventListener("input",e=>{ const g=e.target.dataset&&e.target.dataset.g; if(g){ G.f[g]=e.target.type==="checkbox"?e.target.checked:e.target.value; } });
document.addEventListener("change",e=>{ const t=e.target;
  if(t.dataset&&t.dataset.g){ G.f[t.dataset.g]=t.type==="checkbox"?t.checked:t.value; }
  if(t.id==="gFile"&&t.files&&t.files[0]){ const fr=new FileReader(); fr.onload=()=>{ try{ const j=JSON.parse(String(fr.result).replace(/^\ufeff/,"")); if(!j||!j.cfg) throw 0; G.importData=j; G.f.importName=t.files[0].name; renderGate(); }catch(x){ gate("newpass","Ce fichier n'est pas une sauvegarde Mes Comptes valide."); } }; fr.readAsText(t.files[0]); }
});
document.addEventListener("input",e=>{
  const t=e.target, f=t.dataset&&t.dataset.f, s=topS();
  if(f&&s&&s.d){ s.d[f]=t.type==="checkbox"?t.checked:t.value; updateLive(); }
});
document.addEventListener("change",e=>{
  const t=e.target, s=topS();
  if(t.dataset&&t.dataset.f&&s&&s.d){
    const f=t.dataset.f; s.d[f]=t.type==="checkbox"?t.checked:t.value;
    if(s.type==="income"&&f.startsWith("on:")){ const row=t.closest(".irow"); if(row) row.classList.toggle("off",!t.checked); return; }
    if(s.type==="wizard"){
      if(f==="link"&&t.value){ const o=findOcc(t.value); if(o){ const keepDate=s.d.date; prefillFromOcc(s.d,o); s.d.date=keepDate; } renderSheet(); }
      else if(f==="freq") renderSheet();
      else if(f==="date"&&s.d.mode==="tx"&&s.d.link&&!s.d.link.includes("@"+s.d.date.slice(0,7))){ s.d.link=""; renderSheet(); }
    }
    if(s.type==="catEdit"&&f==="acc"){ const c=cfg.categories.find(x=>x.id===s.id); if(c){ c.acc=t.value; changed(["config"]); toast("Compte par défaut enregistré"); } }
    return;
  }
  if(t.dataset&&t.dataset.sub){
    const [cid,sid,field]=t.dataset.sub.split(":"); const c=cfg.categories.find(x=>x.id===cid); const x=c&&c.subs.find(y=>y.id===sid); if(!x) return;
    if(field==="name"){ const v=t.value.trim(); if(!v){ t.value=x.name; return; } x.name=v; }
    else if(field==="birth"){ if(t.value&&!isISO(t.value)) return; x.birth=t.value; }
    else if(field==="budget"){ const v=t.value.trim()===""?0:num(t.value); if(isNaN(v)||v<0){ toast("Budget invalide"); t.value=numStr(x.budget); return; } x.budget=r2(v); }
    changed(["config"]); renderSheet(); toast("Enregistré"); return;
  }
  if(t.id==="fileIn"&&t.files&&t.files[0]){
    const fr=new FileReader(); fr.onload=()=>{ let j; try{ j=JSON.parse(String(fr.result).replace(/^\ufeff/,"")); }catch(x){ toast("Ce fichier n'est pas une sauvegarde valide."); return; } doRestore(j); }; fr.onerror=()=>toast("Impossible de lire ce fichier."); fr.readAsText(t.files[0]); t.value=""; return;
  }
  const st=t.dataset&&t.dataset.set; if(!st) return;
  if(st==="planRate"){ const v=num(t.value); if(!(v>0)){ toast("Taux invalide"); render(); return; } cfg.planRate=v; }
  else if(st==="planFee"){ const v=num(t.value); if(!(v>=0)){ toast("Frais invalides"); render(); return; } cfg.planFee=r2(v); }
  changed(["config"]); toast("Réglage enregistré");
});
document.addEventListener("keydown",e=>{ if(locked&&!G.view){ if(/^[0-9]$/.test(e.key)) lockKey(e.key); else if(e.key==="Backspace") lockKey("del"); e.preventDefault(); return; } if(e.key==="Escape"&&stack.length) closeSheet(); if(e.key==="Enter"&&e.target.tagName==="INPUT"&&stack.length){ const s=topS(); if(s.type==="wizard"&&s.d.step==="amount"){ e.preventDefault(); document.querySelector('[data-act="wzNext"]')?.click(); } } });

/* ---------- démarrage ---------- */
setSync("loading");
render();
renderGate();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshFromRemote(); });
boot().catch(e=>gate("error",FR_ERR(e&&e.message)));
</script>
