let CALC={el:null,expr:"",err:false}, CAL={el:null,ym:"",val:""};
function enhanceInputs(root){
  (root||document).querySelectorAll('input[inputmode="decimal"]').forEach(i=>{ if(!i.dataset.pk){ i.readOnly=true; i.dataset.pk="calc"; i.classList.add("picker"); i.setAttribute("aria-haspopup","dialog"); } });
  (root||document).querySelectorAll('input[type="date"]').forEach(i=>{ if(!i.dataset.pk){ i.readOnly=true; i.dataset.pk=i.dataset.bd?"bd":"cal"; i.classList.add("picker"); i.setAttribute("aria-haspopup","dialog"); } });
}
function setInputValue(el,v){ el.value=v; el.dispatchEvent(new Event("input",{bubbles:true})); el.dispatchEvent(new Event("change",{bubbles:true})); }
function calcEval(expr){
  const t=expr.replace(/\s/g,"").replace(/,/g,".").match(/(\d*\.?\d+|\d+\.|[+\-×÷])/g); if(!t) return NaN;
  const tok=[]; for(let i=0;i<t.length;i++){ const x=t[i]; if("+-×÷".includes(x)){ if(!tok.length||"+-×÷".includes(tok[tok.length-1])){ if(x==="-"&&i+1<t.length&&!"+-×÷".includes(t[i+1])){ tok.push(-parseFloat(t[++i])); continue; } return NaN; } tok.push(x); } else tok.push(parseFloat(x)); }
  if("+-×÷".includes(tok[tok.length-1])) tok.pop();
  const st=[tok[0]]; for(let i=1;i<tok.length;i+=2){ const op=tok[i], n=tok[i+1]; if(op==="×") st[st.length-1]*=n; else if(op==="÷"){ if(n===0) return NaN; st[st.length-1]/=n; } else st.push(op,n); }
  let r=st[0]; for(let i=1;i<st.length;i+=2) r = st[i]==="+"? r+st[i+1] : r-st[i+1];
  return isFinite(r)?Math.round(r*100)/100:NaN;
}
function openCalc(el){
  CALC={el,expr:(el.value||"").replace(/[\s  ]/g,"").replace(".",","),err:false};
  if(CALC.expr==="0") CALC.expr=""; CALC.fresh=true;
  renderCalc(); document.getElementById("calc").classList.add("on");
}
function calcLabel(el){ const l=el.closest("label"); const sp=l&&l.querySelector("span"); return sp?sp.textContent:(el.getAttribute("aria-label")||"Montant"); }
function renderCalc(){
  const e=CALC.expr, hasOp=false;
  const res=e===""?"0":e;
  document.getElementById("calc").innerHTML=`<div class="pad-sheet"><div class="calc-top"><span>${esc(calcLabel(CALC.el))}</span><button class="iconbtn" data-cx="cancel" aria-label="Fermer">${I.close}</button></div>
  <div class="calc-disp"><div class="calc-expr">${CALC.fresh&&e?"tape un nouveau montant ou ⌫ pour corriger":"&nbsp;"}</div><div class="calc-res ${CALC.err?"err":""}" style="${CALC.fresh&&e?"opacity:.45":""}">${esc(res)}</div></div>
  <div class="calc-keys">${["1","2","3","4","5","6","7","8","9",",","0","⌫"].map(k=>`<button type="button" class="${k==="⌫"||k===","?"fn":""}" data-cx="${k}" aria-label="${k==="⌫"?"Effacer":k===","?"virgule":k}">${k}</button>`).join("")}<button type="button" class="ok" data-cx="OK" style="grid-column:1/-1">Valider</button></div></div>`;
}
function calcKey(k){
  if(CALC.mode==="bd") return bdKey(k);
  let e=CALC.expr; CALC.err=false; if(CALC.fresh&&(/^[0-9]$/.test(k)||k===",")) e=""; if(k!=="cancel") CALC.fresh=false; const last=e.slice(-1), ops="+-×÷";
  if(k==="cancel"){ document.getElementById("calc").classList.remove("on"); return; }
  if(k==="C") e=""; else if(k==="⌫") e=e.slice(0,-1);
  else if(ops.includes(k)){ if(e===""&&k!=="-") return; if(ops.includes(last)) e=e.slice(0,-1)+k; else e+=k; }
  else if(k===","){ const seg=e.split(/[+\-×÷]/).pop(); if(seg.includes(",")) return; e+=(seg===""?"0,":","); }
  else if(k==="="||k==="OK"){ if(e===""){ if(k==="OK"){ setInputValue(CALC.el,""); document.getElementById("calc").classList.remove("on"); } return; }
    const r=calcEval(e); if(isNaN(r)){ CALC.err=true; renderCalc(); return; }
    const v=String(r).replace(".",",");
    if(k==="="){ CALC.expr=v; renderCalc(); return; }
    setInputValue(CALC.el,v); document.getElementById("calc").classList.remove("on"); return; }
  else { const seg=e.split(/[+\-×÷]/).pop(); if(seg.includes(",")&&seg.split(",")[1].length>=2) return; if(seg==="0"&&k!==",") e=e.slice(0,-1); e+=k; }
  CALC.expr=e; renderCalc();
}
/* date de naissance au pavé : JJ/MM/AAAA */
function openBday(el){
  const v=isISO(el.value)?el.value:"";
  CALC={el,mode:"bd",dg:v?v.slice(8,10)+v.slice(5,7)+v.slice(0,4):"",fresh:!!v,err:""};
  renderBday(); document.getElementById("calc").classList.add("on");
}
function bdISO(dg){ if(dg.length!==8) return null; const d=+dg.slice(0,2), m=+dg.slice(2,4), y=+dg.slice(4); if(m<1||m>12||d<1||d>daysIn(y,m)||y<1900) return null; return `${y}-${pad(m)}-${pad(d)}`; }
function renderBday(){
  const dg=CALC.dg, mask="JJMMAAAA"; let out="";
  for(let i=0;i<8;i++){ if(i===2||i===4) out+=`<span class="sep">/</span>`; out+=i<dg.length?`<span>${dg[i]}</span>`:`<span class="ph">${mask[i]}</span>`; }
  const iso=bdISO(dg); let info="&nbsp;";
  if(CALC.err) info=`<span class="neg">${esc(CALC.err)}</span>`;
  else if(CALC.fresh) info="tape la nouvelle date ou ⌫ pour corriger";
  else if(iso&&iso<=TODAY){ const nb=nextBirthday(iso); info=`${ageOn(iso,TODAY)-(TODAY.slice(5)<iso.slice(5)?1:0)} ans aujourd'hui · ${ageOn(iso,nb)} ans le ${shortDate(nb)}`; }
  else if(dg.length===8) info=`<span class="neg">Date impossible</span>`;
  document.getElementById("calc").innerHTML=`<div class="pad-sheet"><div class="calc-top"><span>${esc(calcLabel(CALC.el))}</span><button class="iconbtn" data-cx="cancel" aria-label="Fermer">${I.close}</button></div>
  <div class="calc-disp"><div class="calc-expr">${info}</div><div class="calc-res bd-res" style="${CALC.fresh?"opacity:.45":""}" aria-live="polite">${out}</div></div>
  <div class="calc-keys">${["1","2","3","4","5","6","7","8","9","cal","0","⌫"].map(k=>`<button type="button" class="${k==="⌫"||k==="cal"?"fn":""}" data-cx="${k}" aria-label="${k==="⌫"?"Effacer":k==="cal"?"Choisir dans le calendrier":k}">${k==="cal"?I.cal:k}</button>`).join("")}<button type="button" class="ok" data-cx="OK" style="grid-column:1/-1">Valider</button></div></div>`;
}
function bdKey(k){
  const box=document.getElementById("calc"); CALC.err="";
  if(k==="cancel"){ box.classList.remove("on"); CALC.mode=""; return; }
  if(k==="cal"){ box.classList.remove("on"); CALC.mode=""; const el=CALC.el, iso=bdISO(CALC.dg); openCal(el); if(iso){ CAL.ym=iso.slice(0,7); renderCal(); } else if(CALC.dg.length===8){ CAL.ym=CALC.dg.slice(4)+"-"+(+CALC.dg.slice(2,4)>=1&&+CALC.dg.slice(2,4)<=12?CALC.dg.slice(2,4):"01"); renderCal(); } return; }
  if(/^[0-9]$/.test(k)){ if(CALC.fresh) CALC.dg=""; CALC.fresh=false; if(CALC.dg.length<8) CALC.dg+=k; return renderBday(); }
  if(k==="⌫"){ CALC.fresh=false; CALC.dg=CALC.dg.slice(0,-1); return renderBday(); }
  if(k==="OK"||k==="="){ if(CALC.fresh){ box.classList.remove("on"); CALC.mode=""; return; }
    if(!CALC.dg){ setInputValue(CALC.el,""); box.classList.remove("on"); CALC.mode=""; return; }
    const iso=bdISO(CALC.dg); if(!iso){ CALC.err=CALC.dg.length<8?"Tape 8 chiffres : jour, mois, année":"Date impossible"; return renderBday(); }
    if(iso>TODAY){ CALC.err="La date ne peut pas être dans le futur"; return renderBday(); }
    setInputValue(CALC.el,iso); box.classList.remove("on"); CALC.mode=""; return; }
}
function openCal(el){
  const v=isISO(el.value)?el.value:""; CAL={el,val:v,ym:(v||TODAY).slice(0,7)};
  renderCal(); document.getElementById("cal").classList.add("on");
}
function renderCal(){
  const [y,m]=CAL.ym.split("-").map(Number), first=new Date(Date.UTC(y,m-1,1)).getUTCDay(), off=(first+6)%7, dim=daysIn(y,m);
  const prevDim=daysIn(m===1?y-1:y,m===1?12:m-1); let cells="";
  for(let i=0;i<42;i++){ let d,ym=CAL.ym,out=false; if(i<off){ d=prevDim-off+i+1; ym=addMonths(CAL.ym,-1); out=true; } else if(i>=off+dim){ d=i-off-dim+1; ym=addMonths(CAL.ym,1); out=true; } else d=i-off+1;
    const iso=`${ym}-${pad(d)}`; cells+=`<button type="button" data-cd="${iso}" class="${out?"out":""} ${iso===TODAY?"today":""} ${iso===CAL.val?"sel":""}">${d}</button>`; }
  const optional=!CAL.el.required&&/end|fin/i.test((CAL.el.dataset.f||"")+(CAL.el.closest("label")?.textContent||""));
  document.getElementById("cal").innerHTML=`<div class="pad-sheet"><div class="calc-top"><span>${esc(calcLabel(CAL.el))}</span><button class="iconbtn" data-cd="cancel" aria-label="Fermer">${I.close}</button></div>
  <div class="cal-head">${CAL.el.dataset.bd?`<button class="iconbtn" data-cd="py" aria-label="Année précédente">«</button>`:""}<button class="iconbtn" data-cd="prev" aria-label="Mois précédent">${I.left}</button><b>${monthName(CAL.ym)} ${y}</b><button class="iconbtn" data-cd="next" aria-label="Mois suivant">${I.right}</button>${CAL.el.dataset.bd?`<button class="iconbtn" data-cd="ny" aria-label="Année suivante">»</button>`:""}</div>
  <div class="cal-grid">${["L","M","M","J","V","S","D"].map(x=>`<div class="wd">${x}</div>`).join("")}${cells}</div>
  <div class="cal-foot"><button type="button" class="btn" data-cd="today">Aujourd'hui</button>${optional?`<button type="button" class="btn" data-cd="clear">Effacer</button>`:""}</div></div>`;
}
function calKey(k){
  if(k==="cancel"){ document.getElementById("cal").classList.remove("on"); return; }
  if(k==="prev"){ CAL.ym=addMonths(CAL.ym,-1); return renderCal(); }
  if(k==="next"){ CAL.ym=addMonths(CAL.ym,1); return renderCal(); }
  if(k==="py"){ CAL.ym=addMonths(CAL.ym,-12); return renderCal(); }
  if(k==="ny"){ CAL.ym=addMonths(CAL.ym,12); return renderCal(); }
  if(k==="clear"){ setInputValue(CAL.el,""); document.getElementById("cal").classList.remove("on"); return; }
  const v=k==="today"?TODAY:k; setInputValue(CAL.el,v); document.getElementById("cal").classList.remove("on");
}
document.addEventListener("click",e=>{
  const cx=e.target.closest("[data-cx]"); if(cx){ calcKey(cx.dataset.cx); return; }
  const cd=e.target.closest("[data-cd]"); if(cd){ calKey(cd.dataset.cd); return; }
  if(e.target.id==="calc"){ calcKey("cancel"); return; } if(e.target.id==="cal"){ calKey("cancel"); return; }
  const i=e.target.closest("input[data-pk]"); if(i){ e.preventDefault(); i.blur(); if(i.dataset.pk==="calc") openCalc(i); else if(i.dataset.pk==="bd") openBday(i); else openCal(i); }
},true);
document.addEventListener("keydown",e=>{
  if(document.getElementById("calc").classList.contains("on")){ const map={"Enter":"OK","Backspace":"⌫","Escape":"cancel",".":",",",":","}; const k=/^[0-9]$/.test(e.key)?e.key:map[e.key]; if(k){ e.preventDefault(); e.stopPropagation(); calcKey(k); } }
  else if(document.getElementById("cal").classList.contains("on")&&e.key==="Escape"){ calKey("cancel"); }
},true);
new MutationObserver(()=>enhanceInputs()).observe(document.body,{childList:true,subtree:true});

document.addEventListener("scroll",e=>{ const pg=e.target; if(!pg.classList||!pg.classList.contains("vpager")) return; const i=Math.round(pg.scrollLeft/pg.clientWidth); pg.parentElement.querySelectorAll(".vdots i").forEach((d,k)=>d.classList.toggle("on",k===i)); },true);
/* ---------- appui long : déplacer une catégorie ---------- */
let DR=null, dragClickBlock=false;
document.addEventListener("pointerdown",e=>{
  const it=e.target.closest("[data-sid]"); if(!it||e.button>0) return;
  DR={it,box:it.parentElement,x:e.clientX,y:e.clientY,active:false};
  DR.t=setTimeout(()=>{ if(!DR) return; DR.active=true; it.classList.add("dragging"); try{ navigator.vibrate&&navigator.vibrate(15); }catch(x){} },450);
},true);
document.addEventListener("pointermove",e=>{
  if(!DR) return;
  if(!DR.active){ if(Math.hypot(e.clientX-DR.x,e.clientY-DR.y)>8){ clearTimeout(DR.t); DR=null; } return; }
  e.preventDefault();
  DR.it.style.pointerEvents="none"; const el=document.elementFromPoint(e.clientX,e.clientY); DR.it.style.pointerEvents="";
  const over=el&&el.closest("[data-sid]");
  if(over&&over!==DR.it&&over.parentElement===DR.box){ const r=over.getBoundingClientRect(); const after=DR.box.classList.contains("cgrid")?(e.clientY>r.top+r.height/2&&e.clientX>r.left)||(e.clientX>r.left+r.width/2&&e.clientY>r.top):e.clientY>r.top+r.height/2; DR.box.insertBefore(DR.it,after?over.nextSibling:over); }
},{passive:false});
document.addEventListener("touchmove",e=>{ if(DR&&DR.active) e.preventDefault(); },{passive:false});
function endDrag(){
  if(!DR) return; clearTimeout(DR.t);
  if(DR.active){
    DR.it.classList.remove("dragging"); dragClickBlock=true; setTimeout(()=>{ dragClickBlock=false; },350);
    const ids=[...DR.box.querySelectorAll(":scope>[data-sid]")].map(x=>x.dataset.sid);
    const pos=ids.map(id=>cfg.categories.findIndex(c=>c.id===id)).filter(i=>i>=0).sort((a,b)=>a-b);
    const moved=ids.map(id=>cfg.categories.find(c=>c.id===id)).filter(Boolean);
    if(moved.length===pos.length){ pos.forEach((p,i)=>{ cfg.categories[p]=moved[i]; }); changed(["config"]); toast("Ordre enregistré"); }
  }
  DR=null;
}
document.addEventListener("pointerup",endDrag,true);
document.addEventListener("pointercancel",()=>{ if(DR&&DR.active) endDrag(); else if(DR){ clearTimeout(DR.t); DR=null; } },true);
document.addEventListener("click",e=>{ if(dragClickBlock){ e.stopPropagation(); e.preventDefault(); } },true);
document.addEventListener("contextmenu",e=>{ if(e.target.closest("[data-sid]")) e.preventDefault(); });

/* ---------- démarrage ---------- */
setSync("loading");
render();
renderGate();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshFromRemote(); });
boot().catch(e=>gate("error",FR_ERR(e&&e.message)));
</script>
