<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes Comptes</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F4EBDD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes Comptes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Plan : ocre et indigo — papier crème, chiffres et titres en indigo (Spectral), actions en ocre. Une colonne mobile : saisie rapide en haut, comptes, résultat, puis détail. */
:root{
  --bg:#F4EBDD; --surface:#FBF6EE; --surface-2:#EFE4D2; --ink:#1F2340; --muted:#77715F; --line:#E2D6C2;
  --title:#2E3A7A; --accent:#A8661A; --accent-soft:#F3E2C6; --on-accent:#FFF9F0; --ochre:#C98F33;
  --pos:#2F7A52; --pos-soft:#E1EEE4; --neg:#B23A2E; --neg-soft:#F6DED8; --warn:#9A6410; --warn-soft:#F6E7CC;
  --display:"Spectral", "Iowan Old Style", Georgia, serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(31,35,64,.05), 0 8px 24px rgba(31,35,64,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11142A; --surface:#191E3A; --surface-2:#222848; --ink:#EDE6D8; --muted:#A3A0B6; --line:#2E3458;
    --title:#B7C0F2; --accent:#E2B262; --accent-soft:#3A3120; --on-accent:#11142A; --ochre:#E2B262;
    --pos:#7CC79A; --pos-soft:#1C3328; --neg:#F08A7C; --neg-soft:#3B2023; --warn:#E8B04B; --warn-soft:#352A12;
    --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11142A; --surface:#191E3A; --surface-2:#222848; --ink:#EDE6D8; --muted:#A3A0B6; --line:#2E3458;
  --title:#B7C0F2; --accent:#E2B262; --accent-soft:#3A3120; --on-accent:#11142A; --ochre:#E2B262;
  --pos:#7CC79A; --pos-soft:#1C3328; --neg:#F08A7C; --neg-soft:#3B2023; --warn:#E8B04B; --warn-soft:#352A12;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:540px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:540px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--title);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:19px;font-weight:600;font-style:italic}
.app{font-weight:800;letter-spacing:-.01em}
.ver{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--pos)} .dot.warn{background:var(--warn)} .dot.err{background:var(--neg)}
.period{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;gap:8px}
.period h1{font-family:var(--display);color:var(--title);font-weight:500;font-size:30px;line-height:1.1;margin:0;text-transform:capitalize;text-wrap:balance;text-align:center;letter-spacing:-.01em}
.period small{display:block;text-align:center;color:var(--muted);font-size:12px;font-family:var(--body);text-transform:none;margin-top:3px;font-weight:600}
.iconbtn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
button.card{text-align:left;width:100%}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
/* duo cards */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo-c{padding:14px;display:flex;flex-direction:column;gap:4px;min-height:132px}
.duo-c .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.duo-c .ic svg{width:17px;height:17px}
.duo-c b{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.05}
.duo-c small{font-size:12px;color:var(--muted)}
.duo-c .go{margin-top:auto;font-size:12px;font-weight:700;color:var(--accent)}
/* comptes */
.accounts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.acc{padding:12px 14px 12px 16px;position:relative;overflow:hidden}
.acc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--accent))}
.acc .n{font-size:12px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:6px}
.acc .n span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .lbl{font-size:11px;color:var(--muted);margin-top:6px}
.acc .v{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.acc .s{font-size:12px;color:var(--muted)}
.acc .s b{color:var(--ink);font-weight:700}
.cur{font-size:10px;font-weight:800;letter-spacing:.05em;padding:1px 5px;border-radius:5px;border:1px solid currentColor;opacity:.8;flex:none}
.cdot{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
/* résultat */
.hero{padding:18px 18px 16px;margin-top:12px}
.big{font-family:var(--display);font-weight:500;font-size:50px;line-height:1;margin:8px 0 6px;letter-spacing:-.02em}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.verdict.pos{background:var(--pos-soft)} .verdict.neg{background:var(--neg-soft)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-weight:700;font-size:15px}
.zones{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.zone{font-size:12px;padding:5px 9px;border-radius:9px;background:var(--surface-2)}
.zone b{font-weight:700}
section.block{margin-top:24px}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 8px}
.bh h2{font-family:var(--display);font-size:20px;margin:0;font-weight:500;letter-spacing:-.01em}
.bh .t{font-size:12px;color:var(--muted);text-align:right}
.list{padding:2px 0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.list>.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .l{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{text-align:right;white-space:nowrap}
.row .amt b{font-weight:700;display:block}
.row .amt small{font-size:12px;color:var(--muted)}
.st{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line);color:var(--muted);background:none;padding:0}
.st svg{width:15px;height:15px}
.st.done{border:0;background:var(--pos-soft);color:var(--pos)}
.st.late{border:1.5px solid var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:1px}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:7px;border-radius:7px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pos);border-radius:7px}
.bar i.over{background:var(--neg)} .bar i.near{background:var(--warn)}
.empty{padding:22px 18px}
.empty h3{font-family:var(--display);font-weight:500;font-size:24px;margin:0 0 6px}
.empty p{margin:0 0 14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 35%,var(--line))}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:11px}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.person{padding:10px}
.person .n{font-size:12px;color:var(--muted);font-weight:700}
.person b{display:block;font-size:15px}
.person small{font-size:11px;color:var(--muted)}
/* réglages */
.create{display:flex;align-items:center;gap:14px;padding:18px;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.create .ic{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--on-accent) 18%,transparent);display:grid;place-items:center;flex:none}
.create .ic svg{width:24px;height:24px}
.create b{font-family:var(--display);font-weight:500;font-size:21px;display:block}
.create small{opacity:.85;font-size:13px}
.navcard{display:flex;align-items:center;gap:14px;padding:16px}
.navcard .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.navcard .ic svg{width:21px;height:21px}
.navcard .main{flex:1;min-width:0}
.navcard b{display:block;font-weight:800}
.navcard small{color:var(--muted);font-size:12px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.navcard>svg{width:18px;height:18px;color:var(--muted)}
.sgrid{display:grid;gap:10px}
.pad{padding:14px}
.note{font-size:12px;color:var(--muted);margin:8px 2px 0}
.banner{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13px;background:var(--warn-soft)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:64px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);height:100%;justify-content:center}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--accent)}
.fab{width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto;transform:translateY(-14px);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.fab svg{width:26px;height:26px}
/* feuille */
.scrim{position:fixed;inset:0;background:rgba(30,18,10,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:540px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;max-height:94%;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh h3{font-family:var(--display);font-weight:500;font-size:25px;margin:0;flex:1;line-height:1.15}
.sh h3 small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.steps{display:flex;gap:5px;margin:-4px 0 14px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.q{font-family:var(--display);font-size:20px;font-weight:500;margin:4px 0 12px}
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.tile.on{border-color:var(--accent);background:var(--accent-soft)}
.tile .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-weight:800;font-size:16px}
.tile span{font-size:13px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:700;min-height:52px;display:flex;flex-direction:column;justify-content:center}
.cbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.cbtn small{font-weight:600;font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.chipbtn.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface))}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(60,35,15,.12)}
.form{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:700;color:var(--muted)}
.fld small{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);padding:10px 12px;font-size:16px;min-width:0}
input::placeholder{color:color-mix(in srgb,var(--muted) 55%,transparent)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
textarea{min-height:110px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.amount-in{font-family:var(--display);font-size:36px;min-height:62px;padding:6px 14px}
.live{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}
.err{color:var(--neg);font-size:13px;font-weight:700}
.actions{display:grid;gap:8px;margin-top:8px}
.recap{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.recap .rl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.recap .rl:first-child{border-top:0}
.recap .rl span{color:var(--muted);font-size:13px;flex:none}
.recap .rl b{font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
.recap .tot{padding:16px 14px;background:var(--surface-2);text-align:center}
.recap .tot b{font-family:var(--display);font-size:36px;font-weight:500;display:block}
.irow{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.irow.off{opacity:.55}
.irow .hd{display:flex;align-items:center;gap:10px}
.irow .hd .main{flex:1;min-width:0}
.irow .hd b{display:block}
.irow .hd small{color:var(--muted);font-size:12px}
.vrow{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow b{display:block}
.vrow small{display:block;font-size:12px;color:var(--muted)}
.vrow input{text-align:right;font-weight:700}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;display:flex;gap:14px;align-items:center;transition:all .2s;pointer-events:none;max-width:92%}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:var(--ochre);font-weight:800;padding:0}
.chart{padding:14px 10px 8px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 8px 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tr.cur td{background:var(--accent-soft)}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--line)}
.tbl-wrap{overflow-x:auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px 14px}
.stat span{font-size:12px;color:var(--muted);display:block}
.stat b{font-size:17px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sumgrid div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.sumgrid span{display:block;font-size:12px;color:var(--muted)}
.sumgrid b{font-size:16px}
.cat{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:700}
.cat button{width:22px;height:22px;border-radius:50%;border:0;background:var(--line);display:grid;place-items:center;padding:0;font-size:13px;line-height:1}
.subed{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.subed:first-child{border-top:0}
.subed .top{display:flex;gap:8px;align-items:center}
.subed .top input{flex:1}
.mini{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--neg);display:grid;place-items:center;padding:0}
.mini svg{width:17px;height:17px}
h4{margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;overflow:auto;padding:32px 18px calc(24px + env(safe-area-inset-bottom))}
.gate.on{display:block}
.gin{max-width:420px;margin:0 auto;text-align:center}
.gin .logo{width:56px;height:56px;font-size:28px;border-radius:18px;margin:12px auto 14px}
.gin h2{font-family:var(--display);font-weight:500;font-size:30px;margin:0 0 8px}
.gin>p{color:var(--muted);margin:0 0 18px}
.gin .form{text-align:left}
.chk{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}
.btn[disabled]{opacity:.6}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));text-align:center}
.lock.on{display:flex}
.lock .logo{width:56px;height:56px;font-size:28px;border-radius:18px;margin-bottom:14px}
.lock h2{font-family:var(--display);font-weight:500;font-size:28px;margin:0 0 4px}
.lock p{color:var(--muted);margin:0 0 18px;font-weight:600}
.pdots{display:flex;gap:14px;justify-content:center;margin:6px 0 10px;min-height:16px}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pdots i.on{background:var(--accent);border-color:var(--accent)}
.pdots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pmsg{min-height:20px;font-size:13px;font-weight:700;color:var(--neg);margin-bottom:8px}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px;justify-content:center}
.keypad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:28px;font-weight:500;display:grid;place-items:center;padding:0}
.keypad button.txt{border:0;background:none;font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted)}
.keypad button:active{background:var(--accent-soft)}
.forgot{margin-top:18px;background:none;border:0;color:var(--accent);font-weight:700;font-size:13px}
.bh h2,.sh h3,.q,.gin h2,.lock h2,.empty h3,.duo-c b,.recap .tot b{color:var(--title)}
.recap .tot b.pos{color:var(--pos)}
.acc{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.acc::before{width:6px}
.acc .n span:first-child{color:color-mix(in srgb,var(--c) 78%,var(--ink));font-size:13px}
.acc .cur{color:var(--c)}
.cdot{width:14px;height:14px;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent)}
.people{grid-template-columns:repeat(3,1fr)}
.band{display:flex;align-items:center;gap:12px;padding:14px;margin-top:10px;background:color-mix(in srgb,var(--title) 8%,var(--surface));border-color:color-mix(in srgb,var(--title) 25%,var(--line))}
.band .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--title);color:var(--bg);flex:none}
.band .ic svg{width:20px;height:20px}
.band .main{flex:1;min-width:0}
.band b{display:block;font-weight:800}
.band small{display:block;font-size:12px;color:var(--muted)}
.band>svg{width:18px;height:18px;color:var(--muted);flex:none}
.catbar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.catbar:first-child{border-top:0}
.catbar .bar{grid-column:1/-1;margin-top:3px}
/* calculette et calendrier */
input.picker{cursor:pointer;caret-color:transparent}
.ovl{position:fixed;inset:0;z-index:70;background:rgba(17,20,42,.45);display:none;align-items:flex-end;justify-content:center}
.ovl.on{display:flex}
.pad-sheet{width:100%;max-width:540px;background:var(--surface);border-radius:24px 24px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(17,20,42,.18)}
.calc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

.calc-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.calc-keys button{height:58px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:24px;font-weight:500;color:var(--ink);padding:0}

.calc-keys button.fn{font-family:var(--body);font-size:15px;font-weight:800;color:var(--muted);background:var(--surface-2)}

.calc-keys button:active{transform:scale(.97)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-head b{font-family:var(--display);font-size:22px;font-weight:500;color:var(--title);text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .wd{font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}

.cal-grid button.today{box-shadow:inset 0 0 0 1.5px var(--title);color:var(--title)}

.cal-foot .btn{flex:1}
@media (max-width:380px){ .big{font-size:42px} .people{grid-template-columns:1fr 1fr} .kpi b{font-size:14px} .duo-c b{font-size:21px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

<body>

<script>
"use strict";
const VERSION = "2.4";
const PERSONS = [["famille","Famille"],["william","William"],["ingrid","Ingrid"],["leonard","Léonard"],["autre","Autre"]];
const FREQS = [["monthly","Mensuelle",1],["once","Ponctuelle",0],["weekly","Hebdomadaire",52/12],["biweekly","Toutes les 2 semaines",26/12],["bimonthly","Tous les 2 mois",1/2],["quarterly","Trimestrielle",1/3],["semiannual","Semestrielle",1/6],["annual","Annuelle",1/12]];
const FREQ_STEP = {monthly:1,bimonthly:2,quarterly:3,semiannual:6,annual:12};
const PALETTE = ["#C2603A","#C98F33","#6F8B4E","#4F6D8A","#A23E2E","#8A4F6D","#3F8A86","#9A8466"];
const DEF_COLORS = {cc:"#C2603A",joint:"#4F6D8A",ldd:"#C98F33",chf:"#A23E2E",cash:"#6F8B4E"};
const LS = "mescomptes.v1";
const KIND_L = {expense:"Dépense",income:"Revenu",transfer:"Virement"};

/* ---------- dates & formats ---------- */
const pad = n => String(n).padStart(2,"0");
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const TODAY = todayISO(), CUR_YM = TODAY.slice(0,7);
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s||"");
const daysIn = (y,m) => new Date(Date.UTC(y,m,0)).getUTCDate();
function addMonths(ym,k){ let [y,m]=ym.split("-").map(Number); m+=k; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return `${y}-${pad(m)}`; }
const lastDay = ym => { const [y,m]=ym.split("-").map(Number); return `${ym}-${pad(daysIn(y,m))}`; };
const isoUTC = t => new Date(t).toISOString().slice(0,10);
function monthName(ym,opt="long"){ const [y,m]=ym.split("-").map(Number); return new Intl.DateTimeFormat("fr-FR",{month:opt,timeZone:"UTC"}).format(Date.UTC(y,m-1,1)); }
function shortDate(iso){ if(!isISO(iso)) return ""; const [y,m,d]=iso.split("-").map(Number); return new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",timeZone:"UTC"}).format(Date.UTC(y,m-1,d)); }
function longDate(iso){ if(!isISO(iso)) return ""; const [y,m,d]=iso.split("-").map(Number); return new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(Date.UTC(y,m-1,d)); }
const NF = {};
function fmt(n,cur="EUR",dec=2){ const k=cur+dec; NF[k]=NF[k]||new Intl.NumberFormat("fr-FR",{style:"currency",currency:cur,minimumFractionDigits:dec,maximumFractionDigits:dec}); return NF[k].format(Math.abs(n)<0.005?0:n); }
const sfmt = (n,cur="EUR",dec=2) => (n>0.004?"+":"")+fmt(n,cur,dec);
const cls = n => n>0.004?"pos":n<-0.004?"neg":"mut";
const num = s => { const v=parseFloat(String(s??"").replace(/[\s  ]/g,"").replace(",",".")); return isFinite(v)?v:NaN; };
const r2 = n => Math.round(n*100)/100;
const numStr = n => n==null||n===""||isNaN(n)?"":String(r2(+n)).replace(".",",");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid8 = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();

/* ---------- configuration ---------- */
const INCOME_CATS=["Salaire","Allocations","Remboursement","Autre revenu"];
function defaultCats(){
  const mk=(n,type="expense")=>({id:uid8(),name:n,type,subs:[]});
  return ["Logement","Courses","Transport","Santé","Assurances","Abonnements","Enfant","Loisirs"].map(n=>mk(n))
    .concat([{id:uid8(),name:"Anniversaires",type:"expense",special:"birthday",acc:"cc",subs:[]},{id:uid8(),name:"Cadeaux de Noël",type:"expense",special:"christmas",acc:"cc",subs:[]}])
    .concat(["Frais bancaires","Divers"].map(n=>mk(n)))
    .concat(INCOME_CATS.map(n=>mk(n,"income")));
}
const catType = c => c&&c.type==="income"?"income":"expense";
const catsOf = kind => cfg.categories.filter(c=>catType(c)===(kind==="income"?"income":"expense"));
function defaultAccounts(){
  const d=CUR_YM+"-01";
  return [
    {id:"cc",name:"Compte courant",cur:"EUR",bal:0,balDate:d,color:DEF_COLORS.cc},
    {id:"joint",name:"Compte joint",cur:"EUR",bal:0,balDate:d,color:DEF_COLORS.joint},
    {id:"ldd",name:"Épargne LDD",cur:"EUR",bal:0,balDate:d,color:DEF_COLORS.ldd},
    {id:"chf",name:"Compte CHF",cur:"CHF",bal:0,balDate:d,color:DEF_COLORS.chf},
    {id:"cash",name:"Enveloppe espèces",cur:"EUR",bal:0,balDate:d,color:DEF_COLORS.cash,cash:true}];
}
function defaultCfg(){ return {v:3,accounts:defaultAccounts(),planRate:1.06,planFee:0,categories:defaultCats(),plans:[]}; }
function normCfg(c){
  if(!c) return defaultCfg();
  const out=Object.assign(defaultCfg(),c);
  let accs=Array.isArray(c.accounts)&&c.accounts.length?c.accounts.map((a,i)=>Object.assign({cur:"EUR",bal:0,balDate:CUR_YM+"-01",color:DEF_COLORS[a.id]||PALETTE[i%PALETTE.length]},a)):defaultAccounts();
  if(!(c.v>=2)&&!accs.some(a=>a.id==="cash")) accs.push(defaultAccounts()[4]);
  out.accounts=accs;
  if(!Array.isArray(c.categories)||!c.categories.length) out.categories=defaultCats();
  else if(typeof c.categories[0]==="string"){
    out.categories=c.categories.map(n=>({id:uid8(),name:n,subs:[]}));
    defaultCats().filter(x=>x.special).forEach(x=>{ if(!out.categories.some(y=>y.name===x.name)) out.categories.push(x); });
  }
  out.categories.forEach(k=>{ if(!k.id) k.id=uid8(); if(!Array.isArray(k.subs)) k.subs=[]; k.subs.forEach(s=>{ if(!s.id) s.id=uid8(); if(!k.special&&!Array.isArray(s.subs)) s.subs=[]; }); });
  if(!Array.isArray(out.plans)) out.plans=[];
  out.categories.forEach(k=>{ if(k.type!=="income"&&k.type!=="expense") k.type=!k.special&&INCOME_CATS.some(n=>norm(n)===norm(k.name))?"income":"expense"; });
  if(!(c.v>=3)) INCOME_CATS.forEach(n=>{ if(!out.categories.some(k=>norm(k.name)===norm(n))) out.categories.push({id:uid8(),name:n,type:"income",subs:[]}); });
  out.v=3; return out;
}
let cfg=defaultCfg(), TX={};
const ui={tab:"mois",ym:CUR_YM,year:+CUR_YM.slice(0,4)};
try{ const t=localStorage.getItem(LS+".tab"); if(t) ui.tab=t; }catch(e){}
let mode="loading";
const memo=new Map();
let stack=[];

const accById = id => cfg.accounts.find(a=>a.id===id);
const curOf = id => (accById(id)||{}).cur||"EUR";
const accName = id => (accById(id)||{}).name||"Compte supprimé";
const accColor = id => (accById(id)||{}).color||"#9A8466";
const personName = id => (PERSONS.find(p=>p[0]===id)||[,"Famille"])[1];
const personsOf = o => !o?[]:Array.isArray(o.persons)?o.persons:(o.person&&o.person!=="personne"?[o.person]:[]);
const personLabel = o => { const ps=personsOf(o); if(!ps.length) return ""; const n=ps.map(id=>id==="autre"?(o.personOther||"Autre"):personName(id)).join(", "); return ps.length>1?`${n} (÷${ps.length})`:n; };
const personFromName = n => (PERSONS.find(p=>norm(p[1])===norm(n))||[null])[0];
const freqOf = id => FREQS.find(f=>f[0]===id)||FREQS[0];
const conv = (amt,cur,r) => cur==="CHF"?amt*r:amt;
const catByName = n => cfg.categories.find(c=>c.name===n);
function subOf(catName,subId){ const c=catByName(catName); return c&&subId?c.subs.find(s=>s.id===subId):null; }
function ageOn(birth,iso){ if(!isISO(birth)||!isISO(iso)) return null; return +iso.slice(0,4)-+birth.slice(0,4); }
function nextBirthday(birth){ if(!isISO(birth)) return null; let d=TODAY.slice(0,4)+birth.slice(4); if(d<TODAY) d=(+TODAY.slice(0,4)+1)+birth.slice(4); return d; }
function catLabel(catName,subId,sub2Id){ const s=subOf(catName,subId); if(!s) return catName||""; const s2=sub2Id&&Array.isArray(s.subs)?s.subs.find(x=>x.id===sub2Id):null; return `${catName} › ${s.name}${s2?" › "+s2.name:""}`; }
function sub2Of(catName,subId,sub2Id){ const s=subOf(catName,subId); return s&&sub2Id&&Array.isArray(s.subs)?s.subs.find(x=>x.id===sub2Id):null; }
function needSub2(d){ const c=catByName(d.cat), s=subOf(d.cat,d.sub); return !!(c&&!c.special&&s&&Array.isArray(s.subs)&&s.subs.length); }

/* ---------- moteur ---------- */
function virtualPlans(){
  const out=[];
  cfg.categories.forEach(c=>{
    if(c.special==="birthday") c.subs.forEach(s=>{ if(isISO(s.birth)&&+s.budget>0) out.push({id:"bd-"+s.id,virtual:true,special:"birthday",kind:"expense",nature:"variable",label:"Anniversaire "+s.name,amount:+s.budget,acc:c.acc||"cc",cat:c.name,sub:s.id,persons:personFromName(s.name)?[personFromName(s.name)]:[],freq:"annual",date:s.birth}); });
    if(c.special==="christmas") c.subs.forEach(s=>{ if(+s.budget>0) out.push({id:"xm-"+s.id,virtual:true,special:"christmas",kind:"expense",nature:"variable",label:"Noël "+s.name,amount:+s.budget,acc:c.acc||"cc",cat:c.name,sub:s.id,persons:personFromName(s.name)?[personFromName(s.name)]:[],freq:"annual",date:"2000-12-01"}); });
  });
  return out;
}
function allPlans(){ if(!memo.has("plans")) memo.set("plans",cfg.plans.concat(virtualPlans())); return memo.get("plans"); }
function occurrences(p,ym){
  if(!isISO(p.date)) return [];
  const [sy,sm,sd]=p.date.split("-").map(Number); const [y,m]=ym.split("-").map(Number);
  if(ym<p.date.slice(0,7)) return [];
  if(p.end&&ym>p.end.slice(0,7)) return [];
  const diff=(y-sy)*12+(m-sm), dim=daysIn(y,m); let res=[];
  if(p.freq==="once"){ if(diff===0) res.push(p.date); }
  else if(p.freq==="weekly"||p.freq==="biweekly"){
    const step=(p.freq==="weekly"?7:14)*864e5; let t=Date.UTC(sy,sm-1,sd);
    const a=Date.UTC(y,m-1,1), b=Date.UTC(y,m-1,dim);
    if(t<a) t+=Math.ceil((a-t)/step)*step;
    while(t<=b){ res.push(isoUTC(t)); t+=step; }
  } else { const k=FREQ_STEP[p.freq]||1; if(diff%k===0) res.push(`${ym}-${pad(Math.min(sd,dim))}`); }
  if(p.end) res=res.filter(d=>d<=p.end);
  return res.map(d=>{ let label=p.label; if(p.special==="birthday"){ const s=subOf(p.cat,p.sub); const a=s?ageOn(s.birth,d):null; if(a!=null) label+=` · ${a} ans`; } return {p,date:d,key:p.id+"@"+d,label,amount:p.amount}; });
}
function planTransferAmounts(p){
  const cross=curOf(p.from)!==curOf(p.to);
  const to=!cross?p.amount:(curOf(p.from)==="CHF"?p.amount*cfg.planRate:p.amount/cfg.planRate);
  return {amtFrom:p.amount,amtTo:r2(to),fee:cross?(+cfg.planFee||0):0};
}
function occAsTx(o){ const p=o.p;
  if(p.kind==="transfer") return Object.assign({kind:"transfer",from:p.from,to:p.to,date:o.date,nature:"fixe"},planTransferAmounts(p));
  return {kind:p.kind,acc:p.acc,amount:o.amount!=null?o.amount:p.amount,date:o.date,nature:p.nature,cat:p.cat,persons:personsOf(p),personOther:p.personOther};
}
function txFlows(t){
  if(t.kind==="income") return [[t.acc,+t.amount]];
  if(t.kind==="expense") return [[t.acc,-t.amount]];
  return [[t.from,-(t.amtFrom+(t.fee||0))],[t.to,+t.amtTo]];
}
const flowFor = (t,acc) => txFlows(t).reduce((s,[id,d])=>s+(id===acc?d:0),0);
const isVarExp = x => x.kind==="expense"&&x.nature==="variable";
function effTx(ym){
  const k="eff:"+ym; if(memo.has(k)) return memo.get(k);
  const list=TX[ym]||[]; const bulk=new Set(list.filter(t=>t.bulk).map(t=>t.cat+"|"+t.acc));
  const r=list.filter(t=>t.bulk||!(isVarExp(t)&&bulk.has(t.cat+"|"+t.acc)));
  memo.set(k,r); return r;
}

function calcMonth(ym){
  if(memo.has(ym)) return memo.get(ym);
  const occ=allPlans().flatMap(p=>occurrences(p,ym)).sort((a,b)=>a.date<b.date?-1:1);
  const est=(cfg.varEst||{})[ym]||{}, seen=new Set();
  occ.forEach(o=>{ if(isVarExp(o.p)&&est[o.p.id]!=null){ o.amount=seen.has(o.p.id)?0:+est[o.p.id]; seen.add(o.p.id); o.est=true; } });
  Object.keys(est).filter(k=>k.startsWith("c:")).forEach(k=>{ const [cat,acc]=k.slice(2).split("|"); if(!accById(acc)) return; occ.push({p:{id:"est-"+k,virtual:true,kind:"expense",nature:"variable",label:cat,amount:+est[k],acc,cat,persons:[],freq:"once",date:ym+"-01"},date:ym+"-01",key:"est-"+k+"@"+ym,label:cat,amount:+est[k],est:true}); });

  let sf=0,st=0;

  const rP=+cfg.planRate||1, rA=sf>0?st/sf:rP;
  const P=blank(), A=blank();
  occ.forEach(o=>addTx(P,occAsTx(o),rP));
  tx.forEach(t=>addTx(A,t,rA));
  const linked={}; tx.forEach(t=>{ if(t.link) (linked[t.link]=linked[t.link]||[]).push(t); });
  const occKeys=new Set(occ.map(o=>o.key));
  const pointRows=occ.filter(o=>!isVarExp(o.p)).map(o=>{
    const ts=linked[o.key]||[]; const actual=ts.reduce((s,t)=>s+(t.kind==="transfer"?t.amtFrom:t.amount),0);
    return {o,ts,planned:o.amount!=null?o.amount:o.p.amount,actual,cur:curOf(o.p.kind==="transfer"?o.p.from:o.p.acc),done:ts.length>0,late:!ts.length&&(o.p.noDate?lastDay(ym)<TODAY:o.date<TODAY)};
  });
  const vmap={}; const vget=(cat,acc)=>{ const k=cat+"|"+acc; return vmap[k]=vmap[k]||{key:k,cat,acc,planned:0,actual:0,tx:[],labels:[],bulk:null}; };
  occ.filter(o=>isVarExp(o.p)).forEach(o=>{ const v=vget(o.p.cat,o.p.acc); v.planned+=(o.amount!=null?o.amount:o.p.amount); v.labels.push(o.label); });
  tx.filter(isVarExp).forEach(t=>{ const v=vget(t.cat,t.acc); v.actual+=t.amount; v.tx.push(t); if(t.bulk) v.bulk=t; });
  const varRows=Object.values(vmap).sort((a,b)=>b.planned-a.planned||b.actual-a.actual);
  const unplanned=tx.filter(t=>!isVarExp(t)&&!(t.link&&occKeys.has(t.link)));
  let F;
  if(ym<CUR_YM) F=A; else if(ym>CUR_YM) F=P;
  else {
    F=blank(); tx.forEach(t=>addTx(F,t,rA));
    pointRows.filter(r=>!r.done).forEach(r=>addTx(F,occAsTx(r.o),rP));
    varRows.forEach(v=>{ const rem=Math.max(0,v.planned-v.actual); if(rem>0) addTx(F,{kind:"expense",acc:v.acc,amount:rem,nature:"variable",cat:v.cat,persons:[]},rP); });
  }
  const res={ym,occ,tx,rA,rP,hasRate:sf>0,P,A,F,pointRows,varRows,unplanned};
  memo.set(ym,res); return res;
}
function balanceAt(acc,until){
  const a=accById(acc); if(!a) return 0; let b=+a.bal||0;
  for(const ym in TX){ if(ym<a.balDate.slice(0,7)||ym>until.slice(0,7)) continue; for(const t of effTx(ym)) if(t.date>=a.balDate&&t.date<=until) b+=flowFor(t,acc); }

}

      G.f.code=""; await openVault();
    } else if(kind==="newpass"){
      const p1=G.f.p1||"", p2=G.f.p2||"";

      if(p1!==p2){ gate("newpass","Les deux phrases ne sont pas identiques."); return; }
      G.busy=true; renderGate();
      const salt=b64(rnd(16)); const key=await deriveKey(p1,salt,KDF_ITER);
      if(G.importData){ cfg=normCfg(G.importData.cfg); TX=G.importData.TX||{}; }
      const enc=await encryptData(key,{app:"Mes Comptes",v:VERSION,cfg,TX});
      const existing=G.replace;
      let res;
      if(existing){ res=await sb.from("mescomptes_vault").update({salt,iv:enc.iv,data:enc.data,kdf_iter:KDF_ITER,version:(S.version||0)+1}).eq("user_id",S.uid).select("version"); }
      else res=await sb.from("mescomptes_vault").insert({user_id:S.uid,salt,iv:enc.iv,data:enc.data,kdf_iter:KDF_ITER,version:1}).select("version");
      if(res.error){ gate("newpass",FR_ERR(res.error.message)); return; }
      S.key=key; S.salt=salt; S.iter=KDF_ITER; S.version=res.data&&res.data[0]?res.data[0].version:1;
      if(G.f.remember!==false) await idbSet("k:"+S.uid,{key,salt}); else await idbDel("k:"+S.uid);
      G.f={}; G.importData=null; G.replace=false;
      await enterApp({cfg,TX},{iv:enc.iv,data:enc.data},false,false); toast("Coffre chiffré créé");
    } else if(kind==="pass"){
      const p1=G.f.p1||""; if(!p1){ gate("pass","Entre ta phrase secrète."); return; }
      G.busy=true; renderGate();
      const key=await deriveKey(p1,S.salt,S.iter); let obj;
      try{ obj=await decryptData(key,G.row.iv,G.row.data); }catch(e){ G.f.p1=""; gate("pass","Phrase secrète incorrecte."); return; }
      S.key=key; if(G.f.remember!==false) await idbSet("k:"+S.uid,{key,salt:S.salt}); else await idbDel("k:"+S.uid);
      G.f={}; await enterApp(obj,G.row,mode==="offline",false);
    }

}

function sheetPass(s){
  return sheetHead("Changer la phrase secrète")+`<div class="form">${fld("Phrase actuelle",inp("old","password",'autocomplete="current-password"'))}${fld("Nouvelle phrase",inp("p1","password",'autocomplete="new-password"'),"12 caractères minimum.")}${fld("Confirme la nouvelle phrase",inp("p2","password",'autocomplete="new-password"'))}${s.err?`<div class="err" role="alert">${esc(s.err)}</div>`:""}<button class="btn primary block" data-act="passSave">${s.busy?"Chiffrement…":"Changer la phrase"}</button></div><p class="note">Tes autres appareils te demanderont la nouvelle phrase.</p>`;

async function passSave(s){
  const d=s.d; if(s.busy) return;
  if((d.p1||"").length<12){ s.err="La nouvelle phrase doit contenir au moins 12 caractères."; return renderSheet(); }
  if(d.p1!==d.p2){ s.err="Les deux nouvelles phrases ne sont pas identiques."; return renderSheet(); }
  s.busy=true; s.err=""; renderSheet();
  try{
    const oldKey=await deriveKey(d.old||"",S.salt,S.iter); const row=await fetchVault();
    try{ await decryptData(oldKey,row.iv,row.data); }catch(e){ s.busy=false; s.err="Phrase actuelle incorrecte."; return renderSheet(); }
    const salt=b64(rnd(16)), key=await deriveKey(d.p1,salt,KDF_ITER), enc=await encryptData(key,{app:"Mes Comptes",v:VERSION,cfg,TX});
    const {data,error}=await sb.from("mescomptes_vault").update({salt,iv:enc.iv,data:enc.data,kdf_iter:KDF_ITER,version:row.version+1}).eq("user_id",S.uid).eq("version",row.version).select("version");
    if(error||!data||!data.length) throw error||new Error("Données modifiées entre-temps, réessaie.");
    S.key=key; S.salt=salt; S.iter=KDF_ITER; S.version=data[0].version; putCache(enc,false);
    if(await idbGet("k:"+S.uid)) await idbSet("k:"+S.uid,{key,salt});
    closeSheet(); toast("Phrase secrète changée");
  }catch(e){ s.busy=false; s.err=FR_ERR(e&&e.message); renderSheet(); }
}

function yearChart(rows){
  const W=340,H=170,pl=42,pr=6,pt=10,pb=22;
  const vals=rows.flatMap(r=>[r.p,r.ym<=CUR_YM?(r.ym<CUR_YM?r.a:r.f):r.p]);
  let mx=Math.max(0,...vals), mn=Math.min(0,...vals); if(mx===mn) mx=100;
  const nice=v=>{ if(v===0) return 0; const e=Math.pow(10,Math.floor(Math.log10(Math.abs(v)))); return Math.sign(v)*Math.ceil(Math.abs(v)/e)*e; };
  mx=nice(mx); mn=nice(mn);
  const y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const gw=(W-pl-pr)/12, bw=Math.min(9,gw/2-2);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Résultat mensuel prévu et réel">`;
  const ticks=new Set([mx,0]); if(mn<0) ticks.add(mn); else if(mx>0) ticks.add(mx/2);
  ticks.forEach(v=>{ s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===0?'stroke-width="1.2"':'stroke-dasharray="3 3"'}/><text x="${pl-5}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${new Intl.NumberFormat("fr-FR",{notation:"compact",maximumFractionDigits:1}).format(v)} €</text>`; });
  rows.forEach((r,i)=>{
    const x=pl+i*gw+gw/2, real=r.ym<CUR_YM?r.a:r.ym===CUR_YM?r.f:null;
    const bar=(v,dx,fill,op)=>{ const y0=y(0),y1=y(v); return `<rect x="${x+dx}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y1-y0))}" rx="2" fill="${fill}" opacity="${op}"/>`; };
    s+=bar(r.p,-bw-1,"var(--line)",1);
    if(real!=null) s+=bar(real,1,real<0?"var(--neg)":"var(--pos)",r.ym===CUR_YM?.55:1);
    s+=`<text x="${x}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="${r.ym===CUR_YM?"var(--ink)":"var(--muted)"}" font-weight="${r.ym===CUR_YM?700:400}">${monthName(r.ym,"narrow").toUpperCase()}</text>`;
  });
  return s+"</svg>";
}

const topS = () => stack[stack.length-1];

function pushSheet(s){ stack.push(s); renderSheet(); document.getElementById("sheet").scrollTop=0; }
function popSheet(){ stack.pop(); if(!stack.length) closeSheet(); else renderSheet(); }
function closeSheet(){ stack=[]; document.getElementById("sheet").classList.remove("open"); document.getElementById("scrim").classList.remove("open"); }
function sheetHead(title,sub){ return `<div class="grab"></div><div class="sh">${stack.length>1?`<button class="iconbtn" data-act="back" aria-label="Retour">${I.left}</button>`:""}<h3>${title}${sub?`<small>${sub}</small>`:""}</h3><button class="iconbtn" data-act="close" aria-label="Fermer">${I.close}</button></div>`; }

/* ----- assistant pas à pas ----- */
function wizSteps(d){ if(d.kind==="transfer") return ["kind","accounts","amount","recap"]; const s=["kind"]; if(d.kind==="expense") s.push("nature"); return s.concat(["cat","sub"],needSub2(d)?["sub2"]:[],["amount","recap"]); }
function newWizard(mode,kind){
  const d={mode,step:"kind",kind:"",nature:"",cat:"",sub:"",amount:"",acc:"cc",date:mode==="tx"?(ui.ym===CUR_YM?TODAY:ui.ym+"-01"):CUR_YM+"-05",persons:[],personOther:"",sub2:"",noDate:"",label:"",link:"",from:"chf",to:"cc",amtFrom:"",amtTo:"",fee:"",freq:"monthly",end:""};
  if(!accById(d.acc)) d.acc=cfg.accounts[0].id;
  if(kind){ applyKind(d,kind); d.step=wizSteps(d)[1]; }
  return d;
}
function applyKind(d,k){
  d.kind=k; d.link="";
  if(k==="expense"){ d.nature=""; if(!accById(d.acc)||curOf(d.acc)==="CHF") d.acc=accById("cc")?"cc":cfg.accounts[0].id; }
  else { d.nature="fixe"; if(k==="income"&&accById("chf")) d.acc="chf"; }
  if(k==="transfer"){ if(!accById(d.from)) d.from=cfg.accounts[0].id; if(!accById(d.to)||d.to===d.from) d.to=(cfg.accounts.find(a=>a.id!==d.from)||{}).id; }
}
function applySub(d){
  const c=catByName(d.cat), s=c&&c.subs.find(x=>x.id===d.sub); if(!s) return;
  if(c.special==="birthday"){ const ref=d.mode==="tx"?d.date:(nextBirthday(s.birth)||d.date); const a=ageOn(s.birth,ref); d.label=`Anniversaire ${s.name}${a!=null?` (${a} ans)`:""}`; { const pid=personFromName(s.name); if(pid) d.persons=[pid]; } if(d.mode==="plan"&&isISO(s.birth)){ d.date=s.birth; d.freq="annual"; } if(s.budget&&!d.amount) d.amount=numStr(s.budget); }
  else if(c.special==="christmas"){ d.label=`Noël ${s.name}`; { const pid=personFromName(s.name); if(pid) d.persons=[pid]; } if(s.budget&&!d.amount) d.amount=numStr(s.budget); }
}
function pendingOcc(d){
  if(d.mode!=="tx"||!isISO(d.date)) return [];
  if(d.kind==="expense"&&d.nature!=="fixe") return [];
  const c=calcMonth(d.date.slice(0,7));
  return c.pointRows.filter(r=>r.o.p.kind===d.kind&&(!r.done||(d.id&&r.ts.some(t=>t.id===d.id)))).sort((a,b)=>(b.o.p.cat===d.cat)-(a.o.p.cat===d.cat));
}
function validateDraft(d){
  if(!d.kind) return "Choisis dépense, revenu ou virement.";
  if(d.kind==="transfer"){
    if(!d.from||!d.to||d.from===d.to) return "Choisis deux comptes différents.";
    if(!(num(d.amtFrom)>0)) return "Indique le montant envoyé.";
    if(d.mode==="tx"&&curOf(d.from)!==curOf(d.to)&&!(num(d.amtTo)>0)) return "Indique le montant reçu sur "+accName(d.to)+".";
    if(d.fee&&!(num(d.fee)>=0)) return "Les frais doivent être un montant positif.";
  } else {
    if(d.kind==="expense"&&!d.nature) return "Choisis fixe ou variable.";
    if(!d.cat) return "Choisis une catégorie.";
    if(!(num(d.amount)>0)) return "Indique un montant supérieur à 0.";
    if(!accById(d.acc)) return "Choisis un compte.";
  }
  if(!isISO(d.date)) return "Choisis une date.";
  if(d.mode==="plan"&&d.end&&d.end<d.date) return "La date de fin doit être après la première date.";
  return null;
}
function sheetWizard(s){
  const d=s.d, steps=wizSteps(d), idx=steps.indexOf(d.step);

function wzAdvance(s){ const d=s.d, st=wizSteps(d), i=st.indexOf(d.step); s.err=""; d.step=st[Math.min(st.length-1,i+1)]; }
function findOcc(key){ const i=key.indexOf("@"); const p=allPlans().find(x=>x.id===key.slice(0,i)); if(!p) return null; const date=key.slice(i+1); const o=occurrences(p,date.slice(0,7)).find(x=>x.key===key); return o||{p,date,key,label:p.label}; }

function findTx(id){ for(const ym in TX){ const i=TX[ym].findIndex(t=>t.id===id); if(i>=0) return {ym,i,t:TX[ym][i]}; } return null; }
function removeTx(id,docs){ const f=findTx(id); if(f){ TX[f.ym].splice(f.i,1); docs.add("tx-"+f.ym); } }
function upsertTx(t,docs){ removeTx(t.id,docs); const ym=t.date.slice(0,7); (TX[ym]=TX[ym]||[]).push(t); docs.add("tx-"+ym); }
function wzSave(s){

/* ----- revenus du mois ----- */
function chfTransfers(c){
  const isX=t=>t.kind==="transfer"&&curOf(t.from)==="CHF"&&curOf(t.to)==="EUR";
  const done=c.tx.filter(isX).sort((a,b)=>a.date<b.date?-1:1);
  const planned=c.pointRows.find(r=>r.o.p.kind==="transfer"&&curOf(r.o.p.from)==="CHF"&&curOf(r.o.p.to)==="EUR"&&!r.done)||null;
  return {done,planned};
}
const chfAcc = () => (cfg.accounts.find(a=>a.id==="chf")||cfg.accounts.find(a=>a.cur==="CHF")||{}).id;
const eurMain = () => (accById("cc")||cfg.accounts.find(a=>a.cur==="EUR")||{}).id;
function incomeRows(ym){
  const c=calcMonth(ym), rows=[];
  c.pointRows.filter(r=>r.o.p.kind==="income").forEach(r=>rows.push({key:r.o.key,label:r.o.label,acc:r.o.p.acc,cat:r.o.p.cat,sub:r.o.p.sub||"",person:r.o.p.person||"famille",planned:r.o.p.amount,tx:r.ts[0]||null,link:r.o.key}));
  ["Salaire","Allocations"].forEach(cat=>{
    if(rows.some(r=>r.cat===cat)) return;
    const tx=(TX[ym]||[]).find(t=>t.kind==="income"&&t.cat===cat&&!t.link)||null;
    rows.push({key:"virt:"+cat,label:cat,acc:tx?tx.acc:chfAcc(),cat,sub:"",person:cat==="Allocations"?"leonard":"william",planned:null,tx,link:null});
  });
  return rows;
}
function openIncome(push){
  const ym=ui.ym, rows=incomeRows(ym), d={};
  rows.forEach(r=>{ d["on:"+r.key]=!!r.tx||(r.planned!=null&&ym<=CUR_YM); d["amt:"+r.key]=numStr(r.tx?r.tx.amount:r.planned); });
  (push?pushOrOpen:openSheet)({type:"income",ym,keys:rows.map(r=>r.key),d});
}
function sheetIncome(s){

      ${fld(`Montant reçu (${cur})`,inp("amt:"+k,"text",`inputmode="decimal" placeholder="${r.planned!=null?numStr(r.planned):"0"}"`))}</div>`; });
  const others=(TX[s.ym]||[]).filter(t=>t.kind==="income"&&!rows.some(r=>r.tx&&r.tx.id===t.id));

function saveIncome(s){
  const d=s.d, rows=incomeRows(s.ym), date=s.ym+"-01", plan=[];

    const k=r.key;
    if(!d["on:"+k]){ if(r.tx) plan.push({off:r.tx}); continue; }
    const amt=r2(num(d["amt:"+k])); if(!(amt>0)){ s.err=`Indique le montant de « ${r.label} ».`; return renderSheet(); }
    const t=Object.assign({},r.tx||{id:uid8(),kind:"income",nature:"fixe"},{date,amount:amt,acc:r.acc,cat:r.cat,sub:r.sub,label:r.label,person:r.person,link:r.link});

  }
  const docs=new Set(); plan.forEach(x=>{ if(x.off) removeTx(x.off.id,docs); else upsertTx(x.t,docs); });
  closeSheet(); changed([...docs]); toast("Revenus du mois enregistrés");
}

function estRows(ym){

    rows.push({key:p.id,label:occurrences(p,ym)[0].label,cat:p.cat,acc:p.acc,def,val:est[p.id]}); });
  Object.keys(est).filter(k=>k.startsWith("c:")).forEach(k=>{ const [cat,acc]=k.slice(2).split("|"); rows.push({key:k,label:cat,cat,acc,def:0,val:est[k]}); });
  rows.forEach(r=>{ const v=c.varRows.find(x=>x.cat===r.cat&&x.acc===r.acc), pv=pc.varRows.find(x=>x.cat===r.cat&&x.acc===r.acc); r.actual=v?v.actual:0; r.last=pv?pv.actual:0; });
  return rows;
}

function saveBulk(s){

function makeSub(c,d){
  const name=(d.nsName||"").trim(); if(!name) return {err:"Indique un nom."};
  if(c.subs.some(x=>norm(x.name)===norm(name))) return {err:"Ce nom existe déjà dans cette catégorie."};
  const s={id:uid8(),name}; if(!c.special) s.subs=[];
  if(c.special==="birthday"){ if(!isISO(d.nsBirth)) return {err:"Indique la date de naissance."}; s.birth=d.nsBirth; s.budget=r2(num(d.nsBudget)||0); }
  if(c.special==="christmas") s.budget=r2(num(d.nsBudget)||0);
  c.subs.push(s); d.nsName=""; d.nsBirth=""; d.nsBudget=""; return {sub:s};
}
function renameCategory(c,newName){
  const old=c.name; if(!newName||newName===old) return false;
  if(cfg.categories.some(x=>x!==c&&norm(x.name)===norm(newName))){ toast("Cette catégorie existe déjà"); return false; }
  c.name=newName; cfg.plans.forEach(p=>{ if(p.cat===old) p.cat=newName; });
  const docs=["config"]; for(const ym in TX){ let ch=false; TX[ym].forEach(t=>{ if(t.cat===old){ t.cat=newName; ch=true; } }); if(ch) docs.push("tx-"+ym); }
  changed(docs); return true;
}

function updateLive(){
  const s=topS(); if(!s||!s.d) return; const d=s.d;
  const r=document.querySelector('[data-live="rate"]');
  if(r){ const a=num(d.amtFrom), b=num(d.amtTo), f=num(d.fee)||0;
    if(a>0&&b>0){ const fromC=curOf(d.from), rate=fromC==="CHF"?b/a:a/b, eff=fromC==="CHF"?b/(a+f):(a+f)/b;
      r.innerHTML=`Taux obtenu : <b>1 CHF = ${rate.toFixed(4).replace(".",",")} €</b>${f?` · avec frais ${eff.toFixed(4).replace(".",",")}`:""} <span class="mut">(prévu ${String(cfg.planRate).replace(".",",")})</span>`; }
    else r.textContent=`Saisis le montant envoyé et reçu pour voir le taux obtenu. Taux prévu : ${String(cfg.planRate).replace(".",",")}.`; }
  const p=document.querySelector('[data-live="planrate"]');
  if(p){ const a=num(d.amtFrom); const t=planTransferAmounts({from:d.from,to:d.to,amount:a>0?a:0}); p.innerHTML=`Reçu prévu : <b>${fmt(t.amtTo,curOf(d.to))}</b> au taux de ${String(cfg.planRate).replace(".",",")}${t.fee?` · frais prévus ${fmt(t.fee,curOf(d.from))}`:""}`; }
  const lc=document.querySelector('[data-live="chf"]');
  if(lc){ const a=num(d.sent), b=num(d.recv);
    if(a>0&&b>0){ const r=b/a, theo=a*cfg.planRate, diff=theo-b; lc.innerHTML=`Taux obtenu : <b>1 CHF = ${r.toFixed(4).replace(".",",")} €</b><br><span class="mut">Au taux prévu (${String(cfg.planRate).replace(".",",")}), tu aurais reçu ${fmt(theo,"EUR")} : ${diff>=0?"coût":"gain"} de ${fmt(Math.abs(diff),"EUR")}.</span>`; }
    else lc.textContent="Saisis les deux montants : le taux et la différence (frais compris) s'affichent ici."; }
  document.querySelectorAll('[data-live="irate"]').forEach(el=>{ const k=el.dataset.k, a=num(d["from:"+k]), b=num(d["to:"+k]); el.innerHTML=a>0&&b>0?`Taux obtenu : <b>${(b/a).toFixed(4).replace(".",",")}</b> <span class="mut">(prévu ${String(cfg.planRate).replace(".",",")})</span>`:"Saisis les deux montants pour voir le taux."; });
}

/* ---------- toast ---------- */
let toastT;
function toast(msg,undo){
  const el=document.getElementById("toast"); el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">Annuler</button>':""}`;
  el._undo=undo; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),undo?5000:2200);
}

/* ---------- événements ---------- */
const loading=()=>{ if(mode==="loading"){ toast("Chargement de tes données…"); return true; } return false; };
document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act, s=topS();
  switch(act){
    case "tab": ui.tab=a.dataset.tab; try{localStorage.setItem(LS+".tab",ui.tab)}catch(x){} render(); window.scrollTo(0,0); break;
    case "prevM": ui.ym=addMonths(ui.ym,-1); render(); break;
    case "nextM": ui.ym=addMonths(ui.ym,1); render(); break;
    case "prevY": ui.year--; render(); break;
    case "nextY": ui.year++; render(); break;
    case "goMonth": ui.ym=a.dataset.ym; ui.tab="mois"; render(); window.scrollTo(0,0); break;
    case "close": closeSheet(); break;
    case "back": popSheet(); break;
    case "fab": if(loading()) break; openSheet({type:"wizard",d:newWizard("tx")}); break;
    case "newPlan": if(loading()) break; pushOrOpen({type:"wizard",d:newWizard("plan")}); break;
    case "newPlanIncome": pushSheet({type:"wizard",d:newWizard("plan","income")}); break;
    case "otherIncome": pushSheet({type:"wizard",d:newWizard("tx","income")}); break;
    case "editPlan": { const p=cfg.plans.find(x=>x.id===a.dataset.id); if(p) pushOrOpen({type:"wizard",d:planToDraft(p)}); break; }
    case "editTx": { const f=findTx(a.dataset.id); if(!f) break; const w={type:"wizard",d:txToDraft(f.t)}; stack.length?pushSheet(w):openSheet(w); break; }
    case "set": { if(!s||!s.d) break; s.d[a.dataset.f]=a.dataset.v; const d=s.d;
      if(s.type==="wizard"&&a.dataset.f==="from"&&d.to===d.from) d.to=(cfg.accounts.find(x=>x.id!==d.from)||{}).id;
      renderSheet(); break; }
    case "wz": { const d=s.d, f=a.dataset.f, v=a.dataset.v;
      if(f==="kind") applyKind(d,v);
      else if(f==="cat"){ if(d.cat!==v){ d.sub=""; d.link=""; } d.cat=v; const c=catByName(v); if(c&&c.special&&c.acc&&accById(c.acc)) d.acc=c.acc; }
      else if(f==="sub"){ if(d.sub!==v) d.sub2=""; d.sub=v; applySub(d); }
      else if(f==="sub2"){ d.sub2=v; }
      else { d[f]=v; if(f==="nature"&&v==="variable") d.link=""; if(f==="nature"&&d.mode==="plan"&&!d.id) d.noDate=v==="variable"?"1":""; }
      wzAdvance(s); renderSheet(); break; }
    case "wzBackHead": { const st=wizSteps(s.d), i=st.indexOf(s.d.step); if(i>0&&!(s.d.id&&s.d.step==="recap")){ s.d.step=st[i-1]; s.err=""; renderSheet(); } else popSheet(); break; }
    case "wzBack": { const st=wizSteps(s.d), i=st.indexOf(s.d.step); s.d.step=st[Math.max(0,i-1)]; s.err=""; renderSheet(); break; }
    case "wzGo": s.d.step=a.dataset.v; s.err=""; renderSheet(); break;
    case "wzNext": { if(s.d.step==="amount"){ const err=validateDraft(s.d); if(err){ s.err=err; renderSheet(); break; } } if(s.d.step==="accounts"&&(!s.d.to||s.d.from===s.d.to)){ toast("Choisis deux comptes différents"); break; } wzAdvance(s); renderSheet(); break; }
    case "wzSave": wzSave(s); break;
    case "wzDel": { const d=s.d; if(d.mode==="plan") askConfirm("Supprimer ?","L'événement disparaît de tous les mois. Les opérations déjà pointées sont conservées et passent en « hors prévision ».","Supprimer l'événement",()=>{ cfg.plans=cfg.plans.filter(p=>p.id!==d.id); closeSheet(); changed(["config"]); toast("Événement supprimé"); });

    case "delSub2": { const c=cfg.categories.find(x=>x.id===a.dataset.cat), sub=c&&c.subs.find(x=>x.id===a.dataset.sub); if(!sub) break; sub.subs=(sub.subs||[]).filter(y=>y.id!==a.dataset.id); changed(["config"]); renderSheet(); break; }

    case "confirmOk": { const run=s&&s.run; if(run) run(); break; }
    case "point": {
      const o=findOcc(a.dataset.key); if(!o) break; const p=o.p;

      if(p.kind==="transfer") Object.assign(t,{from:p.from,to:p.to,nature:"fixe"},planTransferAmounts(p)); else Object.assign(t,{amount:p.amount,acc:p.acc,cat:p.cat,sub:p.sub||"",nature:p.nature||"fixe"});
      const docs=new Set(); upsertTx(t,docs); changed([...docs]); if(stack.length) renderSheet();

    case "openExpenses": openExpenses(); break;
    case "openEst": if(loading()) break; openEst(); break;

    case "openChf": openChf(); break;
    case "saveChf": saveChf(s); break;
    case "newChf": { const c=calcMonth(s.ym); stack[stack.length-1]={type:"chf",ym:s.ym,d:{sent:"",recv:"",date:s.ym===CUR_YM?TODAY:s.ym+"-01",link:""},others:chfTransfers(c).done.map(x=>x.id)}; renderSheet(); break; }
    case "delChf": askConfirm("Supprimer ce transfert ?","Il sera retiré des comptes CHF et courant.","Supprimer",()=>{ const docs=new Set(); removeTx(s.d.id,docs); closeSheet(); changed([...docs]); toast("Transfert supprimé"); }); break;
    case "openPlans": openSheet({type:"plans"}); break;

    case "openIncomeEntry": openIncome(true); break;

/* ----- code de verrouillage ----- */
let locked=false, unlocked=false, lockBuf="", lockMsg="", lockTries=0, lockUntil=0, lastActive=Date.now(), hiddenAt=0;
async function hashPin(pin,salt){
  const str=salt+":"+pin;
  try{ if(window.crypto&&crypto.subtle){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); } }catch(e){}
  let h1=0x811c9dc5,h2=0x9e3779b9; for(let k=0;k<2000;k++) for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,16777619)>>>0; h2=Math.imul(h2^c,2246822519)>>>0; }
  return "f"+h1.toString(16)+h2.toString(16);
}
const keypad=act=>`<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="${act}" data-v="${n}" aria-label="${n}">${n}</button>`).join("")}<span></span><button data-act="${act}" data-v="0" aria-label="0">0</button><button class="txt" data-act="${act}" data-v="del" aria-label="Effacer">Effacer</button></div>`;
const pdots=(n,len,shake)=>`<div class="pdots ${shake?"shake":""}" aria-hidden="true">${[...Array(len)].map((_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</div>`;
function lockNow(){ if(!cfg.pin) return; locked=true; lockBuf=""; lockMsg=""; renderLock(); }
function renderLock(shake){
  const el=document.getElementById("lock");
  if(!locked){ el.classList.remove("on"); el.innerHTML=""; return; }
  const wait=lockUntil>Date.now()?Math.ceil((lockUntil-Date.now())/1000):0;
  el.innerHTML=`<div class="logo" aria-hidden="true">mc</div><h2>Mes Comptes</h2><p>Entre ton code</p>${pdots(lockBuf.length,cfg.pin.len,shake)}<div class="pmsg" role="alert">${wait?`Trop d'essais. Réessaie dans ${wait} s.`:esc(lockMsg)}</div>${keypad("lk")}${localStorage.getItem(BIO_KEY)?`<button class="btn" style="margin-top:16px" data-act="bioUnlock">Utiliser l'empreinte / Face ID</button>`:""}<button class="forgot" data-act="lkForgot">Code oublié ?</button>`;
  el.classList.add("on");
}
async function lockKey(v){
  if(lockUntil>Date.now()){ renderLock(); return; }
  if(v==="del"){ lockBuf=lockBuf.slice(0,-1); lockMsg=""; renderLock(); return; }
  if(lockBuf.length>=cfg.pin.len) return;
  lockBuf+=v; renderLock();
  if(lockBuf.length===cfg.pin.len){
    const ok=(await hashPin(lockBuf,cfg.pin.salt))===cfg.pin.hash;
    if(ok){ locked=false; unlocked=true; lockTries=0; lastActive=Date.now(); renderLock(); }
    else { lockTries++; lockBuf=""; lockMsg="Code incorrect";
      if(lockTries>=5){ lockUntil=Date.now()+30000; lockTries=0; const iv=setInterval(()=>{ if(!locked||lockUntil<=Date.now()){ clearInterval(iv); lockMsg=""; } if(locked) renderLock(); },1000); }
      renderLock(true); }
  }
}
function sheetPin(s){
  const titles={set:"Activer un code",change:"Changer le code",off:"Désactiver le code"};
  const prompts={current:"Entre ton code actuel",new:"Choisis un nouveau code",confirm:"Confirme le nouveau code"};
  const len=s.stage==="current"?cfg.pin.len:s.len;
  let h=sheetHead(titles[s.purpose])+`<div style="text-align:center"><div class="q">${prompts[s.stage]}</div>`;
  if(s.stage==="new") h+=`<div class="seg" style="max-width:260px;margin:0 auto 12px">${[4,6].map(n=>`<button type="button" data-act="pinLen" data-v="${n}" class="${s.len===n?"on":""}">${n} chiffres</button>`).join("")}</div>`;
  h+=`${pdots(s.buf.length,len,s.shake)}<div class="pmsg" role="alert">${esc(s.msg||"")}</div>${keypad("pk")}</div>`;
  s.shake=false; return h;
}
async function pinKey(s,v){
  const len=s.stage==="current"?cfg.pin.len:s.len;
  if(v==="del"){ s.buf=s.buf.slice(0,-1); s.msg=""; renderSheet(); return; }
  if(s.buf.length>=len) return;
  s.buf+=v; renderSheet(); if(s.buf.length<len) return;
  const entered=s.buf; s.buf="";
  if(s.stage==="current"){
    if((await hashPin(entered,cfg.pin.salt))!==cfg.pin.hash){ s.msg="Code incorrect"; s.shake=true; renderSheet(); return; }
    if(s.purpose==="off"){ cfg.pin=null; closeSheet(); changed(["config"]); toast("Code désactivé"); return; }
    s.stage="new"; s.msg=""; renderSheet(); return;
  }
  if(s.stage==="new"){ s.first=entered; s.stage="confirm"; s.msg=""; renderSheet(); return; }
  if(entered!==s.first){ s.stage="new"; s.first=""; s.msg="Les deux codes ne correspondent pas. Recommence."; s.shake=true; renderSheet(); return; }
  const salt=uid8()+uid8();
  cfg.pin={salt,hash:await hashPin(entered,salt),len:s.len,timeout:cfg.pin?cfg.pin.timeout:1};
  unlocked=true; closeSheet(); changed(["config"]); toast(s.purpose==="set"?"Code activé":"Code changé");
}

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }

});

function doRestore(j){
  if(!j||!j.cfg){ toast("Ce n'est pas une sauvegarde Mes Comptes valide."); return; }
  askConfirm("Restaurer ?",`Les données actuelles seront remplacées par la sauvegarde du ${j.date?longDate(j.date):"?"}.`,"Restaurer",()=>{ closeSheet(); const old=Object.keys(TX); cfg=normCfg(j.cfg); TX=j.TX||{}; changed(["config",...old.map(k=>"tx-"+k),...Object.keys(TX).map(k=>"tx-"+k)]); toast("Sauvegarde restaurée"); });
}
function buildCsv(){
  const q=v=>{ const x=String(v??""); return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; };
  const n=v=>v==null||v===""?"":String(r2(+v)).replace(".",",");
  const head=["Date","Type","Nature","Catégorie","Sous-catégorie","Libellé","Compte","Vers le compte","Montant","Devise","Montant reçu","Devise reçue","Frais","Pour","Prévu"];
  const rows=Object.keys(TX).sort().flatMap(k=>TX[k].slice().sort((a,b)=>a.date<b.date?-1:1)).map(t=>{
    const sub=subOf(t.cat,t.sub);
    if(t.kind==="transfer") return [t.date,"Virement","","","",t.label,accName(t.from),accName(t.to),n(t.amtFrom),curOf(t.from),n(t.amtTo),curOf(t.to),n(t.fee),"",t.link?"oui":""];
    return [t.date,t.kind==="income"?"Revenu":"Dépense",t.kind==="income"?"":(t.bulk?"variable (total)":t.nature),t.cat,sub?sub.name+(sub2Of(t.cat,t.sub,t.sub2)?" › "+sub2Of(t.cat,t.sub,t.sub2).name:""):"",t.label,accName(t.acc),"",n(t.kind==="income"?t.amount:-t.amount),curOf(t.acc),"","","",personLabel(t),t.link?"oui":""];
  });
  return "\ufeff"+[head,...rows].map(r=>r.map(q).join(";")).join("\r\n");
}

  (root||document).querySelectorAll('input[type="date"]').forEach(i=>{ if(!i.dataset.pk){ i.readOnly=true; i.dataset.pk="cal"; i.classList.add("picker"); i.setAttribute("aria-haspopup","dialog"); } });
}
function setInputValue(el,v){ el.value=v; el.dispatchEvent(new Event("input",{bubbles:true})); el.dispatchEvent(new Event("change",{bubbles:true})); }
function calcEval(expr){
  const t=expr.replace(/\s/g,"").replace(/,/g,".").match(/(\d*\.?\d+|\d+\.|[+\-×÷])/g); if(!t) return NaN;
  const tok=[]; for(let i=0;i<t.length;i++){ const x=t[i]; if("+-×÷".includes(x)){ if(!tok.length||"+-×÷".includes(tok[tok.length-1])){ if(x==="-"&&i+1<t.length&&!"+-×÷".includes(t[i+1])){ tok.push(-parseFloat(t[++i])); continue; } return NaN; } tok.push(x); } else tok.push(parseFloat(x)); }
  if("+-×÷".includes(tok[tok.length-1])) tok.pop();
  const st=[tok[0]]; for(let i=1;i<tok.length;i+=2){ const op=tok[i], n=tok[i+1]; if(op==="×") st[st.length-1]*=n; else if(op==="÷"){ if(n===0) return NaN; st[st.length-1]/=n; } else st.push(op,n); }
  let r=st[0]; for(let i=1;i<st.length;i+=2) r = st[i]==="+"? r+st[i+1] : r-st[i+1];
  return isFinite(r)?Math.round(r*100)/100:NaN;
}
function openCalc(el){
  CALC={el,expr:(el.value||"").replace(/[\s  ]/g,"").replace(".",","),err:false};
  if(CALC.expr==="0") CALC.expr="";
  renderCalc(); document.getElementById("calc").classList.add("on");
}
function calcLabel(el){ const l=el.closest("label"); const sp=l&&l.querySelector("span"); return sp?sp.textContent:(el.getAttribute("aria-label")||"Montant"); }
function renderCalc(){
  const e=CALC.expr, hasOp=false;
  const res=e===""?"0":e;
  document.getElementById("calc").innerHTML=`<div class="pad-sheet"><div class="calc-top"><span>${esc(calcLabel(CALC.el))}</span><button class="iconbtn" data-cx="cancel" aria-label="Fermer">${I.close}</button></div>
  <div class="calc-disp"><div class="calc-expr">&nbsp;</div><div class="calc-res ${CALC.err?"err":""}">${esc(res)}</div></div>
  <div class="calc-keys">${["1","2","3","4","5","6","7","8","9",",","0","⌫"].map(k=>`<button type="button" class="${k==="⌫"||k===","?"fn":""}" data-cx="${k}" aria-label="${k==="⌫"?"Effacer":k===","?"virgule":k}">${k}</button>`).join("")}<button type="button" class="ok" data-cx="OK" style="grid-column:1/-1">Valider</button></div></div>`;
}
function calcKey(k){
  let e=CALC.expr; CALC.err=false; const last=e.slice(-1), ops="+-×÷";
  if(k==="cancel"){ document.getElementById("calc").classList.remove("on"); return; }
  if(k==="C") e=""; else if(k==="⌫") e=e.slice(0,-1);
  else if(ops.includes(k)){ if(e===""&&k!=="-") return; if(ops.includes(last)) e=e.slice(0,-1)+k; else e+=k; }
  else if(k===","){ const seg=e.split(/[+\-×÷]/).pop(); if(seg.includes(",")) return; e+=(seg===""?"0,":","); }
  else if(k==="="||k==="OK"){ if(e===""){ if(k==="OK"){ setInputValue(CALC.el,""); document.getElementById("calc").classList.remove("on"); } return; }
    const r=calcEval(e); if(isNaN(r)){ CALC.err=true; renderCalc(); return; }
    const v=String(r).replace(".",",");
    if(k==="="){ CALC.expr=v; renderCalc(); return; }
    setInputValue(CALC.el,v); document.getElementById("calc").classList.remove("on"); return; }
  else { const seg=e.split(/[+\-×÷]/).pop(); if(seg.includes(",")&&seg.split(",")[1].length>=2) return; if(seg==="0"&&k!==",") e=e.slice(0,-1); e+=k; }
  CALC.expr=e; renderCalc();
}
function openCal(el){
  const v=isISO(el.value)?el.value:""; CAL={el,val:v,ym:(v||TODAY).slice(0,7)};
  renderCal(); document.getElementById("cal").classList.add("on");
}
function renderCal(){
  const [y,m]=CAL.ym.split("-").map(Number), first=new Date(Date.UTC(y,m-1,1)).getUTCDay(), off=(first+6)%7, dim=daysIn(y,m);
  const prevDim=daysIn(m===1?y-1:y,m===1?12:m-1); let cells="";
  for(let i=0;i<42;i++){ let d,ym=CAL.ym,out=false; if(i<off){ d=prevDim-off+i+1; ym=addMonths(CAL.ym,-1); out=true; } else if(i>=off+dim){ d=i-off-dim+1; ym=addMonths(CAL.ym,1); out=true; } else d=i-off+1;
    const iso=`${ym}-${pad(d)}`; cells+=`<button type="button" data-cd="${iso}" class="${out?"out":""} ${iso===TODAY?"today":""} ${iso===CAL.val?"sel":""}">${d}</button>`; }
  const optional=!CAL.el.required&&/end|fin/i.test((CAL.el.dataset.f||"")+(CAL.el.closest("label")?.textContent||""));
  document.getElementById("cal").innerHTML=`<div class="pad-sheet"><div class="calc-top"><span>${esc(calcLabel(CAL.el))}</span><button class="iconbtn" data-cd="cancel" aria-label="Fermer">${I.close}</button></div>
  <div class="cal-head"><button class="iconbtn" data-cd="prev" aria-label="Mois précédent">${I.left}</button><b>${monthName(CAL.ym)} ${y}</b><button class="iconbtn" data-cd="next" aria-label="Mois suivant">${I.right}</button></div>
  <div class="cal-grid">${["L","M","M","J","V","S","D"].map(x=>`<div class="wd">${x}</div>`).join("")}${cells}</div>
  <div class="cal-foot"><button type="button" class="btn" data-cd="today">Aujourd'hui</button>${optional?`<button type="button" class="btn" data-cd="clear">Effacer</button>`:""}</div></div>`;
}
function calKey(k){
  if(k==="cancel"){ document.getElementById("cal").classList.remove("on"); return; }
  if(k==="prev"){ CAL.ym=addMonths(CAL.ym,-1); return renderCal(); }
  if(k==="next"){ CAL.ym=addMonths(CAL.ym,1); return renderCal(); }
  if(k==="clear"){ setInputValue(CAL.el,""); document.getElementById("cal").classList.remove("on"); return; }
  const v=k==="today"?TODAY:k; setInputValue(CAL.el,v); document.getElementById("cal").classList.remove("on");
}
document.addEventListener("click",e=>{
  const cx=e.target.closest("[data-cx]"); if(cx){ calcKey(cx.dataset.cx); return; }
  const cd=e.target.closest("[data-cd]"); if(cd){ calKey(cd.dataset.cd); return; }
  if(e.target.id==="calc"){ calcKey("cancel"); return; } if(e.target.id==="cal"){ calKey("cancel"); return; }
  const i=e.target.closest("input[data-pk]"); if(i){ e.preventDefault(); i.blur(); if(i.dataset.pk==="calc") openCalc(i); else openCal(i); }
},true);
document.addEventListener("keydown",e=>{
  if(document.getElementById("calc").classList.contains("on")){ const map={"Enter":"OK","Backspace":"⌫","Escape":"cancel",".":",",",":","}; const k=/^[0-9]$/.test(e.key)?e.key:map[e.key]; if(k){ e.preventDefault(); e.stopPropagation(); calcKey(k); } }
  else if(document.getElementById("cal").classList.contains("on")&&e.key==="Escape"){ calKey("cancel"); }
},true);
new MutationObserver(()=>enhanceInputs()).observe(document.body,{childList:true,subtree:true});

/* ---------- démarrage ---------- */
setSync("loading");
render();
renderGate();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshFromRemote(); });
boot().catch(e=>gate("error",FR_ERR(e&&e.message)));
</script>
