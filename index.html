<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes Comptes</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1B2350">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes Comptes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Plan : ocre et indigo — papier crème, chiffres et titres en indigo (Spectral), actions en ocre. Une colonne mobile : saisie rapide en haut, comptes, résultat, puis détail. */
:root{
  --bg:#1B2350; --surface:#FBF6EE; --surface-2:#EFE4D2; --ink:#1F2340; --muted:#77715F; --line:#E2D6C2;
  --on-bg:#F4EBDD; --on-bg-muted:#B9BEDB; --bg-line:#2E3870;
  --title:#2E3A7A; --accent:#A8661A; --accent-soft:#F3E2C6; --on-accent:#FFF9F0; --ochre:#C98F33;
  --pos:#2F7A52; --pos-soft:#E1EEE4; --neg:#B23A2E; --neg-soft:#F6DED8; --warn:#9A6410; --warn-soft:#F6E7CC;
  --display:"Spectral", "Iowan Old Style", Georgia, serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(31,35,64,.05), 0 8px 24px rgba(31,35,64,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11142A; --surface:#191E3A; --surface-2:#222848; --ink:#EDE6D8; --muted:#A3A0B6; --line:#2E3458;
    --on-bg:#EDE6D8; --on-bg-muted:#A3A0B6; --bg-line:#2E3458;
    --title:#B7C0F2; --accent:#E2B262; --accent-soft:#3A3120; --on-accent:#11142A; --ochre:#E2B262;
    --pos:#7CC79A; --pos-soft:#1C3328; --neg:#F08A7C; --neg-soft:#3B2023; --warn:#E8B04B; --warn-soft:#352A12;
    --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11142A; --surface:#191E3A; --surface-2:#222848; --ink:#EDE6D8; --muted:#A3A0B6; --line:#2E3458;
  --on-bg:#EDE6D8; --on-bg-muted:#A3A0B6; --bg-line:#2E3458;
  --title:#B7C0F2; --accent:#E2B262; --accent-soft:#3A3120; --on-accent:#11142A; --ochre:#E2B262;
  --pos:#7CC79A; --pos-soft:#1C3328; --neg:#F08A7C; --neg-soft:#3B2023; --warn:#E8B04B; --warn-soft:#352A12;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:540px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:540px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-size:19px;font-weight:600;font-style:italic}
.app{font-weight:800;letter-spacing:-.01em}
.ver{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--pos)} .dot.warn{background:var(--warn)} .dot.err{background:var(--neg)}
.period{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;gap:8px}
.period h1{font-family:var(--display);color:var(--title);font-weight:500;font-size:30px;line-height:1.1;margin:0;text-transform:capitalize;text-wrap:balance;text-align:center;letter-spacing:-.01em}
.period small{display:block;text-align:center;color:var(--muted);font-size:12px;font-family:var(--body);text-transform:none;margin-top:3px;font-weight:600}
.iconbtn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
button.card{text-align:left;width:100%}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
/* duo cards */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo-c{padding:14px;display:flex;flex-direction:column;gap:4px;min-height:132px}
.duo-c .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.duo-c .ic svg{width:17px;height:17px}
.duo-c b{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.05}
.duo-c small{font-size:12px;color:var(--muted)}
.duo-c .go{margin-top:auto;font-size:12px;font-weight:700;color:var(--accent)}
/* comptes */
.accounts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.acc{padding:12px 14px 12px 16px;position:relative;overflow:hidden}
.acc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--accent))}
.acc .n{font-size:12px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:6px}
.acc .n span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .lbl{font-size:11px;color:var(--muted);margin-top:6px}
.acc .v{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.acc .s{font-size:12px;color:var(--muted)}
.acc .s b{color:var(--ink);font-weight:700}
.cur{font-size:10px;font-weight:800;letter-spacing:.05em;padding:1px 5px;border-radius:5px;border:1px solid currentColor;opacity:.8;flex:none}
.cdot{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
/* résultat */
.hero{padding:18px 18px 16px;margin-top:12px}
.big{font-family:var(--display);font-weight:500;font-size:50px;line-height:1;margin:8px 0 6px;letter-spacing:-.02em}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.verdict.pos{background:var(--pos-soft)} .verdict.neg{background:var(--neg-soft)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-weight:700;font-size:14px;white-space:nowrap}
.zones{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.zone{font-size:12px;padding:5px 9px;border-radius:9px;background:var(--surface-2)}
.zone b{font-weight:700}
section.block{margin-top:24px}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 8px}
.bh h2{font-family:var(--display);font-size:20px;margin:0;font-weight:500;letter-spacing:-.01em}
.bh .t{font-size:12px;color:var(--muted);text-align:right}
.list{padding:2px 0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.list>.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .l{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{text-align:right;white-space:nowrap}
.row .amt b{font-weight:700;display:block}
.row .amt small{font-size:12px;color:var(--muted)}
.st{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line);color:var(--muted);background:none;padding:0}
.st svg{width:15px;height:15px}
.st.done{border:0;background:var(--pos-soft);color:var(--pos)}
.st.pop{animation:stpop .45s cubic-bezier(.3,1.6,.5,1);background:var(--pos);color:#fff}
.st.pop svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:stdraw .35s .12s forwards}
@keyframes stpop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes stdraw{to{stroke-dashoffset:0}}
.flashok{animation:flashok 1.2s ease-out}
@keyframes flashok{0%,35%{background:var(--pos-soft)}100%{background:transparent}}
@media (prefers-reduced-motion: reduce){.st.pop,.st.pop svg path,.flashok{animation:none!important;stroke-dashoffset:0}}
.st.late{border:1.5px solid var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:1px}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:7px;border-radius:7px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pos);border-radius:7px}
.bar i.over{background:var(--neg)} .bar i.near{background:var(--warn)}
.empty{padding:22px 18px}
.empty h3{font-family:var(--display);font-weight:500;font-size:24px;margin:0 0 6px}
.empty p{margin:0 0 14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 35%,var(--line))}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:11px}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.person{padding:10px}
.person .n{font-size:12px;color:var(--muted);font-weight:700}
.person b{display:block;font-size:15px}
.person small{font-size:11px;color:var(--muted)}
/* réglages */
.create{display:flex;align-items:center;gap:14px;padding:18px;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.create .ic{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--on-accent) 18%,transparent);display:grid;place-items:center;flex:none}
.create .ic svg{width:24px;height:24px}
.create b{font-family:var(--display);font-weight:500;font-size:21px;display:block}
.create small{opacity:.85;font-size:13px}
.navcard{display:flex;align-items:center;gap:14px;padding:16px}
.navcard .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.navcard .ic svg{width:21px;height:21px}
.navcard .main{flex:1;min-width:0}
.navcard b{display:block;font-weight:800}
.navcard small{color:var(--muted);font-size:12px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.navcard>svg{width:18px;height:18px;color:var(--muted)}
.sgrid{display:grid;gap:10px}
.pad{padding:14px}
.note{font-size:12px;color:var(--muted);margin:8px 2px 0}
.banner{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13px;background:var(--warn-soft)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:64px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);height:100%;justify-content:center}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--accent)}
.fab{width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto;transform:translateY(-14px);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.fab svg{width:26px;height:26px;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.fab.open svg{transform:rotate(135deg)}
.fab.open{background:var(--ink);color:var(--surface)}
#fan{position:fixed;inset:0;z-index:29;pointer-events:none}
#fan .fanbk{position:absolute;inset:0;background:rgba(8,10,28,.55);opacity:0;transition:opacity .25s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#fan.on{pointer-events:auto}#fan.on .fanbk{opacity:1}
#fan .fanb{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));width:92px;margin-left:-46px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;color:#fff;opacity:0;transform:translate(0,70px) scale(.3);transition:transform .38s cubic-bezier(.3,1.5,.5,1) var(--d),opacity .2s var(--d)}
#fan .fanb .ic{width:58px;height:58px;border-radius:20px;background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.3)}
#fan .fanb .ic svg{width:26px;height:26px}
#fan .fanb b{font-size:13px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.5)}
#fan.on .fanb{opacity:1}
#fan.on .f0{transform:translate(-104px,-6px)}#fan.on .f1{transform:translate(0,-62px)}#fan.on .f2{transform:translate(104px,-6px)}
#fan .f1 .ic{color:var(--pos)}#fan .f2 .ic{color:var(--title)}
@media (prefers-reduced-motion: reduce){#fan .fanb,.fab svg{transition:none}}
/* feuille */
.scrim{position:fixed;inset:0;background:rgba(30,18,10,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:540px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;max-height:94%;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh h3{font-family:var(--display);font-weight:500;font-size:25px;margin:0;flex:1;line-height:1.15}
.sh h3 small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.steps{display:flex;gap:5px;margin:-4px 0 14px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.q{font-family:var(--display);font-size:20px;font-weight:500;margin:4px 0 12px}
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.tile.on{border-color:var(--accent);background:var(--accent-soft)}
.tile .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-weight:800;font-size:16px}
.tile span{font-size:13px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:700;min-height:52px;display:flex;flex-direction:column;justify-content:center}
.cbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.cbtn small{font-weight:600;font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.chipbtn.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface))}
.accchip.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.accchip .ck{width:16px;height:16px;border-radius:50%;background:#fff;color:var(--c);display:inline-grid;place-items:center;font-size:11px;font-weight:900;line-height:1}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(60,35,15,.12)}
.form{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:700;color:var(--muted)}
.fld small{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);padding:10px 12px;font-size:16px;min-width:0}
input::placeholder{color:color-mix(in srgb,var(--muted) 55%,transparent)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
textarea{min-height:110px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.amount-in{font-family:var(--display);font-size:36px;min-height:62px;padding:6px 14px}
.live{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}
.err{color:var(--neg);font-size:13px;font-weight:700}
.actions{display:grid;gap:8px;margin-top:8px}
.recap{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.recap .rl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.recap .rl:first-child{border-top:0}
.recap .rl span{color:var(--muted);font-size:13px;flex:none}
.recap .rl b{font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
.recap .tot{padding:16px 14px;background:var(--surface-2);text-align:center}
.recap .tot b{font-family:var(--display);font-size:36px;font-weight:500;display:block}
.irow{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.irow.off{opacity:.55}
.irow .hd{display:flex;align-items:center;gap:10px}
.irow .hd .main{flex:1;min-width:0}
.irow .hd b{display:block}
.irow .hd small{color:var(--muted);font-size:12px}
.vrow{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow b{display:block}

<script>
"use strict";
const VERSION = "4.6";
const LOCAL_ONLY=false, LOCAL_KEY="mcl.data";
let PERSONS = [["famille","Famille"],["william","William"],["ingrid","Ingrid"],["leonard","Léonard"],["autre","Autre"]];
const MEMBER_COLORS=["#C2603A","#C98F33","#6F8B4E","#4F6D8A","#8A4F6D","#3F8A86","#B85C8A","#5E7F3A"];
function members(){ return (typeof cfg!=="undefined"&&cfg&&Array.isArray(cfg.members))?cfg.members:[{id:"william",name:"William"},{id:"ingrid",name:"Ingrid"},{id:"leonard",name:"Léonard"}]; }
function syncPersons(){ const m=members(); PERSONS=[["famille","Famille"],...m.map(x=>[x.id,x.name]),["autre","Autre"]]; TRIO=m.map(x=>x.id); }
function personColor(id){ if(id==="famille") return "#2E3A7A"; if(id==="autre") return "#9A8466"; const i=members().findIndex(x=>x.id===id); return MEMBER_COLORS[(i<0?0:i)%MEMBER_COLORS.length]; }

function occurrences(p,ym){
  if(!isISO(p.date)) return [];

  if(ym<p.date.slice(0,7)) return [];

    const step=(p.freq==="weekly"?7:14)*864e5; let t=Date.UTC(sy,sm-1,sd);
    const a=Date.UTC(y,m-1,1), b=Date.UTC(y,m-1,dim);

function balanceAt(acc,until){

  return b;
}
function endBalance(acc,ym){
  const k="bal:"+acc+":"+ym; if(memo.has(k)) return memo.get(k);

  else if(ym===CUR_YM){ const c=calcMonth(ym); v=balanceAt(acc,lastDay(ym))+((c.F.net[acc]||0)-(c.A.net[acc]||0)); }

}

const b64=buf=>{ const u=new Uint8Array(buf); let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };

}
async function encryptData(key,obj){ const iv=rnd(12); const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))); return {iv:b64(iv),data:b64(ct)}; }

async function doSave(){

  try{ sb=window.supabase.createClient(conf.url,conf.anon,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"mc-auth",detectSessionInUrl:false}}); }
  catch(e){ gate("setup","URL ou clé invalide."); return; }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ gate("login"); return; }
  await afterLogin(session);
}
async function afterLogin(session){
  S.uid=session.user.id; S.email=session.user.email||"";
  try{ const {data}=await sb.auth.mfa.getAuthenticatorAssuranceLevel(); if(data&&data.nextLevel==="aal2"&&data.currentLevel!=="aal2"){ gate("mfa"); return; } }catch(e){}
  await openVault();
}
async function openVault(){
  gate("loading");
  let row=null, offline=false;
  try{ row=await Promise.race([fetchVault(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("network timeout")),12000))]); }
  catch(e){ if(isNetErr(e)||/timeout/.test(String(e.message))){ offline=true; } else { gate("error",FR_ERR(e.message)); return; } }
  const cache=getCache();
  if(offline){ if(!cache){ gate("error","Pas de connexion et aucune copie sur ce téléphone. Réessaie quand tu es connecté."); return; } row={salt:cache.salt,iv:cache.iv,data:cache.data,kdf_iter:cache.iter,version:cache.version,_pending:cache.pending}; }
  else if(cache&&cache.pending&&row&&cache.version===row.version&&cache.salt===row.salt){ row={salt:cache.salt,iv:cache.iv,data:cache.data,kdf_iter:cache.iter,version:cache.version,_pending:true}; }
  if(!row){ G.f={remember:true}; gate("newpass"); return; }
  S.salt=row.salt; S.iter=row.kdf_iter||KDF_ITER; S.version=row.version; G.row=row;
  const saved=await idbGet("k:"+S.uid);
  if(saved&&saved.salt===row.salt){
    try{ const obj=await decryptData(saved.key,row.iv,row.data); S.key=saved.key; S.remember=true; await enterApp(obj,row,offline,true); return; }catch(e){ await idbDel("k:"+S.uid); }
  }
  G.f={remember:true}; gate("pass");
}
async function enterApp(obj,row,offline,fromSaved){
  ui.anim=true; applyData(obj); const mig=migrateData(); if(mig){ memo.clear(); render(); } hideGate(); putCache({iv:row.iv,data:row.data},!!row._pending);
  setSync(offline?"offline":"cloud");
  if(row._pending||mig) scheduleSave();
  if(fromSaved&&cfg.pin) lockNow();
  if(fromSaved&&cfg.pin&&localStorage.getItem(BIO_KEY)) setTimeout(()=>bioUnlock(true),300);
}
function loadSupabaseLib(){

  return new Promise(res=>{ const next=i=>{ if(window.supabase&&window.supabase.createClient) return res(true); if(i>=srcs.length) return res(false); const s=document.createElement("script"); s.src=srcs[i]; s.onload=()=>next(window.supabase&&window.supabase.createClient?srcs.length:i+1); s.onerror=()=>next(i+1); document.head.appendChild(s); }; next(0); });

async function gateSubmit(kind){
  if(G.busy) return; G.err="";
  try{
    if(kind==="login"){
      const email=(G.f.email||"").trim(), password=G.f.password||"";
      if(!email||!password){ gate("login","Indique ton e-mail et ton mot de passe."); return; }
      G.busy=true; renderGate();
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error){ gate("login",FR_ERR(error.message)); return; }
      G.f.password=""; await afterLogin(data.session);
    } else if(kind==="mfa"){
      const code=(G.f.code||"").replace(/\D/g,""); if(code.length!==6){ gate("mfa","Le code contient 6 chiffres."); return; }
      G.busy=true; renderGate();
      const {data:fl,error:e1}=await sb.auth.mfa.listFactors(); if(e1) throw e1;
      const f=(fl.totp||[]).find(x=>x.status==="verified"); if(!f){ await openVault(); return; }
      const {error}=await sb.auth.mfa.challengeAndVerify({factorId:f.id,code});
      if(error){ G.f.code=""; gate("mfa",FR_ERR(error.message)); return; }
      G.f.code=""; await openVault();
    } else if(kind==="newpass"){
      const p1=G.f.p1||"", p2=G.f.p2||"";
      if(p1.length<12){ gate("newpass","La phrase doit contenir au moins 12 caractères."); return; }
      if(p1!==p2){ gate("newpass","Les deux phrases ne sont pas identiques."); return; }
      G.busy=true; renderGate();
      const salt=b64(rnd(16)); const key=await deriveKey(p1,salt,KDF_ITER);
      if(G.importData){ cfg=normCfg(G.importData.cfg); TX=G.importData.TX||{}; }
      const enc=await encryptData(key,{app:"Mes Comptes",v:VERSION,cfg,TX});
      const existing=G.replace;
      let res;
      if(existing){ res=await sb.from("mescomptes_vault").update({salt,iv:enc.iv,data:enc.data,kdf_iter:KDF_ITER,version:(S.version||0)+1}).eq("user_id",S.uid).select("version"); }
      else res=await sb.from("mescomptes_vault").insert({user_id:S.uid,salt,iv:enc.iv,data:enc.data,kdf_iter:KDF_ITER,version:1}).select("version");
      if(res.error){ gate("newpass",FR_ERR(res.error.message)); return; }
      S.key=key; S.salt=salt; S.iter=KDF_ITER; S.version=res.data&&res.data[0]?res.data[0].version:1;
      if(G.f.remember!==false) await idbSet("k:"+S.uid,{key,salt}); else await idbDel("k:"+S.uid);
      G.f={}; G.importData=null; G.replace=false;
      await enterApp({cfg,TX},{iv:enc.iv,data:enc.data},false,false); toast("Coffre chiffré créé");
    } else if(kind==="pass"){
      const p1=G.f.p1||""; if(!p1){ gate("pass","Entre ta phrase secrète."); return; }
      G.busy=true; renderGate();
      const key=await deriveKey(p1,S.salt,S.iter); let obj;
      try{ obj=await decryptData(key,G.row.iv,G.row.data); }catch(e){ G.f.p1=""; gate("pass","Phrase secrète incorrecte."); return; }
      S.key=key; if(G.f.remember!==false) await idbSet("k:"+S.uid,{key,salt:S.salt}); else await idbDel("k:"+S.uid);
      G.f={}; await enterApp(obj,G.row,mode==="offline",false);
    }
  }catch(e){ gate(G.view,FR_ERR(e&&e.message)); }
}

function sheetPass(s){
  return sheetHead("Changer la phrase secrète")+`<div class="form">${fld("Phrase actuelle",inp("old","password",'autocomplete="current-password"'))}${fld("Nouvelle phrase",inp("p1","password",'autocomplete="new-password"'),"12 caractères minimum.")}${fld("Confirme la nouvelle phrase",inp("p2","password",'autocomplete="new-password"'))}${s.err?`<div class="err" role="alert">${esc(s.err)}</div>`:""}<button class="btn primary block" data-act="passSave">${s.busy?"Chiffrement…":"Changer la phrase"}</button></div><p class="note">Tes autres appareils te demanderont la nouvelle phrase.</p>`;

async function passSave(s){
  const d=s.d; if(s.busy) return;
  if((d.p1||"").length<12){ s.err="La nouvelle phrase doit contenir au moins 12 caractères."; return renderSheet(); }
  if(d.p1!==d.p2){ s.err="Les deux nouvelles phrases ne sont pas identiques."; return renderSheet(); }
  s.busy=true; s.err=""; renderSheet();
  try{
    const oldKey=await deriveKey(d.old||"",S.salt,S.iter); const row=await fetchVault();
    try{ await decryptData(oldKey,row.iv,row.data); }catch(e){ s.busy=false; s.err="Phrase actuelle incorrecte."; return renderSheet(); }
    const salt=b64(rnd(16)), key=await deriveKey(d.p1,salt,KDF_ITER), enc=await encryptData(key,{app:"Mes Comptes",v:VERSION,cfg,TX});
    const {data,error}=await sb.from("mescomptes_vault").update({salt,iv:enc.iv,data:enc.data,kdf_iter:KDF_ITER,version:row.version+1}).eq("user_id",S.uid).eq("version",row.version).select("version");
    if(error||!data||!data.length) throw error||new Error("Données modifiées entre-temps, réessaie.");
    S.key=key; S.salt=salt; S.iter=KDF_ITER; S.version=data[0].version; putCache(enc,false);
    if(await idbGet("k:"+S.uid)) await idbSet("k:"+S.uid,{key,salt});
    closeSheet(); toast("Phrase secrète changée");
  }catch(e){ s.busy=false; s.err=FR_ERR(e&&e.message); renderSheet(); }
}

    const inc=Y.real.reduce((a,r)=>a+r.inc,0), res=Y.real.reduce((a,r)=>a+r.res,0), avg=inc>0?res/inc:0, m=Math.max(.3,...vs.map(Math.abs)), z=60, sc=v=>Math.max(-1,Math.min(1,v/m))*48;
    return ySec("Taux d'épargne par mois",`moyenne ${Math.round(avg*100)} %`,`<div class="card chart"><svg viewBox="0 0 320 124" width="100%" role="img" aria-label="Taux d'épargne par mois"><line x1="6" y1="${z}" x2="316" y2="${z}" stroke="var(--line)"/><line x1="6" y1="${(z-sc(avg)).toFixed(1)}" x2="316" y2="${(z-sc(avg)).toFixed(1)}" stroke="var(--accent)" stroke-dasharray="4 4"/>
    ${t.map((v,i)=>{ if(v==null) return ""; const h=Math.abs(sc(v)), x=Y.px(i)-7; return `<rect class="ygrow" x="${x.toFixed(1)}" y="${(v>=0?z-h:z).toFixed(1)}" width="14" height="${Math.max(1,h).toFixed(1)}" rx="2" fill="${v>=0?"var(--pos)":"var(--neg)"}"/><text x="${Y.px(i)}" y="${(v>=0?z-h-3:z+h+9).toFixed(1)}" font-size="8" text-anchor="middle" fill="var(--muted)">${Math.round(v*100)}</text>`; }).join("")}
    ${yAxis(Y,121)}</svg><div class="legend"><span><i style="background:var(--accent)"></i>moyenne de l'année (en %)</span></div></div>`); }},
  where:{name:"Où part l'argent",desc:"carte des catégories",def:true,render(Y){
    const cats=catTotals(Y.real), ks=Object.keys(cats).filter(k=>cats[k]>0).sort((a,b)=>cats[b]-cats[a]), ctot=ks.reduce((x,k)=>x+cats[k],0)||1;
    if(!ks.length) return ySec("Où part l'argent","",`<div class="card pad">${YNONE}</div>`);
    const top=ks.slice(0,5), rest=ks.slice(5).reduce((x,k)=>x+cats[k],0), blocks=top.map((k,i)=>({k,v:cats[k],c:ACC_FALLBACK[i]})); if(rest>0) blocks.push({k:"Autres",v:rest,c:"#9A8466"});
    return ySec("Où part l'argent",`réel ${Y.past?"sur l'année":"à ce jour"}`,`<div class="card pad"><div class="tmap">${blocks.map((b,i)=>`<button class="tm ${i===0?"first":""}" ${b.k!=="Autres"?`data-act="catYear" data-cat="${esc(b.k)}"`:""} style="background:${b.c}"><b>${esc(b.k)}</b><span>${fmt(b.v,"EUR",0)} · ${Math.round(b.v/ctot*100)} %</span></button>`).join("")}</div><p class="note" style="margin:8px 0 0">Touche une catégorie pour voir son évolution mois par mois.</p></div>`); }},
  updown:{name:"Ce qui monte, ce qui baisse",desc:"les 5 catégories qui changent le plus vs l'an dernier",def:true,render(Y){
    const n=Y.real.length; if(!n) return ySec("Ce qui monte, ce qui baisse","",`<div class="card pad">${YNONE}</div>`);
    const prev=yearData(Y.y-1).slice(0,n); if(!prev.some(r=>r.inc||r.exp)) return ySec("Ce qui monte, ce qui baisse","vs l'an dernier",`<div class="card pad"><p class="note" style="margin:0">Pas de données pour ${Y.y-1} : la comparaison apparaîtra l'an prochain.</p></div>`);
    const a=catTotals(Y.real), b=catTotals(prev), ks=[...new Set(Object.keys(a).concat(Object.keys(b)))].map(k=>({k,d:(a[k]||0)-(b[k]||0),n:a[k]||0,p:b[k]||0})).filter(x=>Math.abs(x.d)>0.5).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,5);
    if(!ks.length) return ySec("Ce qui monte, ce qui baisse","vs l'an dernier",`<div class="card pad"><p class="note" style="margin:0">Rien n'a vraiment bougé.</p></div>`);
    return ySec("Ce qui monte, ce qui baisse",`janvier à ${monthName(Y.rows[n-1].ym)}, vs ${Y.y-1}`,`<div class="card list">${ks.map(x=>`<button class="row" data-act="catYear" data-cat="${esc(x.k)}"><span class="trend ${x.d>0?"up":"down"}">${x.d>0?"↑":"↓"}</span><div class="main"><div class="l">${esc(x.k)}</div><div class="m">${fmt(x.p,"EUR")} → ${fmt(x.n,"EUR")}</div></div><div class="amt"><b class="${x.d>0?"neg":"pos"}">${sfmt(x.d,"EUR")}</b>${x.p>0?`<small>${x.d>0?"+":""}${Math.round(x.d/x.p*100)} %</small>`:""}</div></button>`).join("")}</div>`); }},
  natures:{name:"Fixes, variables et spéciales",desc:"la part de chaque type de dépense",def:true,render(Y){
    const f=Y.real.reduce((a,r)=>a+r.c.A.fixed,0), v=Y.real.reduce((a,r)=>a+r.c.A.variable+r.c.A.fees,0), s=Y.real.reduce((a,r)=>a+r.c.A.special,0), t=f+v+s;
    if(!(t>0)) return ySec("Fixes, variables et spéciales","",`<div class="card pad">${YNONE}</div>`);
    const parts=[["Fixes",f,"#2E3A7A"],["Variables",v,"#C98F33"],["Spéciales",s,"#A8661A"]].filter(p=>p[1]>0); let off=0; const C=2*Math.PI*45;
    return ySec("Fixes, variables et spéciales",`réel ${Y.past?"sur l'année":"à ce jour"}`,`<div class="card pad"><div style="display:flex;gap:14px;align-items:center"><svg width="124" height="124" viewBox="0 0 120 120" role="img" aria-label="Part des dépenses fixes, variables et spéciales"><g transform="rotate(-90 60 60)" fill="none" stroke-width="18">${parts.map(p=>{ const l=p[1]/t*C, el=`<circle cx="60" cy="60" r="45" stroke="${p[2]}" stroke-dasharray="${l.toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`; off+=l; return el; }).join("")}</g><text x="60" y="64" text-anchor="middle" font-family="Spectral,serif" font-size="13" fill="var(--title)">${fmt(t,"EUR",0)}</text></svg>
    <div style="flex:1;font-size:12.5px;line-height:1.9">${parts.map(p=>`<div><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${p[2]};margin-right:6px;vertical-align:-1px"></i>${p[0]} <b>${Math.round(p[1]/t*100)} %</b><br><small class="mut">${fmt(p[1],"EUR")}</small></div>`).join("")}</div></div></div>`); }},
  balances:{name:"Solde des comptes",desc:"une courbe par compte sur 12 mois",def:true,render(Y){
    const accs=cfg.accounts, rate=+cfg.planRate||1, ser=accs.map(a=>({a,v:Y.rows.map(r=>{ const b=endBalance(a.id,r.ym); return isFinite(b)?conv(b,a.cur,rate):null; })}));
    const all=ser.flatMap(s=>s.v).filter(v=>v!=null); if(!all.length) return ySec("Solde des comptes","",`<div class="card pad">${YNONE}</div>`);
    const mn=Math.min(0,...all), mx=Math.max(1,...all), py=v=>100-(v-mn)/(mx-mn||1)*90;
    return ySec("Solde des comptes","en fin de mois, CHF converti",`<div class="card chart"><svg viewBox="0 0 320 124" width="100%" role="img" aria-label="Solde de chaque compte en fin de mois"><line x1="10" y1="${py(0).toFixed(1)}" x2="316" y2="${py(0).toFixed(1)}" stroke="var(--line)"/>
    ${ser.map(s=>{ const p=s.v.map((v,i)=>v==null?null:`${Y.px(i).toFixed(1)},${py(v).toFixed(1)}`).filter(Boolean); return p.length>1?`<polyline class="ydraw" points="${p.join(" ")}" fill="none" stroke="${s.a.color}" stroke-width="2.5" stroke-linejoin="round"/>`:""; }).join("")}
    ${Y.lastReal>=0&&Y.lastReal<11?`<line x1="${Y.px(Y.lastReal)}" y1="6" x2="${Y.px(Y.lastReal)}" y2="104" stroke="var(--title)" stroke-dasharray="2 3" opacity=".5"/>`:""}
    ${yAxis(Y,118)}</svg><div class="balleg">${accs.map(a=>{ const b=endBalance(a.id,Y.rows[11].ym); return `<div><span><i style="background:${a.color}"></i>${esc(a.name)}</span><b class="${isFinite(b)&&b<0?"neg":""}">${isFinite(b)?fmt(b,a.cur):"—"}</b></div>`; }).join("")}<small class="mut">fin ${monthName(Y.rows[11].ym)}${Y.lastReal<11?" (prévu)":""}</small></div></div>`); }},
  people:{name:"Personnes",desc:"anneau et fiches par personne",def:true,render(Y){
    const ppl={}, pcat={}; Y.real.forEach(r=>{ for(const k in r.c.A.people) if(k!=="none") ppl[k]=(ppl[k]||0)+r.c.A.people[k]; r.c.tx.filter(t=>t.kind==="expense").forEach(t=>{ personShares(t).forEach(([pid,f])=>{ const m=pcat[pid]=pcat[pid]||{}; m[t.cat]=(m[t.cat]||0)+conv(t.amount,curOf(t.acc),r.c.rA)*f; }); }); });
    const PC=new Proxy({},{get:(o,k)=>personColor(k)});
    const pk=STAT_PERSONS().map(([id,n])=>({id,n,v:ppl[id]||0})).filter(x=>x.v>0), ptot=pk.reduce((x,p)=>x+p.v,0);
    if(!pk.length) return ySec("Personnes","dépenses attribuées",`<div class="card pad"><p class="note" style="margin:0">Aucune dépense attribuée à une personne cette année.</p></div>`);
    const nM=Math.max(1,Y.real.length); let off=0; const C=2*Math.PI*45;
    return ySec("Personnes","dépenses attribuées",`<div class="card pad"><div style="display:flex;gap:14px;align-items:center">
      <svg width="124" height="124" viewBox="0 0 120 120" role="img" aria-label="Répartition par personne"><g transform="rotate(-90 60 60)" fill="none" stroke-width="18">${pk.map(p=>{ const l=p.v/ptot*C; const el=`<circle cx="60" cy="60" r="45" stroke="${PC[p.id]}" stroke-dasharray="${l.toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`; off+=l; return el; }).join("")}</g><text x="60" y="58" text-anchor="middle" font-family="Spectral,serif" font-size="14" fill="var(--title)">${fmt(ptot,"EUR",0).replace(",00","")}</text><text x="60" y="72" text-anchor="middle" font-size="8" fill="var(--muted)">attribués</text></svg>
      <div style="flex:1;font-size:12.5px;line-height:1.8">${pk.map(p=>`<div><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${PC[p.id]};margin-right:6px;vertical-align:-1px"></i>${p.n} <b>${fmt(p.v,"EUR")}</b></div>`).join("")}</div></div>
      <div class="pfiches">${pk.map(p=>{ const tc=Object.entries(pcat[p.id]||{}).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]); return `<button class="pf" data-act="personYear" data-id="${p.id}" style="border-color:${PC[p.id]}"><span>${p.n}</span><b>${fmt(p.v,"EUR")}</b><small>${tc.length?"surtout : "+esc(tc.join(", ")):""}</small><small>≈ ${fmt(p.v/nM,"EUR")} / mois</small></button>`; }).join("")}</div></div>`); }},
  gifts:{name:"Anniversaires et Noël",desc:"budget et dépensé par personne",def:true,render(Y){
    const L=[]; cfg.categories.filter(isGiftCat).forEach(c=>c.subs.forEach(x=>{ const b=+x.budget||0, s=specSpentRange(c.name,x.id,String(Y.y),1,12); if(b>0||s>0||x.gift) L.push({lab:(c.special==="christmas"?"Noël ":"Anniv. ")+x.name,b,s,g:x.gift||""}); }));
    if(!L.length) return ySec("Anniversaires et Noël","",`<div class="card pad"><p class="note" style="margin:0">Aucun budget de cadeau pour l'instant.</p></div>`);
    return ySec("Anniversaires et Noël","budget de l'année",`<div class="card list">${L.map(o=>{ const p=o.b>0?o.s/o.b:(o.s>0?1.01:0), r=o.b-o.s; return `<div class="row"><div class="main"><div class="l">${esc(o.lab)}</div>${o.g?`<div class="m">🎁 ${esc(o.g)}</div>`:""}<div class="bar"><i class="${p>1?"over":p>.85?"near":""}" style="width:${Math.min(100,p*100).toFixed(1)}%"></i></div></div><div class="amt"><b>${fmt(o.s,"EUR")}</b><small class="${r<-0.004?"neg":""}">${o.b>0?(r<-0.004?"dépassé de "+fmt(-r,"EUR"):"sur "+fmt(o.b,"EUR")):"sans budget"}</small></div></div>`; }).join("")}</div>`); }},
  calendar:{name:"Calendrier des dépenses",desc:"un carré par jour, plus foncé quand tu dépenses plus",def:true,render(Y){
    const day={}; Y.real.forEach(r=>r.c.tx.forEach(t=>{ if(t.kind==="expense") day[t.date]=(day[t.date]||0)+conv(t.amount,curOf(t.acc),r.c.rA); }));
    const vals=Object.values(day).sort((a,b)=>a-b); if(!vals.length) return ySec("Calendrier des dépenses","",`<div class="card pad">${YNONE}</div>`);
    const q=k=>vals[Math.min(vals.length-1,Math.floor(vals.length*k))], t1=q(.5), t2=q(.8), t3=q(.95);
    const col=v=>!v?"var(--surface-2)":v<=t1?"#E8D2AE":v<=t2?"#D2A65E":v<=t3?"#A8661A":"#6E3F0C";
    let cells=""; Y.rows.forEach((r,i)=>{ const [yy,mm]=r.ym.split("-").map(Number), dim=daysIn(yy,mm); cells+=`<text x="0" y="${i*11+9}" font-size="8" fill="var(--muted)">${Y.mlab(r.ym)}</text>`; for(let d=1;d<=dim;d++){ const iso=`${r.ym}-${pad(d)}`, v=day[iso]; cells+=`<rect x="${10+(d-1)*9.8}" y="${i*11+1}" width="8.4" height="9" rx="1.5" fill="${iso>TODAY?"transparent":col(v)}" ${iso>TODAY?'stroke="var(--line)" stroke-width=".6"':""}><title>${shortDate(iso)} : ${fmt(v||0,"EUR")}</title></rect>`; } });
    const top=Object.entries(day).sort((a,b)=>b[1]-a[1])[0];
    return ySec("Calendrier des dépenses","chaque jour de l'année",`<div class="card pad"><svg viewBox="0 0 316 134" width="100%" role="img" aria-label="Calendrier des dépenses de l'année">${cells}</svg><div class="legend" style="padding:6px 0 0"><span>moins</span>${["var(--surface-2)","#E8D2AE","#D2A65E","#A8661A","#6E3F0C"].map(c=>`<span><i style="background:${c};margin:0"></i></span>`).join("")}<span>plus</span></div>${top?`<p class="note" style="margin:6px 0 0">Jour le plus dépensier : ${longDate(top[0])}, ${fmt(top[1],"EUR")}.</p>`:""}</div>`); }},
  subs:{name:"Abonnements et fixes",desc:"ce que coûtent les dépenses fixes sur l'année",def:true,render(Y){
    const L=cfg.plans.filter(p=>p.kind==="expense"&&p.nature==="fixe").map(p=>{ let n=0,tot=0; Y.rows.forEach(r=>{ const k=occurrences(p,r.ym).filter(o=>!(cfg.skips||{})[p.id+"@"+r.ym]).length; n+=k; tot+=k*conv(p.amount,curOf(p.acc),+cfg.planRate||1); }); return {p,n,tot}; }).filter(x=>x.n>0).sort((a,b)=>b.tot-a.tot);
    if(!L.length) return ySec("Abonnements et fixes","",`<div class="card pad"><p class="note" style="margin:0">Aucune dépense fixe prévue cette année.</p></div>`);
    const T=L.reduce((a,x)=>a+x.tot,0);
    return ySec("Abonnements et fixes",`${fmt(T,"EUR")} sur l'année`,`<div class="card list">${L.slice(0,8).map(x=>`<button class="row" data-act="editPlan" data-id="${x.p.id}"><div class="main"><div class="l">${esc(x.p.label)}</div><div class="m">${x.n} fois · ${fmt(x.p.amount,curOf(x.p.acc))}</div><div class="bar"><i style="width:${(x.tot/L[0].tot*100).toFixed(1)}%"></i></div></div><div class="amt"><b>${fmt(x.tot,"EUR")}</b><small>${Math.round(x.tot/T*100)} %</small></div></button>`).join("")}</div>${L.length>8?`<p class="note">+ ${L.length-8} autres.</p>`:""}`); }},
  chf:{name:"Transferts CHF → €",desc:"taux obtenu chaque mois",def:true,render(Y){
    const {rows,px}=Y, xs=rows.map(r=>{ let sf=0,st=0; effTx(r.ym).forEach(t=>{ if(t.kind==="transfer"&&curOf(t.from)==="CHF"&&curOf(t.to)==="EUR"){ sf+=t.amtFrom; st+=t.amtTo; } }); return {r,sf,st,rate:sf>0?st/sf:null}; });
    const done=xs.filter(x=>x.rate), sent=done.reduce((x,d)=>x+d.sf,0), recv=done.reduce((x,d)=>x+d.st,0);
    if(!done.length) return ySec("Transferts CHF → €","",`<div class="card pad"><p class="note" style="margin:0">Aucun transfert CHF → € cette année.</p></div>`);
    const rates=done.map(d=>d.rate).concat([cfg.planRate]), rmin=Math.min(...rates)-.005, rmax=Math.max(...rates)+.005, ry=v=>70-(v-rmin)/(rmax-rmin)*58;
    const best=done.reduce((a,b)=>b.rate>a.rate?b:a), diff=recv-sent*cfg.planRate;
    return ySec("Transferts CHF → €","taux obtenu",`<div class="card pad"><svg viewBox="0 0 320 84" width="100%" role="img" aria-label="Évolution du taux CHF euro"><line x1="10" y1="${ry(cfg.planRate).toFixed(1)}" x2="315" y2="${ry(cfg.planRate).toFixed(1)}" stroke="var(--accent)" stroke-dasharray="4 4"/><text x="315" y="${(ry(cfg.planRate)-4).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--accent)" font-weight="700">prévu ${String(cfg.planRate).replace(".",",")}</text>
      ${done.length>1?`<polyline class="ydraw" points="${done.map(d=>`${px(d.r.i).toFixed(1)},${ry(d.rate).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--title)" stroke-width="2.5" stroke-linejoin="round"/>`:""}
      ${done.map(d=>`<circle cx="${px(d.r.i).toFixed(1)}" cy="${ry(d.rate).toFixed(1)}" r="3.5" fill="var(--title)"/>`).join("")}
      <g font-size="9" fill="var(--muted)" text-anchor="middle">${rows.map((r,i)=>`<text x="${px(i)}" y="82">${Y.mlab(r.ym)}</text>`).join("")}</g></svg>
      <div class="sumgrid" style="margin:8px 0 0"><div><span>Envoyés</span><b>${fmt(sent,"CHF")}</b></div><div><span>Taux moyen</span><b>${(recv/sent).toFixed(4).replace(".",",")}</b></div><div><span>Écart vs taux prévu</span><b class="${cls(diff)}">${sfmt(diff,"EUR")}</b></div><div><span>Meilleur mois</span><b style="text-transform:capitalize">${monthName(best.r.ym)}</b></div></div></div>`); }},
  records:{name:"Les records",desc:"meilleur mois, plus grosse dépense…",def:true,render(Y){
    const past=Y.real.filter(r=>r.inc||r.exp); if(!past.length) return ySec("Les records","",`<div class="card pad">${YNONE}</div>`);
    const bestM=past.reduce((a,b)=>b.res>a.res?b:a), worstM=past.reduce((a,b)=>b.res<a.res?b:a);
    let big=null; Y.real.forEach(r=>r.c.tx.filter(t=>t.kind==="expense").forEach(t=>{ const v=conv(t.amount,curOf(t.acc),r.c.rA); if(!big||v>big.v) big={v,t}; }));
    const bud={}; Y.real.forEach(r=>r.c.varRows.forEach(v=>{ const o=bud[v.cat]=bud[v.cat]||{p:0,a:0}; o.p+=conv(v.planned,curOf(v.acc),r.c.rP); o.a+=conv(v.actual,curOf(v.acc),r.c.rA); }));
    const bk=Object.entries(bud).filter(([,o])=>o.p>0&&o.a>0).sort((a,b)=>a[1].a/a[1].p-b[1].a/b[1].p)[0];
    return ySec("Les records",Y.past?"de l'année":"à ce jour",`<div class="sumgrid recs">
      <div><span>Meilleur mois</span><b style="text-transform:capitalize">${monthName(bestM.ym)} ${sfmt(bestM.res,"EUR",0)}</b></div>
      <div><span>Mois le moins bon</span><b style="text-transform:capitalize">${monthName(worstM.ym)} ${sfmt(worstM.res,"EUR",0)}</b></div>
      ${big?`<div><span>Plus grosse dépense</span><b>${esc(big.t.label)} ${fmt(big.v,"EUR",0)}</b></div>`:""}
      ${bk?`<div><span>Budget le mieux tenu</span><b>${esc(bk[0])} ${Math.round((bk[1].a/bk[1].p-1)*100)} %</b></div>`:""}</div>`); }},
};
const YT={
  saved:{name:"Épargné sur l'année",def:true,val(Y){ const t=Y.rows.reduce((a,r)=>a+r.res,0); return {v:sfmt(t,"EUR"),c:cls(t),s:Y.lastReal===11?"":"avec la projection"}; }},
  rate:{name:"Taux d'épargne",def:true,val(Y){ const inc=Y.real.reduce((a,r)=>a+r.inc,0), res=Y.real.reduce((a,r)=>a+r.res,0); return inc>0?{v:(Math.round(res/inc*1000)/10).toFixed(1).replace(".",",")+" %",c:cls(res),s:"du revenu, à ce jour"}:{v:"—",s:"pas encore de revenu"}; }},
  avg:{name:"Dépense moyenne",def:true,val(Y){ const n=Y.real.length; return n?{v:fmt(Y.real.reduce((a,r)=>a+r.exp,0)/n,"EUR"),s:"par mois"}:{v:"—"}; }},
  fx:{name:"Change CHF",def:true,val(Y){ let sf=0,st=0; Y.rows.forEach(r=>effTx(r.ym).forEach(t=>{ if(t.kind==="transfer"&&curOf(t.from)==="CHF"&&curOf(t.to)==="EUR"){ sf+=t.amtFrom; st+=t.amtTo; } })); if(!sf) return {v:"—",s:"aucun transfert"}; const d=st-sf*cfg.planRate; return {v:sfmt(d,"EUR"),c:cls(d),s:"écart vs taux prévu"}; }},

function applySub(d){

  if(c.special==="birthday"){ const ref=d.mode==="tx"?d.date:(nextBirthday(s.birth)||d.date); const a=ageOn(s.birth,ref); d.label=`Anniversaire ${s.name}${a!=null?` (${a} ans)`:""}`; { const pid=personFromName(s.name); if(pid) d.persons=[pid]; } if(d.mode==="plan"&&isISO(s.birth)){ d.date=s.birth; d.freq="annual"; } if(s.budget&&!d.amount) d.amount=numStr(s.budget); }
  else if(c.special==="christmas"){ d.label=`Noël ${s.name}`; { const pid=personFromName(s.name); if(pid) d.persons=[pid]; } if(s.budget&&!d.amount) d.amount=numStr(s.budget); }

function pendingOcc(d){
  if(d.mode!=="tx"||!isISO(d.date)) return [];
  if(d.kind==="expense"&&d.nature!=="fixe") return [];
  const c=calcMonth(d.date.slice(0,7));
  return c.pointRows.filter(r=>r.o.p.kind===d.kind&&(!r.done||(d.id&&r.ts.some(t=>t.id===d.id)))).sort((a,b)=>(b.o.p.cat===d.cat)-(a.o.p.cat===d.cat));

function validateDraft(d){
  if(!d.kind) return "Choisis dépense, revenu ou virement.";
  if(d.kind==="transfer"){
    if(!d.from||!d.to||d.from===d.to) return "Choisis deux comptes différents.";
    if(!(num(d.amtFrom)>0)) return "Indique le montant envoyé.";
    if(d.mode==="tx"&&curOf(d.from)!==curOf(d.to)&&!(num(d.amtTo)>0)) return "Indique le montant reçu sur "+accName(d.to)+".";
    if(d.fee&&!(num(d.fee)>=0)) return "Les frais doivent être un montant positif.";
  } else {
    if(d.kind==="expense"&&!d.nature) return "Choisis fixe ou variable.";
    if(!d.cat) return "Choisis une catégorie.";
    if(!(num(d.amount)>0)) return "Indique un montant supérieur à 0.";
    if(!accById(d.acc)) return "Choisis un compte.";
  }
  if(!isISO(d.date)) return "Choisis une date.";
  if(d.mode==="plan"&&d.end&&d.end<d.date) return "La date de fin doit être après la première date.";
  return null;
}

function chfTransfers(c){
  const isX=t=>t.kind==="transfer"&&curOf(t.from)==="CHF"&&curOf(t.to)==="EUR";
  const done=c.tx.filter(isX).sort((a,b)=>a.date<b.date?-1:1);
  const planned=c.pointRows.find(r=>r.o.p.kind==="transfer"&&curOf(r.o.p.from)==="CHF"&&curOf(r.o.p.to)==="EUR"&&!r.done)||null;
  return {done,planned};
}
const chfAcc = () => (cfg.accounts.find(a=>a.id==="chf")||cfg.accounts.find(a=>a.cur==="CHF")||{}).id;
const eurMain = () => (accById("cc")||cfg.accounts.find(a=>a.cur==="EUR")||{}).id;
function incomeRows(ym){
  const c=calcMonth(ym), rows=[];
  c.pointRows.filter(r=>r.o.p.kind==="income").forEach(r=>rows.push({key:r.o.key,label:r.o.label,acc:r.o.p.acc,cat:r.o.p.cat,sub:r.o.p.sub||"",person:(r.ts[0]&&personsOf(r.ts[0])[0])||personsOf(r.o.p)[0]||"",planned:r.o.p.amount,tx:r.ts[0]||null,link:r.o.key}));
  ["Salaire","Allocations"].forEach(cat=>{
    if(rows.some(r=>r.cat===cat)) return;
    const tx=(TX[ym]||[]).find(t=>t.kind==="income"&&t.cat===cat&&!t.link)||null;
    rows.push({key:"virt:"+cat,label:cat,acc:tx?tx.acc:chfAcc(),cat,sub:"",person:(tx&&personsOf(tx)[0])||((cfg.incomePerson||{})[cat])||"",planned:null,tx,link:null});
  });

}

function makeSub(c,d){

function moveEstKeys(from,to){ const VE=cfg.varEst||{}; for(const ym in VE){ for(const k of Object.keys(VE[ym])){ if(!k.startsWith("c:")) continue; const [cat,acc]=k.slice(2).split("|"); if(cat!==from) continue; const nk="c:"+to+"|"+acc; VE[ym][nk]=r2((+VE[ym][nk]||0)+(+VE[ym][k]||0)); delete VE[ym][k]; } } }
/* ---------- fusion de catégories ---------- */
const PREMERGE_KEY="mc.premerge";
function catUsage(name,subId){ let n=0; const months=new Set(); for(const ym in TX) TX[ym].forEach(t=>{ if(t.cat===name&&(!subId||t.sub===subId)){ n++; months.add(ym); } }); const pl=cfg.plans.filter(p=>p.cat===name&&(!subId||p.sub===subId)).length; return {n,months:months.size,pl}; }
function mergeTargets(c){ return cfg.categories.filter(x=>x!==c&&!x.special&&catType(x)===catType(c)&&isSpecialCat(x)===isSpecialCat(c)); }
function ensureSubIn(list,name,withSubs){ let x=list.find(y=>norm(y.name)===norm(name)); if(!x){ x={id:uid8(),name}; list.push(x); } if(withSubs&&!Array.isArray(x.subs)) x.subs=[]; return x; }
function takeSnapshot(label){
  const snap={cfg:JSON.parse(JSON.stringify(cfg)),TX:JSON.parse(JSON.stringify(TX))};
  if(S.key) encryptData(S.key,snap).then(enc=>{ try{ localStorage.setItem(PREMERGE_KEY,JSON.stringify({uid:S.uid,date:TODAY,label,iv:enc.iv,data:enc.data})); }catch(e){} }).catch(()=>{});
  return snap;
}
function restoreSnapshot(snap){ cfg=normCfg(snap.cfg); TX=snap.TX||{}; const docs=new Set(["config"]); for(const ym in TX) docs.add("tx-"+ym); changed([...docs]); }
function remapRefs(test,map){ const docs=new Set(["config"]); cfg.plans.forEach(p=>{ if(test(p)) map(p); }); for(const ym in TX) TX[ym].forEach(t=>{ if(test(t)){ map(t); docs.add("tx-"+ym); } }); return docs; }
function mergeCategory(A,B,mode){
  const snap=takeSnapshot(`${A.name} → ${B.name}`), subMap={}, sub2Map={};
  let def={sub:"",sub2:""};
  if(mode==="sub"){ const S0=ensureSubIn(B.subs,A.name,true); def={sub:S0.id,sub2:""};
    A.subs.forEach(a=>{ const y=ensureSubIn(S0.subs,a.name,false); subMap[a.id]={sub:S0.id,sub2:y.id}; (a.subs||[]).forEach(a2=>{ sub2Map[a2.id]={sub:S0.id,sub2:y.id}; }); }); }
  else A.subs.forEach(a=>{ const x=ensureSubIn(B.subs,a.name,true); subMap[a.id]={sub:x.id,sub2:""}; (a.subs||[]).forEach(a2=>{ const y=ensureSubIn(x.subs,a2.name,false); sub2Map[a2.id]={sub:x.id,sub2:y.id}; }); });
  const docs=remapRefs(o=>o.cat===A.name,o=>{ const m=(o.sub2&&sub2Map[o.sub2])||(o.sub&&subMap[o.sub])||def; o.cat=B.name; o.sub=m.sub; o.sub2=m.sub2; });
  moveEstKeys(A.name,B.name);
  cfg.categories=cfg.categories.filter(x=>x!==A);
  changed([...docs]); return snap;
}
function mergeSubcat(C,X,Y){
  const snap=takeSnapshot(`${C.name} › ${X.name} → ${Y.name}`), m2={};
  if(!Array.isArray(Y.subs)) Y.subs=[];
  (X.subs||[]).forEach(a=>{ m2[a.id]=ensureSubIn(Y.subs,a.name,false).id; });
  const docs=remapRefs(o=>o.cat===C.name&&o.sub===X.id,o=>{ o.sub=Y.id; o.sub2=o.sub2&&m2[o.sub2]?m2[o.sub2]:""; });
  C.subs=C.subs.filter(z=>z!==X); changed([...docs]); return snap;
}
function sheetMerge(s){

function sheetMergeSub(s){
  const C=cfg.categories.find(x=>x.id===s.id); if(!C) return sheetHead("Catégorie introuvable");

function renameCategory(c,newName){
  const old=c.name; if(!newName||newName===old) return false;
  if(cfg.categories.some(x=>x!==c&&norm(x.name)===norm(newName))){ toast("Cette catégorie existe déjà"); return false; }
  c.name=newName; cfg.plans.forEach(p=>{ if(p.cat===old) p.cat=newName; }); moveEstKeys(old,newName);

}

function updateLive(){
  const s=topS(); if(!s||!s.d) return; const d=s.d;
  const r=document.querySelector('[data-live="rate"]');
  if(r){ const a=num(d.amtFrom), b=num(d.amtTo), f=num(d.fee)||0;
    if(a>0&&b>0){ const fromC=curOf(d.from), rate=fromC==="CHF"?b/a:a/b, eff=fromC==="CHF"?b/(a+f):(a+f)/b;
      r.innerHTML=`Taux obtenu : <b>1 CHF = ${rate.toFixed(4).replace(".",",")} €</b>${f?` · avec frais ${eff.toFixed(4).replace(".",",")}`:""} <span class="mut">(prévu ${String(cfg.planRate).replace(".",",")})</span>`; }
    else r.textContent=`Saisis le montant envoyé et reçu pour voir le taux obtenu. Taux prévu : ${String(cfg.planRate).replace(".",",")}.`; }
  const p=document.querySelector('[data-live="planrate"]');
  if(p){ const a=num(d.amtFrom); const t=planTransferAmounts({from:d.from,to:d.to,amount:a>0?a:0}); p.innerHTML=`Reçu prévu : <b>${fmt(t.amtTo,curOf(d.to))}</b> au taux de ${String(cfg.planRate).replace(".",",")}${t.fee?` · frais prévus ${fmt(t.fee,curOf(d.from))}`:""}`; }
  const lc=document.querySelector('[data-live="chf"]');
  if(lc){ const a=num(d.sent), b=num(d.recv);
    if(a>0&&b>0){ const r=b/a, theo=a*cfg.planRate, diff=theo-b; lc.innerHTML=`Taux obtenu : <b>1 CHF = ${r.toFixed(4).replace(".",",")} €</b><br><span class="mut">Au taux prévu (${String(cfg.planRate).replace(".",",")}), tu aurais reçu ${fmt(theo,"EUR")} : ${diff>=0?"coût":"gain"} de ${fmt(Math.abs(diff),"EUR")}.</span>`; }
    else lc.textContent="Saisis les deux montants : le taux et la différence (frais compris) s'affichent ici."; }
  document.querySelectorAll('[data-live="irate"]').forEach(el=>{ const k=el.dataset.k, a=num(d["from:"+k]), b=num(d["to:"+k]); el.innerHTML=a>0&&b>0?`Taux obtenu : <b>${(b/a).toFixed(4).replace(".",",")}</b> <span class="mut">(prévu ${String(cfg.planRate).replace(".",",")})</span>`:"Saisis les deux montants pour voir le taux."; });
}

let locked=false, unlocked=false, lockBuf="", lockMsg="", lockTries=0, lockUntil=0, lastActive=Date.now(), hiddenAt=0;
async function hashPin(pin,salt){
  const str=salt+":"+pin;
  try{ if(window.crypto&&crypto.subtle){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); } }catch(e){}
  let h1=0x811c9dc5,h2=0x9e3779b9; for(let k=0;k<2000;k++) for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,16777619)>>>0; h2=Math.imul(h2^c,2246822519)>>>0; }
  return "f"+h1.toString(16)+h2.toString(16);
}
const keypad=act=>`<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="${act}" data-v="${n}" aria-label="${n}">${n}</button>`).join("")}<span></span><button data-act="${act}" data-v="0" aria-label="0">0</button><button class="txt" data-act="${act}" data-v="del" aria-label="Effacer">Effacer</button></div>`;

function lockNow(){ if(!cfg.pin) return; locked=true; lockBuf=""; lockMsg=""; renderLock(); }
function renderLock(shake){
  const el=document.getElementById("lock");

  el.innerHTML=`<div class="logo" aria-hidden="true">mc</div><h2>Mes Comptes</h2><p>Entre ton code</p>${pdots(lockBuf.length,cfg.pin.len,shake)}<div class="pmsg" role="alert">${wait?`Trop d'essais. Réessaie dans ${wait} s.`:esc(lockMsg)}</div>${keypad("lk")}${localStorage.getItem(BIO_KEY)?`<button class="btn" style="margin-top:16px" data-act="bioUnlock">Utiliser l'empreinte / Face ID</button>`:""}<button class="forgot" data-act="lkForgot">Code oublié ?</button>`;

async function lockKey(v){
  if(lockUntil>Date.now()){ renderLock(); return; }
  if(v==="del"){ lockBuf=lockBuf.slice(0,-1); lockMsg=""; renderLock(); return; }
  if(lockBuf.length>=cfg.pin.len) return;
  lockBuf+=v; renderLock();
  if(lockBuf.length===cfg.pin.len){
    const ok=(await hashPin(lockBuf,cfg.pin.salt))===cfg.pin.hash;
    if(ok){ locked=false; unlocked=true; lockTries=0; lastActive=Date.now(); renderLock(); }
    else { lockTries++; lockBuf=""; lockMsg="Code incorrect";
      if(lockTries>=5){ lockUntil=Date.now()+30000; lockTries=0; const iv=setInterval(()=>{ if(!locked||lockUntil<=Date.now()){ clearInterval(iv); lockMsg=""; } if(locked) renderLock(); },1000); }
      renderLock(true); }
  }
}
function sheetPin(s){
  const titles={set:"Activer un code",change:"Changer le code",off:"Désactiver le code"};
  const prompts={current:"Entre ton code actuel",new:"Choisis un nouveau code",confirm:"Confirme le nouveau code"};
  const len=s.stage==="current"?cfg.pin.len:s.len;
  let h=sheetHead(titles[s.purpose])+`<div style="text-align:center"><div class="q">${prompts[s.stage]}</div>`;
  if(s.stage==="new") h+=`<div class="seg" style="max-width:260px;margin:0 auto 12px">${[4,6].map(n=>`<button type="button" data-act="pinLen" data-v="${n}" class="${s.len===n?"on":""}">${n} chiffres</button>`).join("")}</div>`;
  h+=`${pdots(s.buf.length,len,s.shake)}<div class="pmsg" role="alert">${esc(s.msg||"")}</div>${keypad("pk")}</div>`;
  s.shake=false; return h;

async function pinKey(s,v){
  const len=s.stage==="current"?cfg.pin.len:s.len;
  if(v==="del"){ s.buf=s.buf.slice(0,-1); s.msg=""; renderSheet(); return; }
  if(s.buf.length>=len) return;
  s.buf+=v; renderSheet(); if(s.buf.length<len) return;
  const entered=s.buf; s.buf="";
  if(s.stage==="current"){
    if((await hashPin(entered,cfg.pin.salt))!==cfg.pin.hash){ s.msg="Code incorrect"; s.shake=true; renderSheet(); return; }
    if(s.purpose==="off"){ cfg.pin=null; closeSheet(); changed(["config"]); toast("Code désactivé"); return; }
    s.stage="new"; s.msg=""; renderSheet(); return;
  }
  if(s.stage==="new"){ s.first=entered; s.stage="confirm"; s.msg=""; renderSheet(); return; }
  if(entered!==s.first){ s.stage="new"; s.first=""; s.msg="Les deux codes ne correspondent pas. Recommence."; s.shake=true; renderSheet(); return; }
  const salt=uid8()+uid8();
  cfg.pin={salt,hash:await hashPin(entered,salt),len:s.len,timeout:cfg.pin?cfg.pin.timeout:1};
  unlocked=true; closeSheet(); changed(["config"]); toast(s.purpose==="set"?"Code activé":"Code changé");
}

function calcEval(expr){
  const t=expr.replace(/\s/g,"").replace(/,/g,".").match(/(\d*\.?\d+|\d+\.|[+\-×÷])/g); if(!t) return NaN;
  const tok=[]; for(let i=0;i<t.length;i++){ const x=t[i]; if("+-×÷".includes(x)){ if(!tok.length||"+-×÷".includes(tok[tok.length-1])){ if(x==="-"&&i+1<t.length&&!"+-×÷".includes(t[i+1])){ tok.push(-parseFloat(t[++i])); continue; } return NaN; } tok.push(x); } else tok.push(parseFloat(x)); }
  if("+-×÷".includes(tok[tok.length-1])) tok.pop();
  const st=[tok[0]]; for(let i=1;i<tok.length;i+=2){ const op=tok[i], n=tok[i+1]; if(op==="×") st[st.length-1]*=n; else if(op==="÷"){ if(n===0) return NaN; st[st.length-1]/=n; } else st.push(op,n); }
  let r=st[0]; for(let i=1;i<st.length;i+=2) r = st[i]==="+"? r+st[i+1] : r-st[i+1];
  return isFinite(r)?Math.round(r*100)/100:NaN;
}

  {tab:"mois",sel:".b-vb",t:"Dépenses variables",x:"Courses, essence, loisirs : une jauge par catégorie, comparée à ton budget. Vert ça va, orange attention, rouge dépassé."},
  {tab:"mois",sel:".b-sp",t:"Spéciales",x:"Anniversaires, Noël et événements du mois, avec le budget qu'il reste. En décembre, elle se met aux couleurs de Noël."},
  {tab:"mois",sel:".fab",t:"Ajoute ta première opération",x:"Touche le bouton + maintenant : choisis Dépense dans l'éventail, puis la catégorie, le montant et le compte. La visite reprendra ensuite.",tap:true},
  {tab:"mois",sel:"#alertbtn",t:"À vérifier",x:"Ce triangle apparaît s'il y a un doublon ou une incohérence dans le mois. Touche-le pour corriger.",optional:true},
  {tab:"mois",sel:".histbtn",t:"Dernières saisies",x:"Cette horloge montre tes dernières saisies et modifications. Touche une ligne pour la corriger, ou la corbeille pour l'effacer."},
  {tab:"comptes",sel:".accounts,.arrowlist,.bstack",t:"Tes comptes",x:"Le solde de chaque compte, aujourd'hui ou prévu en fin de mois. Touche un compte pour son détail, appui long pour le déplacer."},
  {tab:"annee",sel:".ytiles,.yblocks",t:"Ton année",x:"Tes chiffres clés et des graphiques. Appui long sur l'un d'eux pour le déplacer ou le masquer."},
  {tab:"reglages",sel:'[data-act="openPlans"]',t:"Événements prévus",x:"Salaire, prélèvements, budgets, virements : tout ce qui revient se règle ici, rangé par type, avec une loupe pour chercher. Le gros bouton du dessus en crée un nouveau, pas à pas."},
  {tab:"reglages",sel:'[data-act="openCats"]',t:"Catégories",x:"Chaque catégorie est marquée fixe, variable ou les deux : seules les bonnes te sont proposées quand tu saisis. Tu peux aussi les réordonner et les fusionner."},
  {tab:"reglages",sel:'[data-act="openDisplay"]',t:"Affichage",x:"Thème, arrière-plan et présentation des onglets Comptes et Année : personnalise l'appli à ton goût."},
  {tab:"reglages",sel:'[data-act="openSecurity"]',local:true,t:"Pense à sauvegarder",x:"Tes données sont seulement sur cet appareil. Télécharge une sauvegarde de temps en temps et garde-la dans tes fichiers."},
  {tab:"reglages",sel:'[data-act="startTour"]',t:"À toi de jouer !",x:"Tu peux revoir cette visite à tout moment ici. Bonne gestion !"}];
let TR=null;
function startTour(){ closeSheet(); if(FAN) closeFan(); const keep=ui.tab, list=[];
  TOUR.filter(s=>!s.local||LOCAL_ONLY).forEach(st=>{ if(ui.tab!==st.tab){ ui.tab=st.tab; render(); } const t=st.sel.split(",").map(x=>document.querySelector(x)).find(Boolean); if(t&&t.getClientRects().length) list.push(st); });
  if(ui.tab!==keep){ ui.tab=keep; render(); } TR={i:0,list}; tourShow(); }
function tourEnd(){ TR=null; const el=document.getElementById("tour"); if(el) el.remove(); }
function tourSteps(){ return TR&&TR.list?TR.list:TOUR.filter(s=>!s.local||LOCAL_ONLY); }
function tourShow(){
  if(!TR) return; const L=tourSteps(), st=L[TR.i]; if(!st){ tourEnd(); return; }
  if(st.tab&&ui.tab!==st.tab){ ui.tab=st.tab; render(); window.scrollTo(0,0); }
  setTimeout(()=>{ if(!TR) return; const t=st.sel.split(",").map(x=>document.querySelector(x)).find(Boolean);
    if(!t||!t.getClientRects().length){ TR.i++; tourShow(); return; }
    if(getComputedStyle(t).position!=="fixed") t.scrollIntoView({block:"center",behavior:"instant"});
    setTimeout(()=>tourDraw(t,st,L),200); },80);
}
function tourDraw(t,st,L){
  if(!TR) return; let el=document.getElementById("tour"); if(!el){ el=document.createElement("div"); el.id="tour"; document.body.appendChild(el); }
  const r=t.getBoundingClientRect(), pad=6, top=Math.max(4,r.top-pad), hh=Math.min(innerHeight-top-4,r.height+pad*2), below=r.top+r.height/2<innerHeight/2;
  el.innerHTML=`<div class="tback" ${st.tap?'style="pointer-events:none"':""}></div><div class="thole" style="top:${top}px;left:${Math.max(4,r.left-pad)}px;width:${Math.min(innerWidth-8,r.width+pad*2)}px;height:${hh}px"></div>
  <div class="tbub" role="dialog" aria-live="polite" style="${below?`top:${Math.min(innerHeight-220,top+hh+12)}px`:`bottom:${Math.min(innerHeight-220,innerHeight-top+12)}px`}"><small>${TR.i+1} / ${L.length}</small><b>${esc(st.t)}</b><p>${esc(st.x)}</p><div class="tact"><button class="btn sm ghost" data-tour="skip">${TR.i===L.length-1?"":"Arrêter la visite"}</button>${st.tap?`<button class="btn sm" data-tour="next">Passer cette étape</button>`:`<button class="btn sm primary" data-tour="next">${TR.i===L.length-1?"Terminer":"Suivant"}</button>`}</div></div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tour]"); if(b){ e.preventDefault(); e.stopPropagation(); if(b.dataset.tour==="skip") tourEnd(); else if(TR){ TR.i++; tourShow(); } return; }
  if(TR&&!TR.waiting){ const st=tourSteps()[TR.i]; if(st&&st.tap&&e.target.closest(st.sel)){ TR.waiting=true; const el=document.getElementById("tour"); if(el) el.remove(); } }
},true);
setInterval(()=>{ if(TR&&TR.waiting&&!stack.length&&!FAN){ TR.waiting=false; TR.i++; tourShow(); } },500);
addEventListener("resize",()=>{ if(TR&&!TR.waiting) tourShow(); });

/* ---------- bouton retour Android ---------- */
window.__appBack=function(){
  if(typeof TR!=="undefined"&&TR){ tourEnd(); return true; }
  if(FAN){ closeFan(); return true; }
  const calc=document.getElementById("calc"), cal=document.getElementById("cal");
  if(calc&&calc.classList.contains("on")){ calcKey("cancel"); return true; }
  if(cal&&cal.classList.contains("on")){ calKey("cancel"); return true; }
  if(stack.length){ if(topS().type==="onboard") return true; if(stack.length>1) popSheet(); else closeSheet(); return true; }
  if(ui.tab!=="mois"){ ui.tab="mois"; render(); window.scrollTo(0,0); return true; }
  return false;
};
/* ---------- fermer en glissant vers le bas ---------- */
let SW=null;
function swipeClose(){ const s=topS(); if(s&&s.type==="wizard"&&typeof wizSteps==="function"){ const st=wizSteps(s.d), i=st.indexOf(s.d.step); if(i>0&&!(s.d.id&&s.d.step==="recap")){ s.d.step=st[i-1]; s.err=""; renderSheet(); return; } } closeSheet(); }
document.addEventListener("touchstart",e=>{
  SW=null; if(e.touches.length!==1||(typeof GD!=="undefined"&&GD&&GD.active)) return;
  const t=e.target, pad=t.closest("#calc .pad-sheet,#cal .pad-sheet");
  if(pad){ if(!t.closest(".calc-top,.calc-disp,.cal-head")||t.closest("button")) return; SW={el:pad,sc:null,close:()=>{ if(pad.parentElement.id==="calc") calcKey("cancel"); else calKey("cancel"); }}; }
  else { const el=document.getElementById("sheet"); if(!el||!el.classList.contains("open")||!stack.length||!el.contains(t)) return; if(topS().type==="onboard") return;
    if(t.closest("input,textarea,select,.grip,.vpager,[data-dg]")) return; const head=t.closest(".grab,.sh"); if(!head&&el.scrollTop>2) return;
    SW={el,sc:el,head:!!head,close:swipeClose}; }
  Object.assign(SW,{y:e.touches[0].clientY,x:e.touches[0].clientX,t:Date.now(),dy:0,on:false});
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!SW) return; const dy=e.touches[0].clientY-SW.y, dx=e.touches[0].clientX-SW.x;
  if(!SW.on){ if(Math.abs(dx)>Math.abs(dy)+4||dy<-6){ SW=null; return; } if(dy<8) return; if(SW.sc&&!SW.head&&SW.sc.scrollTop>2){ SW=null; return; } SW.on=true; SW.el.style.transition="none"; }
  SW.dy=Math.max(0,dy); SW.el.style.transform=`translateY(${SW.dy}px)`; if(e.cancelable) e.preventDefault();
},{passive:false});
function endSW(){ if(!SW) return; const w=SW; SW=null; if(!w.on) return; const v=w.dy/Math.max(1,Date.now()-w.t); w.el.style.transition="";
  if(w.dy>w.el.offsetHeight*0.28||v>0.55){ w.el.style.transform=""; w.close(); } else w.el.style.transform=""; }
document.addEventListener("touchend",endSW); document.addEventListener("touchcancel",endSW);

boot().catch(e=>gate("error",FR_ERR(e&&e.message)));
</script>
