<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes Comptes</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F6EFE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes Comptes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* Plan : lin et terracotta — papier chaud, encre brune, chiffres en Fraunces. Une colonne mobile : saisie rapide en haut, comptes, résultat, puis détail. */
:root{
  --bg:#F6EFE6; --surface:#FFFBF5; --surface-2:#F2E9DD; --ink:#2B2018; --muted:#86705E; --line:#E7DACA;
  --accent:#C2603A; --accent-soft:#F6E2D6; --on-accent:#FFFBF5; --ochre:#C98F33;
  --pos:#3B7A4C; --pos-soft:#E5EFDF; --neg:#A8352B; --neg-soft:#F6DFD8; --warn:#A86F12; --warn-soft:#F8EAD0;
  --display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(60,35,15,.05), 0 8px 24px rgba(60,35,15,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1511; --surface:#241C17; --surface-2:#2E241D; --ink:#F3E8DC; --muted:#B19C88; --line:#3B3027;
    --accent:#E38B60; --accent-soft:#3B251B; --on-accent:#1B1511; --ochre:#E2B262;
    --pos:#7FC08D; --pos-soft:#1F2E22; --neg:#EF8774; --neg-soft:#3A201A; --warn:#E8B04B; --warn-soft:#33270F;
    --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1511; --surface:#241C17; --surface-2:#2E241D; --ink:#F3E8DC; --muted:#B19C88; --line:#3B3027;
  --accent:#E38B60; --accent-soft:#3B251B; --on-accent:#1B1511; --ochre:#E2B262;
  --pos:#7FC08D; --pos-soft:#1F2E22; --neg:#EF8774; --neg-soft:#3A201A; --warn:#E8B04B; --warn-soft:#33270F;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:540px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:540px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-size:19px;font-weight:600;font-style:italic}
.app{font-weight:800;letter-spacing:-.01em}
.ver{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--pos)} .dot.warn{background:var(--warn)} .dot.err{background:var(--neg)}
.period{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;gap:8px}
.period h1{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.1;margin:0;text-transform:capitalize;text-wrap:balance;text-align:center;letter-spacing:-.01em}
.period small{display:block;text-align:center;color:var(--muted);font-size:12px;font-family:var(--body);text-transform:none;margin-top:3px;font-weight:600}
.iconbtn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
button.card{text-align:left;width:100%}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
/* duo cards */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo-c{padding:14px;display:flex;flex-direction:column;gap:4px;min-height:132px}
.duo-c .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.duo-c .ic svg{width:17px;height:17px}
.duo-c b{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.05}
.duo-c small{font-size:12px;color:var(--muted)}
.duo-c .go{margin-top:auto;font-size:12px;font-weight:700;color:var(--accent)}
/* comptes */
.accounts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.acc{padding:12px 14px 12px 16px;position:relative;overflow:hidden}
.acc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--accent))}
.acc .n{font-size:12px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:6px}
.acc .n span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .lbl{font-size:11px;color:var(--muted);margin-top:6px}
.acc .v{font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.acc .s{font-size:12px;color:var(--muted)}
.acc .s b{color:var(--ink);font-weight:700}
.cur{font-size:10px;font-weight:800;letter-spacing:.05em;padding:1px 5px;border-radius:5px;border:1px solid currentColor;opacity:.8;flex:none}
.cdot{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
/* résultat */
.hero{padding:18px 18px 16px;margin-top:12px}
.big{font-family:var(--display);font-weight:500;font-size:50px;line-height:1;margin:8px 0 6px;letter-spacing:-.02em}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px}
.verdict.pos{background:var(--pos-soft)} .verdict.neg{background:var(--neg-soft)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-weight:700;font-size:15px}
.zones{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.zone{font-size:12px;padding:5px 9px;border-radius:9px;background:var(--surface-2)}
.zone b{font-weight:700}
section.block{margin-top:24px}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 8px}
.bh h2{font-family:var(--display);font-size:20px;margin:0;font-weight:500;letter-spacing:-.01em}
.bh .t{font-size:12px;color:var(--muted);text-align:right}
.list{padding:2px 0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.list>.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .l{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{text-align:right;white-space:nowrap}
.row .amt b{font-weight:700;display:block}
.row .amt small{font-size:12px;color:var(--muted)}
.st{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line);color:var(--muted);background:none;padding:0}
.st svg{width:15px;height:15px}
.st.done{border:0;background:var(--pos-soft);color:var(--pos)}
.st.late{border:1.5px solid var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:1px}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:7px;border-radius:7px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pos);border-radius:7px}
.bar i.over{background:var(--neg)} .bar i.near{background:var(--warn)}
.empty{padding:22px 18px}
.empty h3{font-family:var(--display);font-weight:500;font-size:24px;margin:0 0 6px}
.empty p{margin:0 0 14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 35%,var(--line))}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:11px}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.person{padding:10px}
.person .n{font-size:12px;color:var(--muted);font-weight:700}
.person b{display:block;font-size:15px}
.person small{font-size:11px;color:var(--muted)}
/* réglages */
.create{display:flex;align-items:center;gap:14px;padding:18px;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.create .ic{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--on-accent) 18%,transparent);display:grid;place-items:center;flex:none}
.create .ic svg{width:24px;height:24px}
.create b{font-family:var(--display);font-weight:500;font-size:21px;display:block}
.create small{opacity:.85;font-size:13px}
.navcard{display:flex;align-items:center;gap:14px;padding:16px}
.navcard .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.navcard .ic svg{width:21px;height:21px}
.navcard .main{flex:1;min-width:0}
.navcard b{display:block;font-weight:800}
.navcard small{color:var(--muted);font-size:12px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.navcard>svg{width:18px;height:18px;color:var(--muted)}
.sgrid{display:grid;gap:10px}
.pad{padding:14px}
.note{font-size:12px;color:var(--muted);margin:8px 2px 0}
.banner{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:13px;background:var(--warn-soft)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:64px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);height:100%;justify-content:center}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--accent)}
.fab{width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto;transform:translateY(-14px);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.fab svg{width:26px;height:26px}
/* feuille */
.scrim{position:fixed;inset:0;background:rgba(30,18,10,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:540px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;max-height:94%;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh h3{font-family:var(--display);font-weight:500;font-size:25px;margin:0;flex:1;line-height:1.15}
.sh h3 small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.steps{display:flex;gap:5px;margin:-4px 0 14px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.q{font-family:var(--display);font-size:20px;font-weight:500;margin:4px 0 12px}
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.tile.on{border-color:var(--accent);background:var(--accent-soft)}
.tile .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-weight:800;font-size:16px}
.tile span{font-size:13px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:700;min-height:52px;display:flex;flex-direction:column;justify-content:center}
.cbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.cbtn small{font-weight:600;font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.chipbtn.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface))}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(60,35,15,.12)}
.form{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:700;color:var(--muted)}
.fld small{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:13px;background:var(--surface-2);padding:10px 12px;font-size:16px;min-width:0}
input::placeholder{color:color-mix(in srgb,var(--muted) 55%,transparent)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
textarea{min-height:110px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.amount-in{font-family:var(--display);font-size:36px;min-height:62px;padding:6px 14px}
.live{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}
.err{color:var(--neg);font-size:13px;font-weight:700}
.actions{display:grid;gap:8px;margin-top:8px}
.recap{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.recap .rl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.recap .rl:first-child{border-top:0}
.recap .rl span{color:var(--muted);font-size:13px;flex:none}
.recap .rl b{font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
.recap .tot{padding:16px 14px;background:var(--surface-2);text-align:center}
.recap .tot b{font-family:var(--display);font-size:36px;font-weight:500;display:block}
.irow{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.irow.off{opacity:.55}
.irow .hd{display:flex;align-items:center;gap:10px}
.irow .hd .main{flex:1;min-width:0}
.irow .hd b{display:block}
.irow .hd small{color:var(--muted);font-size:12px}
.vrow{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow b{display:block}
.vrow small{display:block;font-size:12px;color:var(--muted)}
.vrow input{text-align:right;font-weight:700}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:50;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;display:flex;gap:14px;align-items:center;transition:all .2s;pointer-events:none;max-width:92%}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:var(--ochre);font-weight:800;padding:0}
.chart{padding:14px 10px 8px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 8px 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tr.cur td{background:var(--accent-soft)}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--line)}
.tbl-wrap{overflow-x:auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px 14px}
.stat span{font-size:12px;color:var(--muted);display:block}
.stat b{font-size:17px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sumgrid div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.sumgrid span{display:block;font-size:12px;color:var(--muted)}
.sumgrid b{font-size:16px}
.subed{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.subed:first-child{border-top:0}
.subed .top{display:flex;gap:8px;align-items:center}
.subed .top input{flex:1}
.mini{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--neg);display:grid;place-items:center;padding:0}
.mini svg{width:17px;height:17px}
h4{margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;overflow:auto;padding:32px 18px calc(24px + env(safe-area-inset-bottom))}
.gate.on{display:block}
.gin{max-width:420px;margin:0 auto;text-align:center}

<script>
"use strict";
const VERSION = "2.0";
const PERSONS = [["famille","Famille"],["william","William"],["ingrid","Ingrid"],["leonard","Léonard"]];
const FREQS = [["monthly","Mensuelle",1],["once","Ponctuelle",0],["weekly","Hebdomadaire",52/12],["biweekly","Toutes les 2 semaines",26/12],["bimonthly","Tous les 2 mois",1/2],["quarterly","Trimestrielle",1/3],["semiannual","Semestrielle",1/6],["annual","Annuelle",1/12]];
const FREQ_STEP = {monthly:1,bimonthly:2,quarterly:3,semiannual:6,annual:12};
const PALETTE = ["#C2603A","#C98F33","#6F8B4E","#4F6D8A","#A23E2E","#8A4F6D","#3F8A86","#9A8466"];
const DEF_COLORS = {cc:"#C2603A",joint:"#4F6D8A",ldd:"#C98F33",chf:"#A23E2E",cash:"#6F8B4E"};
const LS = "mescomptes.v1";
const KIND_L = {expense:"Dépense",income:"Revenu",transfer:"Virement"};

/* ---------- dates & formats ---------- */
const pad = n => String(n).padStart(2,"0");
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const TODAY = todayISO(), CUR_YM = TODAY.slice(0,7);
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s||"");
const daysIn = (y,m) => new Date(Date.UTC(y,m,0)).getUTCDate();
function addMonths(ym,k){ let [y,m]=ym.split("-").map(Number); m+=k; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return `${y}-${pad(m)}`; }
const lastDay = ym => { const [y,m]=ym.split("-").map(Number); return `${ym}-${pad(daysIn(y,m))}`; };
const isoUTC = t => new Date(t).toISOString().slice(0,10);
function monthName(ym,opt="long"){ const [y,m]=ym.split("-").map(Number); return new Intl.DateTimeFormat("fr-FR",{month:opt,timeZone:"UTC"}).format(Date.UTC(y,m-1,1)); }
function shortDate(iso){ if(!isISO(iso)) return ""; const [y,m,d]=iso.split("-").map(Number); return new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",timeZone:"UTC"}).format(Date.UTC(y,m-1,d)); }
function longDate(iso){ if(!isISO(iso)) return ""; const [y,m,d]=iso.split("-").map(Number); return new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(Date.UTC(y,m-1,d)); }
const NF = {};
function fmt(n,cur="EUR",dec=2){ const k=cur+dec; NF[k]=NF[k]||new Intl.NumberFormat("fr-FR",{style:"currency",currency:cur,minimumFractionDigits:dec,maximumFractionDigits:dec}); return NF[k].format(Math.abs(n)<0.005?0:n); }
const sfmt = (n,cur="EUR",dec=2) => (n>0.004?"+":"")+fmt(n,cur,dec);
const cls = n => n>0.004?"pos":n<-0.004?"neg":"mut";
const num = s => { const v=parseFloat(String(s??"").replace(/[\s  ]/g,"").replace(",",".")); return isFinite(v)?v:NaN; };
const r2 = n => Math.round(n*100)/100;
const numStr = n => n==null||n===""||isNaN(n)?"":String(r2(+n)).replace(".",",");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid8 = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();

/* ---------- configuration ---------- */
function defaultCats(){
  const mk=n=>({id:uid8(),name:n,subs:[]});
  return ["Logement","Courses","Transport","Santé","Assurances","Abonnements","Enfant","Loisirs"].map(mk)
    .concat([{id:uid8(),name:"Anniversaires",special:"birthday",acc:"cc",subs:[]},{id:uid8(),name:"Cadeaux de Noël",special:"christmas",acc:"cc",subs:[]}])
    .concat(["Salaire","Allocations","Frais bancaires","Divers"].map(mk));
}
function defaultAccounts(){
  const d=CUR_YM+"-01";
  return [
    {id:"cc",name:"Compte courant",cur:"EUR",bal:0,balDate:d,color:DEF_COLORS.cc},
    {id:"joint",name:"Compte joint",cur:"EUR",bal:0,balDate:d,color:DEF_COLORS.joint},
    {id:"ldd",name:"Épargne LDD",cur:"EUR",bal:0,balDate:d,color:DEF_COLORS.ldd},
    {id:"chf",name:"Compte CHF",cur:"CHF",bal:0,balDate:d,color:DEF_COLORS.chf},
    {id:"cash",name:"Enveloppe espèces",cur:"EUR",bal:0,balDate:d,color:DEF_COLORS.cash,cash:true}];
}
function defaultCfg(){ return {v:2,accounts:defaultAccounts(),planRate:1.06,planFee:0,categories:defaultCats(),plans:[]}; }
function normCfg(c){
  if(!c) return defaultCfg();
  const out=Object.assign(defaultCfg(),c);
  let accs=Array.isArray(c.accounts)&&c.accounts.length?c.accounts.map((a,i)=>Object.assign({cur:"EUR",bal:0,balDate:CUR_YM+"-01",color:DEF_COLORS[a.id]||PALETTE[i%PALETTE.length]},a)):defaultAccounts();
  if(!(c.v>=2)&&!accs.some(a=>a.id==="cash")) accs.push(defaultAccounts()[4]);
  out.accounts=accs;
  if(!Array.isArray(c.categories)||!c.categories.length) out.categories=defaultCats();
  else if(typeof c.categories[0]==="string"){
    out.categories=c.categories.map(n=>({id:uid8(),name:n,subs:[]}));
    defaultCats().filter(x=>x.special).forEach(x=>{ if(!out.categories.some(y=>y.name===x.name)) out.categories.push(x); });
  }
  out.categories.forEach(k=>{ if(!k.id) k.id=uid8(); if(!Array.isArray(k.subs)) k.subs=[]; k.subs.forEach(s=>{ if(!s.id) s.id=uid8(); }); });
  if(!Array.isArray(out.plans)) out.plans=[];
  out.v=2; return out;
}
let cfg=defaultCfg(), TX={};
const ui={tab:"mois",ym:CUR_YM,year:+CUR_YM.slice(0,4)};
try{ const t=localStorage.getItem(LS+".tab"); if(t) ui.tab=t; }catch(e){}
let mode="loading";
const memo=new Map();
let stack=[];

const accById = id => cfg.accounts.find(a=>a.id===id);
const curOf = id => (accById(id)||{}).cur||"EUR";
const accName = id => (accById(id)||{}).name||"Compte supprimé";
const accColor = id => (accById(id)||{}).color||"#9A8466";
const personName = id => (PERSONS.find(p=>p[0]===id)||[,"Famille"])[1];
const personFromName = n => (PERSONS.find(p=>norm(p[1])===norm(n))||[null])[0];
const freqOf = id => FREQS.find(f=>f[0]===id)||FREQS[0];
const conv = (amt,cur,r) => cur==="CHF"?amt*r:amt;
const catByName = n => cfg.categories.find(c=>c.name===n);
function subOf(catName,subId){ const c=catByName(catName); return c&&subId?c.subs.find(s=>s.id===subId):null; }
function ageOn(birth,iso){ if(!isISO(birth)||!isISO(iso)) return null; return +iso.slice(0,4)-+birth.slice(0,4); }
function nextBirthday(birth){ if(!isISO(birth)) return null; let d=TODAY.slice(0,4)+birth.slice(4); if(d<TODAY) d=(+TODAY.slice(0,4)+1)+birth.slice(4); return d; }
function catLabel(catName,subId){ const s=subOf(catName,subId); return s?`${catName} › ${s.name}`:(catName||""); }

/* ---------- moteur ---------- */
function virtualPlans(){
  const out=[];
  cfg.categories.forEach(c=>{
    if(c.special==="birthday") c.subs.forEach(s=>{ if(isISO(s.birth)&&+s.budget>0) out.push({id:"bd-"+s.id,virtual:true,special:"birthday",kind:"expense",nature:"variable",label:"Anniversaire "+s.name,amount:+s.budget,acc:c.acc||"cc",cat:c.name,sub:s.id,person:personFromName(s.name)||"famille",freq:"annual",date:s.birth}); });
    if(c.special==="christmas") c.subs.forEach(s=>{ if(+s.budget>0) out.push({id:"xm-"+s.id,virtual:true,special:"christmas",kind:"expense",nature:"variable",label:"Noël "+s.name,amount:+s.budget,acc:c.acc||"cc",cat:c.name,sub:s.id,person:personFromName(s.name)||"famille",freq:"annual",date:"2000-12-01"}); });
  });
  return out;
}
function allPlans(){ if(!memo.has("plans")) memo.set("plans",cfg.plans.concat(virtualPlans())); return memo.get("plans"); }
function occurrences(p,ym){
  if(!isISO(p.date)) return [];
  const [sy,sm,sd]=p.date.split("-").map(Number); const [y,m]=ym.split("-").map(Number);
  if(ym<p.date.slice(0,7)) return [];
  if(p.end&&ym>p.end.slice(0,7)) return [];
  const diff=(y-sy)*12+(m-sm), dim=daysIn(y,m); let res=[];
  if(p.freq==="once"){ if(diff===0) res.push(p.date); }
  else if(p.freq==="weekly"||p.freq==="biweekly"){
    const step=(p.freq==="weekly"?7:14)*864e5; let t=Date.UTC(sy,sm-1,sd);
    const a=Date.UTC(y,m-1,1), b=Date.UTC(y,m-1,dim);
    if(t<a) t+=Math.ceil((a-t)/step)*step;
    while(t<=b){ res.push(isoUTC(t)); t+=step; }
  } else { const k=FREQ_STEP[p.freq]||1; if(diff%k===0) res.push(`${ym}-${pad(Math.min(sd,dim))}`); }
  if(p.end) res=res.filter(d=>d<=p.end);
  return res.map(d=>{ let label=p.label; if(p.special==="birthday"){ const s=subOf(p.cat,p.sub); const a=s?ageOn(s.birth,d):null; if(a!=null) label+=` · ${a} ans`; } return {p,date:d,key:p.id+"@"+d,label}; });
}
function planTransferAmounts(p){
  const cross=curOf(p.from)!==curOf(p.to);
  const to=!cross?p.amount:(curOf(p.from)==="CHF"?p.amount*cfg.planRate:p.amount/cfg.planRate);
  return {amtFrom:p.amount,amtTo:r2(to),fee:cross?(+cfg.planFee||0):0};
}
function occAsTx(o){ const p=o.p;
  if(p.kind==="transfer") return Object.assign({kind:"transfer",from:p.from,to:p.to,date:o.date,nature:"fixe"},planTransferAmounts(p));
  return {kind:p.kind,acc:p.acc,amount:p.amount,date:o.date,nature:p.nature,cat:p.cat,person:p.person};
}
function txFlows(t){
  if(t.kind==="income") return [[t.acc,+t.amount]];
  if(t.kind==="expense") return [[t.acc,-t.amount]];
  return [[t.from,-(t.amtFrom+(t.fee||0))],[t.to,+t.amtTo]];
}
const flowFor = (t,acc) => txFlows(t).reduce((s,[id,d])=>s+(id===acc?d:0),0);
const isVarExp = x => x.kind==="expense"&&x.nature==="variable";
function effTx(ym){
  const k="eff:"+ym; if(memo.has(k)) return memo.get(k);
  const list=TX[ym]||[]; const bulk=new Set(list.filter(t=>t.bulk).map(t=>t.cat+"|"+t.acc));
  const r=list.filter(t=>t.bulk||!(isVarExp(t)&&bulk.has(t.cat+"|"+t.acc)));
  memo.set(k,r); return r;
}
const blank = () => ({net:Object.fromEntries(cfg.accounts.map(a=>[a.id,0])),income:0,fixed:0,variable:0,fees:0,cats:{},people:{}});
function addTx(X,t,r){
  for(const [id,d] of txFlows(t)) if(id in X.net) X.net[id]+=d;
  if(t.kind==="income") X.income+=conv(t.amount,curOf(t.acc),r);
  else if(t.kind==="expense"){
    const v=conv(t.amount,curOf(t.acc),r);
    if(t.nature==="variable") X.variable+=v; else X.fixed+=v;
    X.cats[t.cat]=(X.cats[t.cat]||0)+v; const pp=t.person||"famille"; X.people[pp]=(X.people[pp]||0)+v;
  } else if(t.fee){ const v=conv(t.fee,curOf(t.from),r); X.fees+=v; X.cats["Frais de change"]=(X.cats["Frais de change"]||0)+v; }
}
const result = X => X.income-X.fixed-X.variable-X.fees;
const zoneNet = (X,cur) => cfg.accounts.filter(a=>a.cur===cur).reduce((s,a)=>s+(X.net[a.id]||0),0);

function calcMonth(ym){
  if(memo.has(ym)) return memo.get(ym);
  const occ=allPlans().flatMap(p=>occurrences(p,ym)).sort((a,b)=>a.date<b.date?-1:1);
  const tx=effTx(ym).slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  let sf=0,st=0;
  tx.forEach(t=>{ if(t.kind==="transfer"&&curOf(t.from)==="CHF"&&curOf(t.to)==="EUR"){ sf+=t.amtFrom; st+=t.amtTo; } });
  const rP=+cfg.planRate||1, rA=sf>0?st/sf:rP;
  const P=blank(), A=blank();
  occ.forEach(o=>addTx(P,occAsTx(o),rP));
  tx.forEach(t=>addTx(A,t,rA));
  const linked={}; tx.forEach(t=>{ if(t.link) (linked[t.link]=linked[t.link]||[]).push(t); });
  const occKeys=new Set(occ.map(o=>o.key));
  const pointRows=occ.filter(o=>!isVarExp(o.p)).map(o=>{
    const ts=linked[o.key]||[]; const actual=ts.reduce((s,t)=>s+(t.kind==="transfer"?t.amtFrom:t.amount),0);
    return {o,ts,planned:o.p.amount,actual,cur:curOf(o.p.kind==="transfer"?o.p.from:o.p.acc),done:ts.length>0,late:!ts.length&&o.date<TODAY};
  });
  const vmap={}; const vget=(cat,acc)=>{ const k=cat+"|"+acc; return vmap[k]=vmap[k]||{key:k,cat,acc,planned:0,actual:0,tx:[],labels:[],bulk:null}; };
  occ.filter(o=>isVarExp(o.p)).forEach(o=>{ const v=vget(o.p.cat,o.p.acc); v.planned+=o.p.amount; v.labels.push(o.label); });
  tx.filter(isVarExp).forEach(t=>{ const v=vget(t.cat,t.acc); v.actual+=t.amount; v.tx.push(t); if(t.bulk) v.bulk=t; });
  const varRows=Object.values(vmap).sort((a,b)=>b.planned-a.planned||b.actual-a.actual);
  const unplanned=tx.filter(t=>!isVarExp(t)&&!(t.link&&occKeys.has(t.link)));
  let F;
  if(ym<CUR_YM) F=A; else if(ym>CUR_YM) F=P;
  else {
    F=blank(); tx.forEach(t=>addTx(F,t,rA));
    pointRows.filter(r=>!r.done).forEach(r=>addTx(F,occAsTx(r.o),rP));
    varRows.forEach(v=>{ const rem=Math.max(0,v.planned-v.actual); if(rem>0) addTx(F,{kind:"expense",acc:v.acc,amount:rem,nature:"variable",cat:v.cat,person:"famille"},rP); });
  }
  const res={ym,occ,tx,rA,rP,hasRate:sf>0,P,A,F,pointRows,varRows,unplanned};
  memo.set(ym,res); return res;
}
function balanceAt(acc,until){
  const a=accById(acc); if(!a) return 0; let b=+a.bal||0;
  for(const ym in TX){ if(ym<a.balDate.slice(0,7)||ym>until.slice(0,7)) continue; for(const t of effTx(ym)) if(t.date>=a.balDate&&t.date<=until) b+=flowFor(t,acc); }
  return b;
}
function endBalance(acc,ym){
  const k="bal:"+acc+":"+ym; if(memo.has(k)) return memo.get(k);
  let v;
  if(ym<CUR_YM) v=balanceAt(acc,lastDay(ym));
  else if(ym===CUR_YM){ const c=calcMonth(ym); v=balanceAt(acc,lastDay(ym))+((c.F.net[acc]||0)-(c.A.net[acc]||0)); }
  else { const steps=(+ym.slice(0,4)-+CUR_YM.slice(0,4))*12+(+ym.slice(5)-+CUR_YM.slice(5)); v=steps>36?NaN:endBalance(acc,addMonths(ym,-1))+(calcMonth(ym).P.net[acc]||0); }
  memo.set(k,v); return v;
}

/* ---------- stockage : Supabase + chiffrement de bout en bout ---------- */
const CONF_KEY="mc.conf", CACHE_KEY="mc.cache", BIO_KEY="mc.bio", KDF_ITER=600000;
let sb=null, S={uid:null,email:"",key:null,salt:"",iter:KDF_ITER,version:0,dirty:false,saving:false,remember:true}, saveT=null, retryT=null;
const b64=buf=>{ const u=new Uint8Array(buf); let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
const unb64=s=>{ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function deriveKey(pass,saltB64,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass.normalize("NFC")),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(saltB64),iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encryptData(key,obj){ const iv=rnd(12); const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))); return {iv:b64(iv),data:b64(ct)}; }
async function decryptData(key,ivB64,dataB64){ const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(ivB64)},key,unb64(dataB64)); return JSON.parse(new TextDecoder().decode(pt)); }
/* clé mémorisée sur l'appareil (non exportable) */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("mescomptes",1); r.onupgradeneeded=()=>r.result.createObjectStore("keys"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const d=await idb(); return await new Promise(res=>{ const q=d.transaction("keys").objectStore("keys").get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const d=await idb(); await new Promise(res=>{ const t=d.transaction("keys","readwrite"); t.objectStore("keys").put(v,k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
async function idbDel(k){ try{ const d=await idb(); await new Promise(res=>{ const t=d.transaction("keys","readwrite"); t.objectStore("keys").delete(k); t.oncomplete=res; t.onerror=res; }); }catch(e){} }

async function doSave(){
  if(!S.key||!sb) return;
  if(S.saving){ S.dirty=true; return; }
  S.saving=true; S.dirty=false; setSync("saving");
  let enc;
  try{ enc=await encryptData(S.key,{app:"Mes Comptes",v:VERSION,cfg,TX}); putCache(enc,true); }
  catch(e){ S.saving=false; setSync("err"); return; }
  try{
    const {data,error}=await sb.from("mescomptes_vault").update({iv:enc.iv,data:enc.data,version:S.version+1}).eq("user_id",S.uid).eq("version",S.version).select("version");
    if(error) throw error;
    if(data&&data.length){ S.version=data[0].version; putCache(enc,false); setSync("cloud"); }
    else await resolveConflict();
  }catch(e){
    S.dirty=true; setSync(isNetErr(e)?"offline":"err");
    clearTimeout(retryT); retryT=setTimeout(()=>{ if(S.dirty) doSave(); },30000);
  }
  S.saving=false;
  if(S.dirty){ clearTimeout(saveT); saveT=setTimeout(doSave,700); }
}
async function fetchVault(){ const {data,error}=await sb.from("mescomptes_vault").select("salt,iv,data,kdf_iter,version").eq("user_id",S.uid).maybeSingle(); if(error) throw error; return data; }
async function resolveConflict(){
  const row=await fetchVault(); if(!row) return;
  try{ const obj=await decryptData(S.key,row.iv,row.data); applyData(obj); S.version=row.version; putCache({iv:row.iv,data:row.data},false); setSync("cloud"); toast("Données modifiées sur un autre appareil : elles ont été rechargées. Refais ta dernière modification si besoin."); }
  catch(e){ toast("La phrase secrète a changé sur un autre appareil. Reconnecte-toi."); await lockKeyAway(); }
}
function applyData(obj){ cfg=normCfg(obj&&obj.cfg); TX=(obj&&obj.TX)||{}; memo.clear(); render(); }
async function refreshFromRemote(){
  if(!sb||!S.key||S.dirty||S.saving) return;
  try{ const row=await fetchVault(); if(row&&row.version>S.version){ if(row.salt!==S.salt){ await lockKeyAway(); return; } const obj=await decryptData(S.key,row.iv,row.data); applyData(obj); S.version=row.version; putCache({iv:row.iv,data:row.data},false); } setSync("cloud"); }

}
async function lockKeyAway(){ await idbDel("k:"+S.uid); S.key=null; await openVault(); }

const FR_ERR=m=>{ m=String(m||""); if(/Invalid login credentials/i.test(m)) return "E-mail ou mot de passe incorrect."; if(/Email not confirmed/i.test(m)) return "Ton e-mail n'est pas confirmé. Dans Supabase, coche « Auto Confirm User » ou confirme l'utilisateur."; if(/Invalid TOTP|invalid.*code|expired/i.test(m)) return "Code incorrect ou expiré."; if(/rate limit/i.test(m)) return "Trop de tentatives. Patiente quelques minutes."; if(isNetErr(m)) return "Pas de connexion internet."; if(/JWT|Invalid API key|apikey/i.test(m)) return "Clé publique ou URL incorrecte (Réglages de connexion)."; return m||"Erreur inconnue."; };

async function openVault(){

  try{ row=await Promise.race([fetchVault(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("network timeout")),12000))]); }
  catch(e){ if(isNetErr(e)||/timeout/.test(String(e.message))){ offline=true; } else { gate("error",FR_ERR(e.message)); return; } }
  const cache=getCache();
  if(offline){ if(!cache){ gate("error","Pas de connexion et aucune copie sur ce téléphone. Réessaie quand tu es connecté."); return; } row={salt:cache.salt,iv:cache.iv,data:cache.data,kdf_iter:cache.iter,version:cache.version,_pending:cache.pending}; }
  else if(cache&&cache.pending&&row&&cache.version===row.version&&cache.salt===row.salt){ row={salt:cache.salt,iv:cache.iv,data:cache.data,kdf_iter:cache.iter,version:cache.version,_pending:true}; }
  if(!row){ G.f={remember:true}; gate("newpass"); return; }

}

async function gateSubmit(kind){
  if(G.busy) return; G.err="";

    if(kind==="login"){
      const email=(G.f.email||"").trim(), password=G.f.password||"";
      if(!email||!password){ gate("login","Indique ton e-mail et ton mot de passe."); return; }
      G.busy=true; renderGate();
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error){ gate("login",FR_ERR(error.message)); return; }
      G.f.password=""; await afterLogin(data.session);
    } else if(kind==="mfa"){
      const code=(G.f.code||"").replace(/\D/g,""); if(code.length!==6){ gate("mfa","Le code contient 6 chiffres."); return; }
      G.busy=true; renderGate();
      const {data:fl,error:e1}=await sb.auth.mfa.listFactors(); if(e1) throw e1;
      const f=(fl.totp||[]).find(x=>x.status==="verified"); if(!f){ await openVault(); return; }
      const {error}=await sb.auth.mfa.challengeAndVerify({factorId:f.id,code});
      if(error){ G.f.code=""; gate("mfa",FR_ERR(error.message)); return; }
      G.f.code=""; await openVault();
    } else if(kind==="newpass"){
      const p1=G.f.p1||"", p2=G.f.p2||"";
      if(p1.length<12){ gate("newpass","La phrase doit contenir au moins 12 caractères."); return; }
      if(p1!==p2){ gate("newpass","Les deux phrases ne sont pas identiques."); return; }
      G.busy=true; renderGate();

      if(G.importData){ cfg=normCfg(G.importData.cfg); TX=G.importData.TX||{}; }
      const enc=await encryptData(key,{app:"Mes Comptes",v:VERSION,cfg,TX});
      const existing=G.replace;
      let res;
      if(existing){ res=await sb.from("mescomptes_vault").update({salt,iv:enc.iv,data:enc.data,kdf_iter:KDF_ITER,version:(S.version||0)+1}).eq("user_id",S.uid).select("version"); }
      else res=await sb.from("mescomptes_vault").insert({user_id:S.uid,salt,iv:enc.iv,data:enc.data,kdf_iter:KDF_ITER,version:1}).select("version");
      if(res.error){ gate("newpass",FR_ERR(res.error.message)); return; }
      S.key=key; S.salt=salt; S.iter=KDF_ITER; S.version=res.data&&res.data[0]?res.data[0].version:1;
      if(G.f.remember!==false) await idbSet("k:"+S.uid,{key,salt}); else await idbDel("k:"+S.uid);
      G.f={}; G.importData=null; G.replace=false;
      await enterApp({cfg,TX},{iv:enc.iv,data:enc.data},false,false); toast("Coffre chiffré créé");
    } else if(kind==="pass"){
      const p1=G.f.p1||""; if(!p1){ gate("pass","Entre ta phrase secrète."); return; }
      G.busy=true; renderGate();
      const key=await deriveKey(p1,S.salt,S.iter); let obj;
      try{ obj=await decryptData(key,G.row.iv,G.row.data); }catch(e){ G.f.p1=""; gate("pass","Phrase secrète incorrecte."); return; }
      S.key=key; if(G.f.remember!==false) await idbSet("k:"+S.uid,{key,salt:S.salt}); else await idbDel("k:"+S.uid);

async function passSave(s){
  const d=s.d; if(s.busy) return;
  if((d.p1||"").length<12){ s.err="La nouvelle phrase doit contenir au moins 12 caractères."; return renderSheet(); }
  if(d.p1!==d.p2){ s.err="Les deux nouvelles phrases ne sont pas identiques."; return renderSheet(); }
  s.busy=true; s.err=""; renderSheet();
  try{
    const oldKey=await deriveKey(d.old||"",S.salt,S.iter); const row=await fetchVault();
    try{ await decryptData(oldKey,row.iv,row.data); }catch(e){ s.busy=false; s.err="Phrase actuelle incorrecte."; return renderSheet(); }
    const salt=b64(rnd(16)), key=await deriveKey(d.p1,salt,KDF_ITER), enc=await encryptData(key,{app:"Mes Comptes",v:VERSION,cfg,TX});
    const {data,error}=await sb.from("mescomptes_vault").update({salt,iv:enc.iv,data:enc.data,kdf_iter:KDF_ITER,version:row.version+1}).eq("user_id",S.uid).eq("version",row.version).select("version");
    if(error||!data||!data.length) throw error||new Error("Données modifiées entre-temps, réessaie.");
    S.key=key; S.salt=salt; S.iter=KDF_ITER; S.version=data[0].version; putCache(enc,false);
    if(await idbGet("k:"+S.uid)) await idbSet("k:"+S.uid,{key,salt});
    closeSheet(); toast("Phrase secrète changée");
  }catch(e){ s.busy=false; s.err=FR_ERR(e&&e.message); renderSheet(); }
}

async function bioUnlock(silent){
  const id=localStorage.getItem(BIO_KEY); if(!id||!locked) return;
  try{ await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:"public-key",id:unb64(id)}],userVerification:"required",timeout:60000}}); locked=false; unlocked=true; lockTries=0; lastActive=Date.now(); renderLock(); }
  catch(e){ if(!silent){ lockMsg="Empreinte non reconnue, utilise ton code"; renderLock(); } }
}
function download(name,text,type){ const b=new Blob([text],{type}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }

/* ---------- rendu ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===ui.tab));
  document.getElementById("view").innerHTML = ui.tab==="annee"?viewYear():ui.tab==="prev"?viewPlans():ui.tab==="reglages"?viewSettings():viewMonth();
}
function periodBar(title,sub,prev,next){
  return `<div class="period"><button class="iconbtn" data-act="${prev}" aria-label="Précédent">${I.left}</button><h1>${esc(title)}${sub?`<small>${esc(sub)}</small>`:""}</h1><button class="iconbtn" data-act="${next}" aria-label="Suivant">${I.right}</button></div>`;
}
const pageHead=(t,s)=>`<div class="period" style="justify-content:flex-start"><h1 style="text-align:left">${t}<small style="text-align:left">${s}</small></h1></div>`;

      <div class="s">${now==null?"à venir":ym<CUR_YM?"réel":`actuel <b>${fmt(now,a.cur,0)}</b>`}</div></button>`;}).join("")}</div>`;

  const all=(TX[ym]||[]).slice().sort((a,b)=>a.date<b.date?1:-1); const effSet=new Set(c.tx.map(t=>t.id));

  return h;
}
function pointRow(r,acc){
  const p=r.o.p, cur=acc?curOf(acc):r.cur;
  const meta=[shortDate(r.o.date),p.kind==="transfer"?`${accName(p.from)} → ${accName(p.to)}`:accName(p.acc),p.kind!=="transfer"?personName(p.person):null].filter(Boolean).join(" · ");
  let right,st;
  const plannedV=acc?flowFor(occAsTx(r.o),acc):r.planned, actualV=acc?r.ts.reduce((s,t)=>s+flowFor(t,acc),0):r.actual;
  const F=acc?(v=>sfmt(v,cur)):(v=>fmt(v,cur));
  if(r.done){
    const d=actualV-plannedV; const good=acc?d:(p.kind==="income"?d:-d);
    st=`<button class="st done" data-act="editTx" data-id="${r.ts[0].id}" aria-label="Modifier l'opération pointée">${I.check}</button>`;
    right=`<b>${F(actualV)}</b><small class="${Math.abs(d)<0.005?"":cls(good)}">${Math.abs(d)<0.005?"conforme":"écart "+sfmt(d,cur)}</small>`;
    if(!acc&&p.kind==="transfer"){ const t=r.ts[0]; if(curOf(t.from)!==curOf(t.to)) right=`<b>${fmt(t.amtFrom,cur)}</b><small>reçu ${fmt(t.amtTo,curOf(t.to))}${t.fee?" · frais "+fmt(t.fee,cur):""}</small>`; }
  } else {
    st=`<button class="st ${r.late?"late":""}" data-act="point" data-key="${esc(r.o.key)}" aria-label="Pointer au montant prévu">${r.late?I.clock:I.check}</button>`;
    right=`<b class="mut">${F(plannedV)}</b><small>${r.late?'<span class="chip warn">en retard</span>':"à venir"}</small>`;
  }
  return `<div class="row">${st}<button class="main" style="background:none;border:0;padding:0;text-align:left" data-act="pointEdit" data-key="${esc(r.o.key)}"><div class="l">${esc(r.o.label)}</div><div class="m">${esc(meta)}</div></button><div class="amt">${right}</div></div>`;
}
function varRow(v){
  const cur=curOf(v.acc), pct=v.planned>0?v.actual/v.planned:(v.actual>0?1.01:0), rest=v.planned-v.actual;
  const info=v.bulk?"total saisi":`${v.tx.length} opération${v.tx.length>1?"s":""}`;
  const lab=[...new Set(v.labels.filter(l=>l!==v.cat))].join(", ");
  return `<button class="row" data-act="openBulk"><span class="cdot" style="--c:${accColor(v.acc)}"></span><div class="main"><div class="l">${esc(v.cat)} ${v.planned===0?'<span class="chip warn">sans budget</span>':""}</div><div class="m">${esc([accName(v.acc),info,lab].filter(Boolean).join(" · "))}</div>
    <div class="bar"><i class="${pct>1?"over":pct>.85?"near":""}" style="width:${Math.min(100,pct*100).toFixed(1)}%"></i></div></div>
    <div class="amt"><b>${fmt(v.actual,cur,0)} <span class="mut" style="font-weight:600">/ ${fmt(v.planned,cur,0)}</span></b><small class="${rest<0?"neg":""}">${rest<0?"dépassé de "+fmt(-rest,cur,0):"reste "+fmt(rest,cur,0)}</small></div></button>`;
}
function txRow(t,acc,excluded){
  let amt,meta;
  if(acc){ const d=flowFor(t,acc); amt=`<b class="${d>0?"pos":""}">${sfmt(d,curOf(acc))}</b><small>${t.kind==="transfer"?"virement":t.kind==="income"?"revenu":t.bulk?"total":t.nature}</small>`; }
  if(t.kind==="transfer"){
    const cross=curOf(t.from)!==curOf(t.to);
    if(!acc) amt=`<b>${fmt(t.amtFrom,curOf(t.from))}</b><small>${cross?"→ "+fmt(t.amtTo,curOf(t.to)):"virement"}${t.fee?" · frais "+fmt(t.fee,curOf(t.from)):""}</small>`;
    meta=`${shortDate(t.date)} · ${accName(t.from)} → ${accName(t.to)}`;
  } else {
    if(!acc){ const s=t.kind==="income"?1:-1; amt=`<b class="${t.kind==="income"?"pos":""} ${excluded?"mut":""}">${sfmt(s*t.amount,curOf(t.acc))}</b><small>${excluded?"compris dans le total":t.kind==="income"?"revenu":t.bulk?"total du mois":t.nature==="variable"?"variable":"fixe"}${t.link&&!excluded?" · prévu":""}</small>`; }
    meta=`${shortDate(t.date)} · ${catLabel(t.cat,t.sub)} · ${accName(t.acc)}${t.kind!=="income"?" · "+personName(t.person):""}`;
  }
  const color=t.kind==="transfer"?accColor(t.to):accColor(t.acc);
  return `<button class="row" data-act="editTx" data-id="${t.id}"><span class="cdot" style="--c:${color}"></span><div class="main"><div class="l">${esc(t.label)}</div><div class="m">${esc(meta)}</div></div><div class="amt">${amt}</div></button>`;
}

function viewYear(){
  const y=ui.year; let h=periodBar(String(y),"Résumé annuel","prevY","nextY");
  const months=[...Array(12)].map((_,i)=>`${y}-${pad(i+1)}`);
  const rows=months.map(ym=>{ const c=calcMonth(ym); return {ym,c,p:result(c.P),a:ym<=CUR_YM?result(c.A):null,f:result(c.F)}; });
  const tot=k=>rows.reduce((s,r)=>s+(r[k]||0),0);
  const planned=tot("p"), proj=tot("f"), actual=rows.reduce((s,r)=>s+(r.ym<CUR_YM?r.a:0),0), pastPlanned=rows.reduce((s,r)=>s+(r.ym<CUR_YM?r.p:0),0);
  const isPast=y<+CUR_YM.slice(0,4), isFuture=y>+CUR_YM.slice(0,4);
  h+=`<div class="card hero" style="margin-top:0"><div class="eyebrow">${isFuture?"Résultat prévu sur l'année":isPast?"Résultat de l'année":"Projection fin d'année"}</div>
    <div class="big ${cls(proj)}">${sfmt(proj,"EUR",0)}</div><span class="verdict ${proj>=0?"pos":"neg"}">${proj>=0?"Année positive":"Année négative"}</span>
    <div class="kpis"><div class="kpi"><span>Prévu 12 mois</span><b class="${cls(planned)}">${sfmt(planned,"EUR",0)}</b></div>
    <div class="kpi"><span>Réel mois finis</span><b class="${cls(actual)}">${isFuture?"—":sfmt(actual,"EUR",0)}</b></div>
    <div class="kpi"><span>Écart à date</span><b class="${cls(actual-pastPlanned)}">${isFuture?"—":sfmt(actual-pastPlanned,"EUR",0)}</b></div></div></div>`;
  h+=`<section class="block"><div class="bh"><h2>Résultat par mois</h2><div class="t">en euros</div></div><div class="card chart">${yearChart(rows)}<div class="legend"><span><i style="background:var(--line)"></i>Prévu</span><span><i style="background:var(--pos)"></i>Réel / projection</span></div></div></section>`;
  h+=`<section class="block"><div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Mois</th><th>Prévu</th><th>Réel</th><th>Écart</th></tr></thead><tbody>${rows.map(r=>{
    const real=r.ym<CUR_YM?r.a:r.ym===CUR_YM?r.f:null, d=real==null?null:real-r.p;
    return `<tr class="${r.ym===CUR_YM?"cur":""}" data-act="goMonth" data-ym="${r.ym}" style="cursor:pointer"><td style="text-transform:capitalize">${monthName(r.ym,"short")}${r.ym===CUR_YM?' <span class="chip acc">en cours</span>':""}</td><td class="${cls(r.p)}">${sfmt(r.p,"EUR",0)}</td><td class="${real==null?"mut":cls(real)}">${real==null?"—":sfmt(real,"EUR",0)}</td><td class="${d==null?"mut":cls(d)}">${d==null?"—":sfmt(d,"EUR",0)}</td></tr>`;}).join("")}</tbody>
    <tfoot><tr><td>Total</td><td class="${cls(planned)}">${sfmt(planned,"EUR",0)}</td><td class="${cls(proj)}">${sfmt(proj,"EUR",0)}</td><td class="${cls(proj-planned)}">${sfmt(proj-planned,"EUR",0)}</td></tr></tfoot></table></div>
    <p class="note">Le total « Réel » combine les mois terminés, la projection du mois en cours et le prévu des mois à venir. Touche un mois pour l'ouvrir.</p></section>`;
  let inc=0,fix=0,vr=0,fees=0,sav=0,sent=0,recv=0,feesChf=0,nT=0;
  rows.forEach(r=>{ const X=r.c.F; inc+=X.income; fix+=X.fixed; vr+=X.variable; fees+=X.fees; sav+=X.net.ldd||0; });
  months.forEach(k=>effTx(k).forEach(t=>{ if(t.kind==="transfer"&&curOf(t.from)==="CHF"&&curOf(t.to)==="EUR"){ sent+=t.amtFrom; recv+=t.amtTo; feesChf+=t.fee||0; nT++; } }));
  h+=`<section class="block"><div class="bh"><h2>Chiffres clés</h2><div class="t">réel + prévu restant</div></div><div class="stats">
    <div class="card stat"><span>Revenus</span><b>${fmt(inc,"EUR",0)}</b></div><div class="card stat"><span>Dépenses fixes</span><b>${fmt(fix,"EUR",0)}</b></div>
    <div class="card stat"><span>Dépenses variables</span><b>${fmt(vr,"EUR",0)}</b></div><div class="card stat"><span>Épargne LDD</span><b>${sfmt(sav,"EUR",0)}</b></div>
    <div class="card stat"><span>CHF transférés (${nT})</span><b>${fmt(sent,"CHF",0)}</b></div><div class="card stat"><span>Taux moyen obtenu</span><b>${sent>0?(recv/sent).toFixed(4).replace(".",","):"—"}</b></div>
    <div class="card stat"><span>Frais de transfert</span><b>${fmt(feesChf,"CHF",2)}</b></div><div class="card stat"><span>Frais en euros (estimés)</span><b>${fmt(fees,"EUR",0)}</b></div></div></section>`;
  const catP={},catA={};
  rows.forEach(r=>{ for(const k in r.c.P.cats) catP[k]=(catP[k]||0)+r.c.P.cats[k]; if(r.ym<=CUR_YM) for(const k in r.c.A.cats) catA[k]=(catA[k]||0)+r.c.A.cats[k]; });
  const cats=[...new Set([...Object.keys(catP),...Object.keys(catA)])].sort((a,b)=>(catP[b]||0)-(catP[a]||0));
  if(cats.length) h+=`<section class="block"><div class="bh"><h2>Par catégorie</h2><div class="t">prévu 12 mois · réel à date</div></div><div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Catégorie</th><th>Prévu</th><th>Réel</th><th>/ mois</th></tr></thead><tbody>${cats.map(k=>`<tr><td>${esc(k)}</td><td>${fmt(catP[k]||0,"EUR",0)}</td><td>${fmt(catA[k]||0,"EUR",0)}</td><td class="mut">${fmt((catP[k]||0)/12,"EUR",0)}</td></tr>`).join("")}</tbody></table></div></section>`;
  return h;
}
function yearChart(rows){
  const W=340,H=170,pl=42,pr=6,pt=10,pb=22;
  const vals=rows.flatMap(r=>[r.p,r.ym<=CUR_YM?(r.ym<CUR_YM?r.a:r.f):r.p]);
  let mx=Math.max(0,...vals), mn=Math.min(0,...vals); if(mx===mn) mx=100;
  const nice=v=>{ if(v===0) return 0; const e=Math.pow(10,Math.floor(Math.log10(Math.abs(v)))); return Math.sign(v)*Math.ceil(Math.abs(v)/e)*e; };
  mx=nice(mx); mn=nice(mn);
  const y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const gw=(W-pl-pr)/12, bw=Math.min(9,gw/2-2);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Résultat mensuel prévu et réel">`;
  const ticks=new Set([mx,0]); if(mn<0) ticks.add(mn); else if(mx>0) ticks.add(mx/2);
  ticks.forEach(v=>{ s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===0?'stroke-width="1.2"':'stroke-dasharray="3 3"'}/><text x="${pl-5}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${new Intl.NumberFormat("fr-FR",{notation:"compact",maximumFractionDigits:1}).format(v)} €</text>`; });
  rows.forEach((r,i)=>{
    const x=pl+i*gw+gw/2, real=r.ym<CUR_YM?r.a:r.ym===CUR_YM?r.f:null;
    const bar=(v,dx,fill,op)=>{ const y0=y(0),y1=y(v); return `<rect x="${x+dx}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y1-y0))}" rx="2" fill="${fill}" opacity="${op}"/>`; };
    s+=bar(r.p,-bw-1,"var(--line)",1);
    if(real!=null) s+=bar(real,1,real<0?"var(--neg)":"var(--pos)",r.ym===CUR_YM?.55:1);
    s+=`<text x="${x}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="${r.ym===CUR_YM?"var(--ink)":"var(--muted)"}" font-weight="${r.ym===CUR_YM?700:400}">${monthName(r.ym,"narrow").toUpperCase()}</text>`;
  });
  return s+"</svg>";
}

function viewPlans(){

  const sumM=f=>ps.filter(f).reduce((s,p)=>s+conv(p.amount*freqOf(p.freq)[2],curOf(p.kind==="transfer"?p.from:p.acc),cfg.planRate),0);
  const inc=sumM(p=>p.kind==="income"), fix=sumM(p=>p.kind==="expense"&&p.nature!=="variable"), vr=sumM(p=>p.kind==="expense"&&p.nature==="variable");
  const fees=ps.filter(p=>p.kind==="transfer"&&curOf(p.from)!==curOf(p.to)).reduce((s,p)=>s+(+cfg.planFee||0)*freqOf(p.freq)[2]*cfg.planRate,0);

  let h=pageHead("Prévisions","Ce qui est prévu chaque mois");

      const a=p.kind==="transfer"?p.from:p.acc, cur=curOf(a), fq=freqOf(p.freq), ended=p.end&&p.end<TODAY;
      const when=p.virtual?(p.special==="birthday"?"Chaque année le "+shortDate(p.date):"En décembre"):fq[1]+(p.freq==="once"?" · "+shortDate(p.date):FREQ_STEP[p.freq]?" · le "+(+p.date.slice(8)):"");
      const meta=[when,p.kind==="transfer"?`${accName(p.from)} → ${accName(p.to)}`:accName(p.acc),p.kind!=="transfer"?catLabel(p.cat,p.sub):null,p.kind!=="transfer"?personName(p.person):null].filter(Boolean).join(" · ");
      return `<button class="row" data-act="${p.virtual?"openCatByName":"editPlan"}" data-id="${p.virtual?esc(p.cat):p.id}"><span class="cdot" style="--c:${accColor(p.kind==="transfer"?p.to:p.acc)}"></span><div class="main"><div class="l">${esc(p.label)} ${ended?'<span class="chip">terminé</span>':""}</div><div class="m">${esc(meta)}</div></div><div class="amt"><b>${fmt(p.amount,cur)}</b>${fq[2]!==1&&fq[2]>0?`<small>≈ ${fmt(p.amount*fq[2],cur,0)}/mois</small>`:""}</div></button>`;}).join("")}</div></section>`;
  });
  if(!ps.length) h+=`<div class="card empty" style="margin-top:14px"><h3>Rien de prévu pour l'instant</h3><p>Crée ton salaire et les allocations (compte CHF), le transfert CHF → €, tes prélèvements fixes, tes budgets variables et les virements vers le joint, le LDD et l'enveloppe espèces.</p></div>`;

/* ---------- feuilles ---------- */
const topS = () => stack[stack.length-1];
function openSheet(s){ stack=[s]; renderSheet(); document.getElementById("sheet").classList.add("open"); document.getElementById("scrim").classList.add("open"); document.getElementById("sheet").scrollTop=0; }
function pushSheet(s){ stack.push(s); renderSheet(); document.getElementById("sheet").scrollTop=0; }
function popSheet(){ stack.pop(); if(!stack.length) closeSheet(); else renderSheet(); }
function closeSheet(){ stack=[]; document.getElementById("sheet").classList.remove("open"); document.getElementById("scrim").classList.remove("open"); }
function sheetHead(title,sub){ return `<div class="grab"></div><div class="sh">${stack.length>1?`<button class="iconbtn" data-act="back" aria-label="Retour">${I.left}</button>`:""}<h3>${title}${sub?`<small>${sub}</small>`:""}</h3><button class="iconbtn" data-act="close" aria-label="Fermer">${I.close}</button></div>`; }
function renderSheet(){
  const s=topS(), el=document.getElementById("sheet"); if(!s) return;
  const f={wizard:sheetWizard,income:sheetIncome,bulk:sheetBulk,account:sheetAccount,accounts:sheetAccounts,accEdit:sheetAccEdit,cats:sheetCats,catEdit:sheetCatEdit,confirm:sheetConfirm,pin:sheetPin,mfa:sheetMfa,pass:sheetPass}[s.type];
  el.innerHTML=f(s); updateLive();
}
function sheetConfirm(s){ return sheetHead(esc(s.title))+`<p>${esc(s.msg)}</p><div class="actions"><button class="btn danger block" data-act="confirmOk">${esc(s.ok)}</button><button class="btn block" data-act="back">Annuler</button></div>`; }
function askConfirm(title,msg,ok,run){ const c={type:"confirm",title,msg,ok,run}; if(stack.length) pushSheet(c); else openSheet(c); }
const D = () => topS().d;
const inp=(f,type="text",extra="")=>`<input id="f-${f.replace(/[^a-z0-9]/gi,"_")}" data-f="${esc(f)}" type="${type}" value="${esc(D()[f]??"")}" ${extra}>`;
const sel=(f,opts)=>`<select id="f-${f.replace(/[^a-z0-9]/gi,"_")}" data-f="${esc(f)}">${opts.map(([v,l])=>`<option value="${esc(v)}"${String(D()[f])===String(v)?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
const fld=(label,html,hint="")=>`<label class="fld"><span>${label}</span>${html}${hint?`<small>${hint}</small>`:""}</label>`;
const segF=(f,opts,act="set")=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-act="${act}" data-f="${f}" data-v="${esc(v)}" class="${D()[f]===v?"on":""}" aria-pressed="${D()[f]===v}">${l}</button>`).join("")}</div>`;
const accChips=(f,filter)=>`<div class="chips">${cfg.accounts.filter(filter||(()=>true)).map(a=>`<button type="button" class="chipbtn ${D()[f]===a.id?"on":""}" style="--c:${a.color}" data-act="set" data-f="${f}" data-v="${a.id}"><span class="cdot" style="--c:${a.color}"></span>${esc(a.name)}</button>`).join("")}</div>`;

/* ----- assistant pas à pas ----- */
function wizSteps(d){ if(d.kind==="transfer") return ["kind","accounts","amount","recap"]; const s=["kind"]; if(d.kind==="expense") s.push("nature"); return s.concat(["cat","sub","amount","recap"]); }
function newWizard(mode,kind){
  const d={mode,step:"kind",kind:"",nature:"",cat:"",sub:"",amount:"",acc:"cc",date:mode==="tx"?(ui.ym===CUR_YM?TODAY:ui.ym+"-01"):CUR_YM+"-05",person:"famille",label:"",link:"",from:"chf",to:"cc",amtFrom:"",amtTo:"",fee:"",freq:"monthly",end:""};
  if(!accById(d.acc)) d.acc=cfg.accounts[0].id;
  if(kind){ applyKind(d,kind); d.step=wizSteps(d)[1]; }
  return d;
}
function applyKind(d,k){
  d.kind=k; d.link="";
  if(k==="expense"){ d.nature=""; if(!accById(d.acc)||curOf(d.acc)==="CHF") d.acc=accById("cc")?"cc":cfg.accounts[0].id; }
  else { d.nature="fixe"; if(k==="income"&&accById("chf")) d.acc="chf"; }
  if(k==="transfer"){ if(!accById(d.from)) d.from=cfg.accounts[0].id; if(!accById(d.to)||d.to===d.from) d.to=(cfg.accounts.find(a=>a.id!==d.from)||{}).id; }
}
function applySub(d){
  const c=catByName(d.cat), s=c&&c.subs.find(x=>x.id===d.sub); if(!s) return;
  if(c.special==="birthday"){ const ref=d.mode==="tx"?d.date:(nextBirthday(s.birth)||d.date); const a=ageOn(s.birth,ref); d.label=`Anniversaire ${s.name}${a!=null?` (${a} ans)`:""}`; d.person=personFromName(s.name)||d.person; if(d.mode==="plan"&&isISO(s.birth)){ d.date=s.birth; d.freq="annual"; } if(s.budget&&!d.amount) d.amount=numStr(s.budget); }
  else if(c.special==="christmas"){ d.label=`Noël ${s.name}`; d.person=personFromName(s.name)||d.person; if(s.budget&&!d.amount) d.amount=numStr(s.budget); }
}
function pendingOcc(d){
  if(d.mode!=="tx"||!isISO(d.date)) return [];
  if(d.kind==="expense"&&d.nature!=="fixe") return [];
  const c=calcMonth(d.date.slice(0,7));
  return c.pointRows.filter(r=>r.o.p.kind===d.kind&&(!r.done||(d.id&&r.ts.some(t=>t.id===d.id)))).sort((a,b)=>(b.o.p.cat===d.cat)-(a.o.p.cat===d.cat));
}
function validateDraft(d){
  if(!d.kind) return "Choisis dépense, revenu ou virement.";
  if(d.kind==="transfer"){
    if(!d.from||!d.to||d.from===d.to) return "Choisis deux comptes différents.";
    if(!(num(d.amtFrom)>0)) return "Indique le montant envoyé.";
    if(d.mode==="tx"&&curOf(d.from)!==curOf(d.to)&&!(num(d.amtTo)>0)) return "Indique le montant reçu sur "+accName(d.to)+".";
    if(d.fee&&!(num(d.fee)>=0)) return "Les frais doivent être un montant positif.";
  } else {
    if(d.kind==="expense"&&!d.nature) return "Choisis fixe ou variable.";
    if(!d.cat) return "Choisis une catégorie.";
    if(!(num(d.amount)>0)) return "Indique un montant supérieur à 0.";
    if(!accById(d.acc)) return "Choisis un compte.";
  }
  if(!isISO(d.date)) return "Choisis une date.";
  if(d.mode==="plan"&&d.end&&d.end<d.date) return "La date de fin doit être après la première date.";
  return null;
}
function sheetWizard(s){
  const d=s.d, steps=wizSteps(d), idx=steps.indexOf(d.step);
  const title=d.mode==="plan"?(d.id?"Modifier l'événement":"Créer un événement"):(d.id?"Modifier l'opération":"Nouvelle opération");

  let h=sheetHead(title,sub)+`<div class="steps">${steps.map((x,i)=>`<i class="${i<=idx?"on":""}"></i>`).join("")}</div>`;
  if(idx>0&&d.step!=="recap") h+=`<button class="btn ghost sm" style="padding:0;margin:-6px 0 6px" data-act="wzBack">${I.left.replace('<svg','<svg width="16" height="16"')} Étape précédente</button>`;
  const step=d.step;
  if(step==="kind"){
    h+=`<div class="q">Qu'est-ce que c'est ?</div><div class="tiles">
      ${[["expense",I.out,"Dépense","Achat, prélèvement, facture"],["income",I.in,"Revenu","Salaire, allocations, remboursement"],["transfer",I.swap,"Virement","Entre tes comptes, change CHF → €, espèces"]].map(([v,ic,b,t])=>`<button class="tile ${d.kind===v?"on":""}" data-act="wz" data-f="kind" data-v="${v}"><span class="ic">${ic}</span><div><b>${b}</b><span>${t}</span></div></button>`).join("")}</div>`;
  } else if(step==="nature"){
    h+=`<div class="q">Fixe ou variable ?</div><div class="tiles">
      <button class="tile ${d.nature==="fixe"?"on":""}" data-act="wz" data-f="nature" data-v="fixe"><span class="ic">${I.fixed}</span><div><b>Fixe</b><span>Montant régulier : loyer, assurance, abonnement</span></div></button>
      <button class="tile ${d.nature==="variable"?"on":""}" data-act="wz" data-f="nature" data-v="variable"><span class="ic">${I.wave}</span><div><b>Variable</b><span>Au fil du mois : courses, essence, sorties</span></div></button></div>`;
  } else if(step==="cat"){
    h+=`<div class="q">Quelle catégorie ?</div><div class="cgrid">${cfg.categories.map(c=>`<button class="cbtn ${d.cat===c.name?"on":""}" data-act="wz" data-f="cat" data-v="${esc(c.name)}">${esc(c.name)}${c.subs.length?`<small>${c.subs.length} sous-catégorie${c.subs.length>1?"s":""}</small>`:c.special?`<small>${c.special==="birthday"?"prénom et âge":"budget par personne"}</small>`:""}</button>`).join("")}</div>
      <div style="display:flex;gap:8px;margin-top:12px">${inp("newCat","text",'placeholder="Nouvelle catégorie"')}<button class="btn" data-act="wzNewCat">Créer</button></div>`;
  } else if(step==="sub"){
    const c=catByName(d.cat)||{subs:[]};
    h+=`<div class="q">${esc(d.cat)} › sous-catégorie</div><div class="tiles">`;
    if(c.special!=="birthday"&&c.special!=="christmas"||!c.subs.length) h+=`<button class="tile ${!d.sub?"on":""}" data-act="wz" data-f="sub" data-v=""><div><b>Sans sous-catégorie</b><span>Directement dans ${esc(d.cat)}</span></div></button>`;
    h+=c.subs.map(x=>{ let info="";
      if(c.special==="birthday"){ const nb=nextBirthday(x.birth); info=isISO(x.birth)?`${ageOn(x.birth,d.mode==="tx"?d.date:nb)} ans · le ${shortDate(x.birth)}${x.budget?" · budget "+fmt(+x.budget,"EUR",0):""}`:"date de naissance à compléter"; }
      else if(c.special==="christmas") info=x.budget?`budget ${fmt(+x.budget,"EUR",0)}`:"sans budget";
      return `<button class="tile ${d.sub===x.id?"on":""}" data-act="wz" data-f="sub" data-v="${x.id}"><div><b>${esc(x.name)}</b>${info?`<span>${info}</span>`:""}</div></button>`; }).join("")+`</div>`;
    h+=`<h4>${c.special==="birthday"?"Ajouter un anniversaire":c.special==="christmas"?"Ajouter une personne":"Nouvelle sous-catégorie"}</h4><div class="form">`;
    if(c.special==="birthday") h+=`<div class="grid2">${fld("Prénom",inp("nsName","text",'placeholder="Léonard"'))}${fld("Date de naissance",inp("nsBirth","date"))}</div>${fld("Budget cadeau (€)",inp("nsBudget","text",'inputmode="decimal" placeholder="50"'))}`;
    else if(c.special==="christmas") h+=`<div class="grid2">${fld("Prénom",inp("nsName","text",'placeholder="Mamie"'))}${fld("Budget (€)",inp("nsBudget","text",'inputmode="decimal" placeholder="40"'))}</div>`;
    else h+=fld("Nom",inp("nsName","text",'placeholder="Ex. Boulangerie"'));
    h+=`<button class="btn" data-act="wzNewSub">Créer et choisir</button></div>`;
  } else if(step==="accounts"){
    h+=`<div class="q">Entre quels comptes ?</div><div class="form">${fld("De",accChips("from"))}${fld("Vers",accChips("to",a=>a.id!==d.from))}</div><div class="actions"><button class="btn primary block" data-act="wzNext">Continuer</button></div>`;
  } else if(step==="amount"){
    h+=`<div class="q">Montant et détails</div><div class="form">`;
    if(d.kind==="transfer"){
      const cross=curOf(d.from)!==curOf(d.to);

function wzAdvance(s){ const d=s.d, st=wizSteps(d), i=st.indexOf(d.step); s.err=""; d.step=st[Math.min(st.length-1,i+1)]; }
function findOcc(key){ const i=key.indexOf("@"); const p=allPlans().find(x=>x.id===key.slice(0,i)); if(!p) return null; const date=key.slice(i+1); const o=occurrences(p,date.slice(0,7)).find(x=>x.key===key); return o||{p,date,key,label:p.label}; }

}

function planToDraft(p){

}
function findTx(id){ for(const ym in TX){ const i=TX[ym].findIndex(t=>t.id===id); if(i>=0) return {ym,i,t:TX[ym][i]}; } return null; }
function removeTx(id,docs){ const f=findTx(id); if(f){ TX[f.ym].splice(f.i,1); docs.add("tx-"+f.ym); } }
function upsertTx(t,docs){ removeTx(t.id,docs); const ym=t.date.slice(0,7); (TX[ym]=TX[ym]||[]).push(t); docs.add("tx-"+ym); }
function wzSave(s){

/* ----- revenus du mois ----- */
function openIncome(){
  const ym=ui.ym, c=calcMonth(ym);
  const rows=c.pointRows.filter(r=>r.o.p.kind==="income"||(r.o.p.kind==="transfer"&&curOf(r.o.p.from)!==curOf(r.o.p.to)));
  const d={};
  rows.forEach(r=>{ const k=r.o.key, t=r.ts[0], p=r.o.p;
    d["on:"+k]=r.done||r.o.date<=TODAY; d["date:"+k]=t?t.date:r.o.date;
    if(p.kind==="transfer"){ const pa=planTransferAmounts(p); d["from:"+k]=numStr(t?t.amtFrom:pa.amtFrom); d["to:"+k]=numStr(t?t.amtTo:pa.amtTo); d["fee:"+k]=numStr(t?t.fee:pa.fee); }
    else d["amt:"+k]=numStr(t?t.amount:p.amount); });
  openSheet({type:"income",ym,keys:rows.map(r=>r.o.key),d});
}
function sheetIncome(s){
  const c=calcMonth(s.ym), d=s.d;
  let h=sheetHead("Revenus du mois",`${monthName(s.ym)} ${s.ym.slice(0,4)}`);
  if(!s.keys.length) h+=`<div class="card empty"><p style="margin:0 0 12px">Aucun revenu ni transfert CHF → € prévu ce mois-ci. Crée-les comme événements pour les retrouver ici chaque mois.</p><button class="btn" data-act="newPlanIncome">Créer un revenu prévu</button></div>`;
  h+=`<div class="form">`;
  s.keys.forEach(k=>{
    const r=c.pointRows.find(x=>x.o.key===k); if(!r) return; const p=r.o.p, on=!!d["on:"+k];
    h+=`<div class="irow ${on?"":"off"}"><label class="hd"><input type="checkbox" data-f="on:${esc(k)}" ${on?"checked":""}><span class="main"><b>${esc(r.o.label)}</b><small>${p.kind==="transfer"?`${esc(accName(p.from))} → ${esc(accName(p.to))}`:esc(accName(p.acc))} · prévu ${fmt(p.amount,r.cur)} le ${shortDate(r.o.date)}</small></span></label>`;
    if(p.kind==="transfer") h+=`<div class="grid2">${fld(`Envoyé (${curOf(p.from)})`,inp("from:"+k,"text",'inputmode="decimal"'))}${fld(`Reçu (${curOf(p.to)})`,inp("to:"+k,"text",'inputmode="decimal"'))}</div><div class="grid2">${fld(`Frais (${curOf(p.from)})`,inp("fee:"+k,"text",'inputmode="decimal" placeholder="0"'))}${fld("Date",inp("date:"+k,"date"))}</div><div class="live" data-live="irate" data-k="${esc(k)}"></div>`;

  });

  h+=`</div><p class="note">Coché = reçu ou effectué. Décoche ce qui n'est pas encore arrivé.</p><div class="actions">${s.keys.length?`<button class="btn primary block" data-act="saveIncome">Valider les revenus</button>`:""}<button class="btn block" data-act="otherIncome">Ajouter un autre revenu</button></div>`;
  return h;

function saveIncome(s){
  const c=calcMonth(s.ym), d=s.d, plan=[];
  for(const k of s.keys){
    const r=c.pointRows.find(x=>x.o.key===k); if(!r) continue; const p=r.o.p;
    if(!d["on:"+k]){ plan.push({r,off:true}); continue; }
    const date=d["date:"+k]; if(!isISO(date)){ s.err=`Choisis une date pour « ${r.o.label} ».`; return renderSheet(); }
    const base=r.ts[0]?Object.assign({},r.ts[0]):{id:uid8(),kind:p.kind,label:r.o.label,link:k,person:p.person||"famille",nature:"fixe"};
    base.date=date;
    if(p.kind==="transfer"){ base.from=p.from; base.to=p.to; base.amtFrom=r2(num(d["from:"+k])); base.amtTo=r2(num(d["to:"+k])); base.fee=r2(num(d["fee:"+k])||0);
      if(!(base.amtFrom>0&&base.amtTo>0)){ s.err=`Indique le montant envoyé et reçu pour « ${r.o.label} ».`; return renderSheet(); } }
    else { base.amount=r2(num(d["amt:"+k])); base.acc=p.acc; base.cat=p.cat; base.sub=p.sub||"";

    plan.push({r,t:base});

  plan.forEach(x=>{ if(x.off) x.r.ts.forEach(t=>removeTx(t.id,docs)); else upsertTx(x.t,docs); });
  closeSheet(); changed([...docs,"tx-"+s.ym]); toast("Revenus du mois enregistrés");
